# Headroom Configuration Examples for Omnigent Agents

---
# Example 1: Basic agent with Headroom enabled (default settings)
name: code-reviewer
harness: claude-sdk
model: claude-sonnet-5

compaction:
  trigger_threshold: 0.8  # Compact at 80% of context window
  recent_window: 5        # Protect last 5 messages
  headroom_enabled: true  # Enable Headroom compression (default)
  # Defaults:
  # headroom_json_threshold: 500
  # headroom_code_threshold: 1000
  # headroom_prose_threshold: 2000
  # headroom_enable_ccr: true

instructions: |
  Review code for bugs, security issues, and improvements.

---
# Example 2: API-heavy agent with aggressive JSON compression
name: api-integration-agent
harness: codex
model: gpt-5-6-luna

compaction:
  trigger_threshold: 0.8
  recent_window: 5
  headroom_enabled: true
  headroom_json_threshold: 200    # Compress JSON more aggressively
  headroom_code_threshold: 1000
  headroom_prose_threshold: 2000
  headroom_enable_ccr: true

instructions: |
  Integrate with external APIs and process JSON responses.
  Use headroom_retrieve() if you need full context from compressed data.

---
# Example 3: Code-focused agent with optimized code compression
name: refactoring-agent
harness: claude-sdk
model: claude-opus-5

compaction:
  trigger_threshold: 0.8
  recent_window: 10       # Protect more recent messages for refactoring
  headroom_enabled: true
  headroom_json_threshold: 500
  headroom_code_threshold: 500    # Lower threshold for code compression
  headroom_prose_threshold: 2000
  headroom_enable_ccr: true

instructions: |
  Perform large-scale code refactoring across multiple files.
  Headroom compression helps manage large codebases efficiently.

---
# Example 4: Documentation agent with prose compression
name: documentation-writer
harness: pi
model: claude-sonnet-5

compaction:
  trigger_threshold: 0.8
  recent_window: 5
  headroom_enabled: true
  headroom_json_threshold: 500
  headroom_code_threshold: 1000
  headroom_prose_threshold: 1000  # Lower threshold for prose
  headroom_enable_ccr: true

instructions: |
  Generate and update documentation from code and discussions.

---
# Example 5: Headroom disabled for specific use case
name: real-time-agent
harness: codex
model: gpt-5-6-sol

compaction:
  trigger_threshold: 0.8
  recent_window: 5
  headroom_enabled: false  # Disable for latency-sensitive operations
  # Falls back to standard compaction layers (1, 2, 3)

instructions: |
  Real-time agent where compression latency is unacceptable.

---
# Example 6: Custom thresholds for mixed workload
name: general-assistant
harness: claude-sdk
model: claude-sonnet-5

compaction:
  trigger_threshold: 0.8
  recent_window: 5
  headroom_enabled: true
  headroom_json_threshold: 300    # Balanced for API work
  headroom_code_threshold: 800    # Balanced for code review
  headroom_prose_threshold: 1500  # Balanced for documentation
  headroom_enable_ccr: true

instructions: |
  General-purpose assistant handling code, APIs, and documentation.

---
# Example 7: Minimal compression (conservative)
name: conservative-agent
harness: claude-sdk
model: claude-opus-5

compaction:
  trigger_threshold: 0.8
  recent_window: 10
  headroom_enabled: true
  headroom_json_threshold: 2000   # Only compress very large JSON
  headroom_code_threshold: 3000   # Only compress very large code
  headroom_prose_threshold: 5000  # Only compress very large prose
  headroom_enable_ccr: true

instructions: |
  Conservative compression for maximum quality preservation.

---
# Example 8: Aggressive compression (cost-optimized)
name: cost-optimized-agent
harness: codex
model: gpt-5-6-luna

compaction:
  trigger_threshold: 0.8
  recent_window: 3        # Smaller recent window
  headroom_enabled: true
  headroom_json_threshold: 100    # Aggressive JSON compression
  headroom_code_threshold: 300    # Aggressive code compression
  headroom_prose_threshold: 500   # Aggressive prose compression
  headroom_enable_ccr: true

instructions: |
  Cost-optimized agent for high-volume operations.
  Use headroom_retrieve() to access full context when needed.

---
# Example 9: CCR disabled (no caching)
name: privacy-focused-agent
harness: claude-sdk
model: claude-sonnet-5

compaction:
  trigger_threshold: 0.8
  recent_window: 5
  headroom_enabled: true
  headroom_json_threshold: 500
  headroom_code_threshold: 1000
  headroom_prose_threshold: 2000
  headroom_enable_ccr: false      # Disable content caching for privacy

instructions: |
  Privacy-focused agent that doesn't cache compressed content.
  Compression is still applied but without reversibility.

---
# Example 10: Data analysis agent with JSON focus
name: data-analyst
harness: pi
model: claude-opus-5

compaction:
  trigger_threshold: 0.8
  recent_window: 5
  headroom_enabled: true
  headroom_json_threshold: 200    # Very aggressive JSON compression
  headroom_code_threshold: 2000   # Minimal code compression
  headroom_prose_threshold: 2000
  headroom_enable_ccr: true

instructions: |
  Analyze large JSON datasets and generate insights.
  Headroom's JSON compression can achieve 60-95% reduction.

---
# Configuration Guidelines:
#
# JSON Threshold:
#   - 100-300: Aggressive (for API-heavy workloads)
#   - 500: Default (balanced)
#   - 1000+: Conservative (only compress very large responses)
#
# Code Threshold:
#   - 300-600: Aggressive (for code-heavy workloads)
#   - 1000: Default (balanced)
#   - 2000+: Conservative (only compress very large files)
#
# Prose Threshold:
#   - 500-1000: Aggressive (for document-heavy workloads)
#   - 2000: Default (balanced)
#   - 3000+: Conservative (only compress very large documents)
#
# CCR (Content-Cache-Retrieval):
#   - true: Recommended (allows LLM to retrieve full content)
#   - false: Use for privacy-sensitive workloads
#
# Recent Window:
#   - 3-5: Aggressive compression (cost-optimized)
#   - 5-7: Default (balanced)
#   - 10+: Conservative (preserve more context)
#
# Trigger Threshold:
#   - 0.7: Early compaction (more aggressive)
#   - 0.8: Default (balanced)
#   - 0.9: Late compaction (less aggressive)
