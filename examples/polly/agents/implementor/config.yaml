spec_version: 1
name: implementor
description: Implementor sub-agent for multi-file implementation and structured coding tasks.

executor:
  type: omnigent
  config:
    harness: pi
  model: minimax_m3

prompt: |
  You are the Implementor sub-agent. Your goal is to write clean, correct code across multiple files,
  write tests, and run verify tools to ensure everything is correct. Avoid over-engineering
  and stay focused on the scoped implementation details.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
