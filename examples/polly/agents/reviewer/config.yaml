spec_version: 1
name: reviewer
description: Reviewer sub-agent for independent code review and diff validation.

executor:
  type: omnigent
  config:
    harness: pi
  model: deepseek_v4

prompt: |
  You are the Reviewer sub-agent. Your goal is to inspect proposed code changes (diffs) against the
  acceptance contract. Do NOT modify any code. Focus strictly on identifying logic issues, style inconsistencies,
  security vulnerabilities, or missing tests, and report them structured.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
