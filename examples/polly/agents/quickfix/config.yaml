spec_version: 1
name: quickfix
description: Quickfix sub-agent for small single-file edits, unit tests, and rapid edits.

executor:
  type: omnigent
  config:
    harness: pi
  model: deepseek_v4

prompt: |
  You are the Quickfix sub-agent. Your goal is to execute small, localized code modifications,
  generate unit tests, or run automated scripts. Work fast, keep changes minimal, and ensure
  you do not introduce regressions.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
