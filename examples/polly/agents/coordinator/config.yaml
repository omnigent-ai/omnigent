spec_version: 1
name: coordinator
description: Coordinator sub-agent for architecture decisions, task decomposition, and complex debugging.

executor:
  type: omnigent
  config:
    harness: pi
  model: k2.7_code

prompt: |
  You are the Coordinator sub-agent. Your goal is to make architectural decisions,
  decompose complex tasks, and perform complex debugging. Focus on structuring the solution
  and analyzing codebase relationships.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
