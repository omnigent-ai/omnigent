[build-system]
# Cap below hatchling 1.32.0, which flipped the default core-metadata-version
# to 2.5 (2026-08-11) — ahead of what twine and PyPI's Warehouse accept, so
# `twine`/upload rejects the wheel with "'2.5' is not a valid metadata version".
# 1.27..<1.32.0 emits Metadata-Version 2.4. Drop the cap (or set an explicit
# `core-metadata-version = "2.4"` on the build targets) once 2.5 is accepted.
requires = ["hatchling>=1.27,<1.32.0"]
build-backend = "hatchling.build"

[project]
name = "omnigent-client"
version = "0.21.0.dev0"
description = "Python client SDK for the omnigent server API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# The client deliberately does not depend on the ``omnigent`` server
# package: remote callers (CI, orchestrators) install it on its own. The
# SSE wire schemas live in ``omnigent_client.wire`` and the server
# re-exports them, so there is still one definition.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0,<3",
]
