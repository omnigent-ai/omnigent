[build-system]
# Cap below hatchling 1.32.4, which flipped the default core-metadata-version
# to 2.5 (2026-09-20) — ahead of what twine and PyPI's Warehouse accept, so
# `twine`/upload rejects the wheel with "'2.5' is not a valid metadata version".
# 1.27..<1.32.4 emits Metadata-Version 2.4. Drop the cap once 2.5 is accepted.
requires = ["hatchling>=1.27,<1.32.4"]
build-backend = "hatchling.build"

[project]
name = "omnigent-ui-sdk"
version = "0.15.0.dev0"
description = "Terminal UI components (Rich + prompt_toolkit) for building omnigent frontends"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # Version-locked (==) with the sibling client SDK; released together
    # at one version (release-omnigent.yml verifies the pin). A `>=`
    # floor would also reject pre-releases (e.g. 0.1.0rc1 < 0.1.0 in
    # PEP 440).
    "omnigent-client==0.15.0.dev0",
    "rich>=13",
    "prompt_toolkit>=3",
    "pyyaml>=6.0,<7",
]
