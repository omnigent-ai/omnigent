[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigent-ui-sdk"
version = "0.6.0.dev0"
description = "Terminal UI components (Rich + prompt_toolkit) for building omnigent frontends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Version-locked (==) with the sibling client SDK; released together
    # at one version (release-omnigent.yml verifies the pin). A `>=`
    # floor would also reject pre-releases (e.g. 0.1.0rc1 < 0.1.0 in
    # PEP 440).
    "omnigent-client==0.6.0.dev0",
    "rich>=13",
    "prompt_toolkit>=3",
    "pyyaml>=6.0,<7",
]

[tool.uv.sources]
omnigent-client = { path = "../python-client", editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
]


[tool.basedpyright]
# Standard mode found three pre-existing diagnostics at prompt-toolkit and Rich
# boundaries. Baseline those during the checker migration; new diagnostics fail.
typeCheckingMode = "standard"
failOnWarnings = true
baselineFile = ".basedpyright/baseline.json"
pythonVersion = "3.12"
include = ["omnigent_ui_sdk"]
extraPaths = ["../..", "../python-client"]
