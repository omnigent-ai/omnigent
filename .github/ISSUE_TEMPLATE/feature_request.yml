name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["Feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve, or what use case would this enable?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought about.
    validations:
      required: false

  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: Select the affected harnesses, if any.
      multiple: true
      options:
        - Not applicable
        - Claude
        - Codex
        - Cursor
        - Antigravity
        - Hermes
        - OpenCode
        - Pi
        - Copilot
        - Goose
        - Kimi
        - Kiro
        - Qwen
        - Other
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform or device
      multiple: true
      options:
        - Not platform-specific
        - macOS
        - Linux
        - Windows
        - Desktop app
        - iOS
        - Android
        - Docker
        - Other
    validations:
      required: false

  - type: dropdown
    id: harness-mode
    attributes:
      label: Harness mode
      multiple: true
      options:
        - Not applicable
        - SDK
        - Native
        - Other
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Expected reach
      options:
        - Most users
        - A substantial user segment
        - Some users
        - One narrow or edge case
        - Unknown
    validations:
      required: false

  - type: dropdown
    id: auth-type
    attributes:
      label: Authentication type
      multiple: true
      options:
        - Not authentication-related
        - Local
        - Multi-user
        - OIDC
        - OAuth
        - Databricks
        - Other
    validations:
      required: false
