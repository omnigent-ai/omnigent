name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: >
        Give minimal steps to reproduce the issue. If direct steps aren't
        available, provide other actionable evidence, such as a clear
        intermittent observation, a controlled test, diagnostics, or concrete
        analysis of the failing code path. For an intermittent crash or race,
        write "N/A — cannot reproduce reliably" and describe what you observed
        and when in as much detail as you can.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `omnigent --version` or the commit/tag you're running.
      placeholder: e.g. 0.5.2 or abc1234
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system and version.
      placeholder: e.g. Ubuntu 24.04, macOS 15.1
    validations:
      required: false

  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: Select the affected harnesses, if any.
      multiple: true
      options:
        - Not applicable
        - Claude
        - Codex
        - Cursor
        - Antigravity
        - Hermes
        - OpenCode
        - Pi
        - Copilot
        - Goose
        - Kimi
        - Kiro
        - Qwen
        - Other
    validations:
      required: false

  - type: dropdown
    id: harness-mode
    attributes:
      label: Harness mode
      multiple: true
      options:
        - Not applicable
        - SDK
        - Native
        - Other
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform or device
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
        - Desktop app
        - iOS
        - Android
        - Docker
        - Other
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Observed impact
      options:
        - All users or sessions
        - Most users or sessions
        - Some users or sessions
        - One narrow or edge case
        - Unknown
    validations:
      required: false

  - type: dropdown
    id: auth-type
    attributes:
      label: Authentication type
      multiple: true
      options:
        - Not authentication-related
        - Local
        - Multi-user
        - OIDC
        - OAuth
        - Databricks
        - Other
    validations:
      required: false
