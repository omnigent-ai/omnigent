name: Merge Ready
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Merge Ready #{0} ({1})', inputs.pr, inputs.sha) || '' }}"

# Posts the "Merge Ready" commit status on the PR head SHA -- the single
# readiness branch-protection check, separate from Maintainer Approval.
# Triggers: `/merge` comment (write-access commenter only),
# `pull_request_target` label changes,
# `workflow_run` on CI completion (same-repo AND fork PRs -- ctx resolves the
# PR from the head SHA), and `workflow_dispatch` (programmatic/manual
# re-evaluation of one PR). Posted via the REST API (not the job's implicit
# check run) so the status lands on the PR head SHA, since these jobs run on
# the default branch.
#
# Labels:
#   automerge    durable request to enable GitHub auto-merge after evaluation,
#                plus continuous gate updates (green AND red).
#
# There is no CI bypass label. To land a PR despite red required checks,
# fix or delete the offending test; for a genuine emergency, a repo admin
# uses GitHub's native "merge without waiting for requirements" affordance
# (branch protection has enforce_admins=false).

on:
  # Label changes refresh automatic dependency eligibility; workflow_run
  # re-evaluates on CI completion for all PRs
  # (same-repo and fork -- ctx resolves the PR from the head SHA).
  # pull_request_target (not pull_request) so this workflow always runs from
  # main -- a PR cannot modify the gate logic by editing this file.
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_run:
    workflows: [PR Template, CI, Lint, Docker build, E2E UI Tests, E2E Tests, Integration Tests, UI Snapshot, web Tests, Android Bundle, Security Scan, Trivy CVE Scan, Windows (native), Maintainer Approval]
    types: [completed]
  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  # Programmatic / manual re-evaluation of a single PR.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to (re)evaluate.
        required: true
        type: string
      sha:
        description: Head SHA to post on (defaults to the PR's current head).
        required: false
        type: string
      expire_only:
        description: Only invalidate a green status whose recorded deadline has passed.
        type: boolean
        default: false

# Read-only at top level; write scopes live on the job below.
permissions:
  contents: read

jobs:
  resolve-head:
    # Comments and dispatches lack a head SHA for the per-commit lock.
    needs: request-automerge
    if: >-
      !cancelled() &&
      (needs.request-automerge.result == 'success' || needs.request-automerge.result == 'skipped') &&
      (
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/merge') &&
        !endsWith(github.actor, '[bot]')
      )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      skip: ${{ steps.head.outputs.skip }}
    steps:
      - name: Resolve current head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.issue.number }}
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Expected a PR number"; exit 1; }
          PULL=$(gh api "repos/$REPO/pulls/$PR")
          SHA=$(jq -r '.head.sha' <<<"$PULL")
          if [[ -n "$SHA_INPUT" ]] && ! [[ "$SHA_INPUT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Expected a head SHA"
            exit 1
          fi
          if [[ $(jq -r '.state' <<<"$PULL") != 'open' || "$SHA" != "$SHA_INPUT"* ]]; then
            echo "::notice::Skipped: PR is closed or its head changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  request-automerge:
    # Persist the command before waiting for status updates.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '/merge') &&
      !endsWith(github.actor, '[bot]') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted command scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          sparse-checkout: .github/scripts/merge-ready
          persist-credentials: false

      - name: Validate /merge command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if ! grep -qE '^[[:space:]]*/merge([[:space:]]|$)' <<<"$COMMENT_BODY"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorize /merge commenter
        id: authz
        if: steps.command.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
        run: bash .github/scripts/merge-ready/authorize-merge-comment.sh

      - name: Record /merge request
        if: steps.authz.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: bash .github/scripts/merge-ready/enable-automerge-comment.sh

  evaluate:
    name: evaluate
    needs: [resolve-head, request-automerge]
    concurrency:
      group: merge-ready-${{ needs.resolve-head.outputs.sha || github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.check_run.head_sha }}
      cancel-in-progress: false
      # Expiry jobs must not replace pending full evaluations.
      queue: max
    permissions:
      contents: write       # merge PRs with durable automerge intent
      pull-requests: write  # enable auto-merge
      checks: read
      actions: read         # evaluate-checks.sh reads GET /actions/runs to classify missing checks
      statuses: write
    # Fire on gate label changes, CI/approval completions (same-repo and fork),
    # DCO check_run completions, `/merge` comments, or a
    # workflow_dispatch re-eval. Runs with no open PR (push to main, etc.) are
    # dropped by the ctx step.
    if: >-
      !cancelled() &&
      (needs.resolve-head.result == 'success' || needs.resolve-head.result == 'skipped') &&
      (needs.request-automerge.result == 'success' || needs.request-automerge.result == 'skipped') &&
      needs.resolve-head.outputs.skip != 'true' &&
      (
      (
        github.event_name == 'pull_request_target' &&
        (
          github.event.label.name == 'automerge' ||
          github.event.label.name == 'hold-automerge' ||
          github.event.label.name == 'skip-security-scan'
        )
      ) ||
      (
        github.event_name == 'workflow_run' &&
        (
          github.event.workflow_run.event == 'pull_request' ||
          (
            github.event.workflow_run.name == 'Maintainer Approval' &&
            github.event.workflow_run.event == 'pull_request_target'
          )
        )
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.name == 'DCO' &&
        github.event.check_run.app.slug == 'dco'
      ) ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/merge') &&
        !endsWith(github.actor, '[bot]') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main             # trusted gate scripts; never the PR head
          sparse-checkout: |
            .github/scripts/merge-ready
            .github/scripts/maintainer_approval.py
            .github/scripts/dependabot_automerge.py
            .github/scripts/dependabot_policy.py
            .github/dependabot-automerge.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve PR + head SHA
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Via env, not interpolated: author-controlled, so direct
          # interpolation would be a shell-injection vector.
          WF_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          CHECK_RUN_SHA: ${{ github.event.check_run.head_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_INPUT: ${{ inputs.pr }}
          RESOLVED_SHA: ${{ needs.resolve-head.outputs.sha }}
        run: |
          # Resolve the open PR from a head SHA -- fork-PR events leave the
          # payload's pull_requests array empty (cross-repo). Use the search
          # API, not GET /commits/{sha}/pulls: that endpoint does not associate
          # a fork PR's head commit (it lives in the fork, not this repo), so it
          # returns nothing for every fork PR and the gate silently skips them.
          # The search index covers fork-PR head SHAs.
          resolve_pr_from_sha() {
            gh api "search/issues?q=repo:$REPO+type:pr+state:open+sha:$1" \
              --jq '.items[0].number // empty' 2>/dev/null || true
          }
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            PR="${{ github.event.pull_request.number }}"
            SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # PR_INPUT is dispatcher-controlled; validate before shell use.
            if ! [[ "$PR_INPUT" =~ ^[0-9]+$ ]]; then
              echo "::error::workflow_dispatch input 'pr' must be a PR number"
              exit 1
            fi
            PR="$PR_INPUT"
            SHA="$RESOLVED_SHA"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            # The job `if` contains() pre-filter also fires on incidental
            # mentions; re-validate `/merge` as a command (first non-space
            # token on a line is exactly `/merge`, optional args).
            if ! grep -qE '^[[:space:]]*/merge([[:space:]]|$)' <<<"$COMMENT_BODY"; then
              echo "::notice::Skipped: comment mentions '/merge' but not as a command"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR="${{ github.event.issue.number }}"
            SHA="$RESOLVED_SHA"
          elif [[ "${{ github.event_name }}" == "check_run" ]]; then
            SHA="$CHECK_RUN_SHA"
            PR=$(resolve_pr_from_sha "$SHA")
            if [[ -z "$PR" ]]; then
              echo "::notice::Skipped: DCO check_run has no associated open PR"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            PR=$(echo "$WF_PRS" | jq -r '.[0].number // empty')
            SHA="${{ github.event.workflow_run.head_sha }}"
            [[ -z "$PR" ]] && PR=$(resolve_pr_from_sha "$SHA")
            if [[ -z "$PR" ]]; then
              echo "::notice::Skipped: workflow_run has no associated PR (push to main, etc)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "pr=$PR"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Invalidate expired Merge Ready
        id: expiry
        if: steps.ctx.outputs.skip != 'true' && inputs.expire_only == true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        with:
          retries: 3
          script: |
            const { expire } = require("./.github/scripts/merge-ready/expiry.js");
            await expire({
              github, context, core,
              pr: Number(process.env.PR), sha: process.env.SHA,
            });

      - name: Read PR labels and author
        id: labels
        if: steps.ctx.outputs.skip != 'true' && inputs.expire_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          DEPENDABOT_AUTOMERGE_MODE: ${{ vars.DEPENDABOT_AUTOMERGE_MODE || 'report' }}
        run: |
          PULL=$(gh api "repos/$REPO/pulls/$PR")
          NAMES=$(jq -r '.labels[].name' <<<"$PULL")
          AUTHOR=$(jq -r '.user.login' <<<"$PULL")
          if [[ "$AUTHOR" == 'dependabot[bot]' && "$DEPENDABOT_AUTOMERGE_MODE" == 'merge' ]]; then
            echo "dependency_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependency_required=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$NAMES" | grep -qx "automerge"; then
            echo "automerge=true" >> "$GITHUB_OUTPUT"
          else
            echo "automerge=false" >> "$GITHUB_OUTPUT"
          fi

      # Explicit reevaluations (including expiry sweeps) must revoke old green.
      - name: Determine eligibility
        id: eligible
        if: steps.ctx.outputs.skip != 'true' && inputs.expire_only != true
        env:
          EVENT:       ${{ github.event_name }}
          AUTOMERGE:   ${{ steps.labels.outputs.automerge }}
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "issue_comment" || "$EVENT" == "workflow_dispatch" || "$AUTOMERGE" == "true" ]]; then
            echo "post_red=true" >> "$GITHUB_OUTPUT"
          else
            echo "post_red=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No 'automerge' label; will post Merge Ready only if the gate is green."
          fi

      - name: Evaluate required checks
        id: eval
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.eligible.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: bash .github/scripts/merge-ready/evaluate-checks.sh

      - name: Install trusted policy parser
        id: parser
        if: steps.ctx.outputs.skip != 'true' && steps.labels.outputs.dependency_required == 'true'
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/dependabot-policy-env"
          "$RUNNER_TEMP/dependabot-policy-env/bin/pip" install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
          echo "$RUNNER_TEMP/dependabot-policy-env/bin" >> "$GITHUB_PATH"

      - name: Evaluate dependency reports
        id: dependency
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.labels.outputs.dependency_required == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.ctx.outputs.sha }}
          DEPENDABOT_AUTOMERGE_MODE: ${{ vars.DEPENDABOT_AUTOMERGE_MODE || 'report' }}
        run: |
          python3 .github/scripts/maintainer_approval.py \
            --repository "$REPO" --pr-number "$PR" \
            --trusted-author 'omni-resolve-agent[bot]' \
            --trusted-successor 'omni-resolve-agent[bot]' \
            --check-dependency-reports

      - name: Compute gate outcome
        id: gate
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.eligible.outputs.run == 'true'
        env:
          EVAL: ${{ steps.eval.outcome }}
          FAILED: ${{ steps.eval.outputs.failed }}
          FRESHNESS_FAILED: ${{ steps.eval.outputs.freshness_failed }}
          API_FAILED: ${{ steps.eval.outputs.api_failed }}
          EXPIRES_AT: ${{ steps.eval.outputs.expires_at }}
          DEPENDENCY_EVAL: ${{ steps.dependency.outcome }}
          DEPENDENCY_REQUIRED: ${{ steps.labels.outputs.dependency_required }}
          POST_RED: ${{ steps.eligible.outputs.post_red }}
        run: bash .github/scripts/merge-ready/compute-gate.sh

      # Expired CI and dependency failures revoke green even without a label.
      - name: Post Merge Ready status on PR head SHA
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.eligible.outputs.run == 'true' &&
          steps.gate.outputs.post_status == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          SHA:      ${{ steps.ctx.outputs.sha }}
          STATE:    ${{ steps.gate.outputs.state }}
          DESC:     ${{ steps.gate.outputs.short_desc }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="Merge Ready" \
            -f description="$DESC" >/dev/null
          echo "Posted Merge Ready=$STATE on $SHA ($DESC)"

      # Any surviving evaluation can fulfill the stored request after publishing.
      - name: Enable requested auto-merge
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          steps.labels.outputs.automerge == 'true' &&
          steps.gate.outputs.post_status == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
          GATE_STATE: ${{ steps.gate.outputs.state }}
          EXPIRES_AT: ${{ steps.eval.outputs.expires_at }}
        run: bash .github/scripts/merge-ready/enable-automerge-label.sh

      # Not on pull_request_target-labeled: auto-merge was enabled in an earlier
      # step there, so failing here would make the label look broken even
      # though it worked. Safe on workflow_run/workflow_dispatch.
      - name: Fail job when gate is red
        if: >-
          (
            github.event_name == 'workflow_run' ||
            github.event_name == 'workflow_dispatch'
          ) &&
          steps.ctx.outputs.skip != 'true' &&
          steps.eligible.outputs.run == 'true' &&
          steps.eligible.outputs.post_red == 'true' &&
          steps.gate.outputs.state == 'failure'
        run: |
          echo "::error::Merge Ready gate is red for SHA ${{ steps.ctx.outputs.sha }}"
          exit 1
