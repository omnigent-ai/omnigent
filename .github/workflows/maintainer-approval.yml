name: Maintainer Approval

# Gates merge on a maintainer's approval, except for explicitly trusted automation
# authors. The job *is* the required check: it exits non-zero until approval (or
# a trusted author) is present, and GitHub reports that pass/fail as the
# `Maintainer Approval` status. No commit status is posted (a fork's token
# is read-only, so a `gh api .../statuses` POST would 403), so the check is the
# job result instead.
#
# Trigger is `pull_request_target`, so it runs from main with the base token
# even for fork PRs: it isn't held behind the fork-PR-workflow approval gate
# (reports immediately on open), and the PR-head copy never runs (a malicious PR
# can't weaken the check). Safe because the job checks out only the evaluator
# from main and runs no PR code. The evaluator reads .github/MAINTAINER from
# main's tip (so a PR can't self-grant by adding its author) and queries the API.
#
# `pull_request_target` doesn't fire on reviews, so maintainer-approval-rerun.yml
# + -rerun-run.yml re-run this workflow on an approving review to flip it green.
#
# An approval is carried across later commits only when every push since it was
# made by trusted automation, judged by the authenticated actor of each head's
# `pull_request_target` run (hence `actions: read`), never by the commit email.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  # Don't cancel in-progress: a run cancelled mid-flight leaves the check red.
  group: maintainer-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approve:
    name: Maintainer Approval
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out approval evaluator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          sparse-checkout: |
            .github/scripts/maintainer_approval.py
            .github/scripts/dependabot_automerge.py
            .github/scripts/dependabot_policy.py
            .github/dependabot-automerge.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install trusted policy parser
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          vars.DEPENDABOT_AUTOMERGE_MODE == 'merge'
        run: |
          python3 -m venv "$RUNNER_TEMP/dependabot-policy-env"
          "$RUNNER_TEMP/dependabot-policy-env/bin/pip" install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
          echo "$RUNNER_TEMP/dependabot-policy-env/bin" >> "$GITHUB_PATH"

      - name: Require maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
          PR:       ${{ github.event.pull_request.number }}
          DEPENDABOT_AUTOMERGE_MODE: ${{ vars.DEPENDABOT_AUTOMERGE_MODE || 'report' }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/maintainer_approval.py \
            --repository "$REPO" \
            --pr-number "$PR" \
            --trusted-author 'omni-resolve-agent[bot]' \
            --trusted-successor 'omni-resolve-agent[bot]'
