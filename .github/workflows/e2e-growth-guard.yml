name: E2E Growth Guard

# Warn-only guardrail on e2e test growth: counts net-new `def test_` and new
# test files a PR adds under tests/e2e/ and tests/e2e_ui/, and posts a sticky
# warning comment (+ an `e2e-growth` label) when a PR crosses the threshold.
# The e2e suites gate nearly every PR under a fixed sharded wall-clock cap, so
# unbounded growth erodes CI latency for everyone (OMNI-6715). This nudges
# authors to confirm the additions are needed; it never fails the PR.
#
# Runs as pull_request_target so it can label/comment on fork PRs, but it never
# checks out or executes PR code -- it reads the diff via the API and runs only
# the default-branch script, like pr-size.yml.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['CHANGELOG.md']

permissions:
  contents: read

concurrency:
  group: e2e-growth-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: E2E Growth Guard
    # Skip drafts; `ready_for_review` re-fires when a draft is converted.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Check out default-branch script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/e2e-growth
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Evaluate e2e growth and update comment/label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT_FILE: ${{ runner.temp }}/e2e-growth-comment.md
          LABEL: e2e-growth
          MARKER: "<!-- e2e-growth-guard -->"
        run: |
          set -euo pipefail

          verdict=$(
            gh api --paginate "/repos/${REPO}/pulls/${PR}/files?per_page=100" \
              | python .github/scripts/e2e-growth/check.py
          )
          echo "verdict: ${verdict}"
          over=$(printf '%s' "$verdict" | python -c 'import json,sys; print(str(json.load(sys.stdin)["over"]).lower())')

          # Newest existing guard comment (sticky, keyed by the HTML marker).
          existing=$(
            gh api --paginate "/repos/${REPO}/issues/${PR}/comments" \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | tail -n 1
          )

          if [[ "$over" == "true" ]]; then
            gh label create "$LABEL" --repo "$REPO" --color d93f0b \
              --description "PR adds a large batch of e2e tests" --force >/dev/null
            gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"
            if [[ -n "$existing" ]]; then
              gh api -X PATCH "/repos/${REPO}/issues/comments/${existing}" -F body=@"$COMMENT_FILE" >/dev/null
              echo "Updated existing guard comment ${existing}."
            else
              gh api -X POST "/repos/${REPO}/issues/${PR}/comments" -F body=@"$COMMENT_FILE" >/dev/null
              echo "Posted guard comment."
            fi
          else
            # Under threshold: retract a prior warning if one exists.
            gh pr edit "$PR" --repo "$REPO" --remove-label "$LABEL" 2>/dev/null || true
            if [[ -n "$existing" ]]; then
              gh api -X DELETE "/repos/${REPO}/issues/comments/${existing}" >/dev/null
              echo "Removed stale guard comment ${existing}."
            fi
          fi
