# Build the `omnigent` release distributions (core wheel with the web
# UI bundled in, plus the `omnigent-client` and `omnigent-ui-sdk` SDK
# wheels it depends on, and one `omnigent-workspace-helper` binary wheel per
# platform), run the readiness gates, and publish them all to
# (Test)PyPI via OIDC Trusted Publishing. They version-lock together,
# so every release publishes all of them at the same version. Self-contained:
# publishes straight from this repo on a GitHub-hosted runner for clean public
# PyPI/npm access (never a mirror/proxy).
#
# Release flow:
#   1. Push a version tag (vX.Y.Z / vX.Y.ZrcN) -> build + gate + publish to
#      TestPyPI automatically.
#   2. Validate the TestPyPI release (install + smoke).
#   3. Manually dispatch ON THE SAME TAG with destination=pypi -> publish
#      the identical version to PyPI, behind the protected `pypi` env.
#
# One-time setup (per index, pypi.org AND test.pypi.org): Trusted Publishers
# for all four project names pointing at omnigent-ai/omnigent +
# release-omnigent.yml + the test-pypi/pypi environment (unclaimed names
# reserved via a pending publisher); GitHub envs test-pypi (unprotected)
# and pypi (required reviewer). Actions are SHA-pinned per repo convention.
name: Release omnigent (PyPI)

on:
  # PyPI publishing moved to the central secure-release repo; the tag-push
  # trigger is REMOVED so a tag no longer double-publishes. Kept as a manual
  # fallback only, to be deleted once the secure path has done a prod release.
  # Manual run: build + gates always run; destination picks the index, with
  # `pypi` binding the protected environment.
  workflow_dispatch:
    inputs:
      destination:
        description: "Index to publish to."
        type: choice
        default: test-pypi
        options:
          - test-pypi
          - pypi
  # CI-test the workflow on change: build + gates run on the PR; publish
  # steps are condition-gated off PR events.
  pull_request:
    paths:
      - ".github/workflows/release-omnigent.yml"
      - "rust/workspace-helper/pyproject.toml"
      - "rust/workspace-helper/python/**"
      - "scripts/build_workspace_helper_wheel.sh"
      - "scripts/check_workspace_helper_wheel.py"
      - "omnigent/onboarding/sandboxes/workspace_helper_wheels.py"

permissions:
  contents: read
  id-token: write # OIDC Trusted Publishing — consumed by the publish steps

# Serialize releases on the same ref so two triggers can't race the same tag.
concurrency:
  group: release-omnigent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One helper wheel per platform. Linux wheels build in the pypa image for
  # their C library floor, and every wheel is installed and run on a machine
  # of its own platform: the manylinux image itself checks the glibc 2.28 floor.
  workspace-helper-wheels:
    name: Workspace helper wheel (${{ matrix.platform }})
    if: github.repository == 'omnigent-ai/omnigent'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: manylinux_2_28_x86_64
            runner: ubuntu-24.04
            compatibility: manylinux_2_28
            build-image: quay.io/pypa/manylinux_2_28_x86_64
            smoke-image: quay.io/pypa/manylinux_2_28_x86_64
            smoke-python: /opt/python/cp312-cp312/bin/python
          - platform: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
            compatibility: manylinux_2_28
            build-image: quay.io/pypa/manylinux_2_28_aarch64
            smoke-image: quay.io/pypa/manylinux_2_28_aarch64
            smoke-python: /opt/python/cp312-cp312/bin/python
          - platform: musllinux_1_2_x86_64
            runner: ubuntu-24.04
            compatibility: musllinux_1_2
            build-image: quay.io/pypa/musllinux_1_2_x86_64
            smoke-image: python:3.12-alpine
            smoke-python: python3
          - platform: musllinux_1_2_aarch64
            runner: ubuntu-24.04-arm
            compatibility: musllinux_1_2
            build-image: quay.io/pypa/musllinux_1_2_aarch64
            smoke-image: python:3.12-alpine
            smoke-python: python3
          - platform: macosx_arm64
            runner: macos-14
          - platform: macosx_x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The build names the newest commit that changed the helper.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Read the version
        id: version
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib

          with open("rust/workspace-helper/pyproject.toml", "rb") as f:
              print(f"version={tomllib.load(f)['project']['version']}")
          PY
          echo "commit=$(git log -1 --format=%H -- rust omnigent/api/workspace/v1alpha1)" >> "$GITHUB_OUTPUT"

      - name: Build the wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p wheel
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e WORKSPACE_HELPER_BUILD_VERSION="${{ steps.version.outputs.version }}" \
            -e WORKSPACE_HELPER_BUILD_COMMIT="${{ steps.version.outputs.commit }}" \
            -e PYTHON=/opt/python/cp312-cp312/bin/python \
            "${{ matrix.build-image }}" \
            sh scripts/build_workspace_helper_wheel.sh wheel "${{ matrix.compatibility }}"

      - name: Build the wheel (macOS)
        if: runner.os == 'macOS'
        env:
          WORKSPACE_HELPER_BUILD_VERSION: ${{ steps.version.outputs.version }}
          WORKSPACE_HELPER_BUILD_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          mkdir -p wheel
          scripts/build_workspace_helper_wheel.sh wheel

      - name: Check the wheel's tag and contents
        run: |
          ls -la wheel/
          python scripts/check_workspace_helper_wheel.py contents wheel/*.whl \
            --platform "${{ matrix.platform }}" --version "${{ steps.version.outputs.version }}"

      - name: Install and run the wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "${{ matrix.smoke-image }}" sh -euc '
            "${{ matrix.smoke-python }}" -m venv /tmp/smoke
            /tmp/smoke/bin/python -m pip install --no-index wheel/*.whl
            /tmp/smoke/bin/python scripts/check_workspace_helper_wheel.py installed \
              --version "${{ steps.version.outputs.version }}"
          '

      - name: Install and run the wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --no-index wheel/*.whl
          /tmp/smoke/bin/python scripts/check_workspace_helper_wheel.py installed \
            --version "${{ steps.version.outputs.version }}"

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-helper-${{ matrix.platform }}
          path: wheel/*.whl
          if-no-files-found: error

  build-and-publish:
    needs: workspace-helper-wheels
    # Gated to this repository; inert in forks and mirrors.
    if: github.repository == 'omnigent-ai/omnigent'
    runs-on: ubuntu-24.04
    # Bound a hung run under GitHub's 6-hour default (real work takes minutes).
    timeout-minutes: 30
    # Environment binds the Trusted Publisher config: test-pypi unprotected,
    # pypi gated by a required-reviewer rule for real releases.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi') && 'pypi' || 'test-pypi' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv (clean public resolution, no proxy cache)
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: false

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      # 1. Build the web UI FIRST into the package tree, clean. Ordering is
      #    load-bearing: the wheel packages on-disk files, so the bundle must
      #    exist before `uv build`. `rm -rf` backstops Vite's emptyOutDir
      #    against stale bundles; `pnpm install --frozen-lockfile --filter web`
      #    installs the exact locked deps for the web workspace package.
      - name: Build web UI (clean, fresh)
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          rm -rf omnigent/server/static/web-ui
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build # Vite outDir -> omnigent/server/static/web-ui

      # 2. Tag-driven: the tag must match the version in every pyproject
      #    and the core package's `==` sibling-SDK pins, so the lockstep
      #    contract holds. Skipped on a non-tag ref (nothing to compare).
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run --no-project python - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys
          import tomllib

          tag = sys.argv[1]
          # Every package carries the tag's version; every cross-package
          # dep is an exact `==tag` pin (the lockstep contract).
          packages = {
              "pyproject.toml": ("omnigent-client", "omnigent-ui-sdk"),
              "sdks/python-client/pyproject.toml": ("omnigent",),
              "sdks/ui/pyproject.toml": ("omnigent-client",),
              "rust/workspace-helper/pyproject.toml": (),
          }
          errors = []
          for path, sibling_pins in packages.items():
              with open(path, "rb") as f:
                  project = tomllib.load(f)["project"]
              print(f"{path}: version={project['version']}")
              if project["version"] != tag:
                  errors.append(f"{path} version {project['version']} does not match tag v{tag}")
              for name in sibling_pins:
                  pin = f"{name}=={tag}"
                  if pin not in project["dependencies"]:
                      errors.append(f"{path} dependencies missing exact pin {pin!r}")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          PY

      # 3. Build sdist + wheel for all three into one dist/. The SDKs are
      #    path-deps (not a uv workspace), so each needs its own build.
      - name: Build sdists + wheels
        run: |
          uv build --out-dir dist
          uv run --no-project --with build python scripts/build_subpackages.py \
            --out-dir dist omnigent-client omnigent-ui-sdk
          ls -la dist/

      # 3b. Add the helper wheels the matrix built, one per platform.
      - name: Download the workspace helper wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: workspace-helper-*
          path: dist
          merge-multiple: true

      - name: Check every platform has a helper wheel
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("rust/workspace-helper/pyproject.toml", "rb"))["project"]["version"])')
          uv run --no-project python scripts/check_workspace_helper_wheel.py complete dist --version "$version"
          ls -la dist/

      # 4. Metadata sanity check (long-description renders, fields valid).
      - name: twine check
        run: uvx twine check dist/*

      # 5. GATE: the UI bundle must be inside the core wheel; fail loud if
      #    missing/empty. The glob matches only the core wheel (SDK wheels
      #    are omnigent_client-* / omnigent_ui_sdk-*).
      - name: Assert web-UI bundle shipped in the wheel
        run: |
          uv run --no-project python - <<'PY'
          import glob
          import sys
          import zipfile

          whls = sorted(glob.glob("dist/omnigent-*.whl"))
          if not whls:
              sys.exit("no core omnigent wheel found in dist/")
          whl = whls[-1]
          names = zipfile.ZipFile(whl).namelist()
          ui = [n for n in names if "server/static/web-ui/" in n]
          has_index = any(n.endswith("server/static/web-ui/index.html") for n in ui)
          print(f"{whl}: {len(ui)} web-ui files, index.html present = {has_index}")
          sys.exit(0 if (ui and has_index) else "WEB-UI BUNDLE MISSING FROM WHEEL")
          PY

      # 6. GATE: the wheels install together and the CLI entry point imports,
      #    resolving deps from public PyPI (catches proxy-only deps). Of the
      #    helper wheels, the installed omnigent picks the one this runner can
      #    install, as it does for a sandbox host.
      - name: Smoke-install the built wheels
        run: |
          uv venv --python 3.12 /tmp/omnigent-smoke
          uv pip install --python /tmp/omnigent-smoke/bin/python dist/*-py3-none-any.whl
          /tmp/omnigent-smoke/bin/omnigent --version
          helper=$(/tmp/omnigent-smoke/bin/python -m omnigent.onboarding.sandboxes.workspace_helper_wheels select dist)
          uv pip install --python /tmp/omnigent-smoke/bin/python "dist/$helper"
          version=$(/tmp/omnigent-smoke/bin/python -c 'import omnigent.version; print(omnigent.version.VERSION)')
          /tmp/omnigent-smoke/bin/python scripts/check_workspace_helper_wheel.py installed --version "$version"

      # 7. Persist the built artifacts for inspection.
      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-omnigent
          path: dist/

      # PUBLISH via OIDC Trusted Publishing (no token; id-token: write granted
      # above). Attestations stay ON (PEP 740 provenance for a public project).
      - name: Publish to TestPyPI
        # Tag pushes + explicit test-pypi dispatches; PR runs never publish.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.destination == 'test-pypi')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          # Let a re-run skip already-landed files after a partial publish;
          # the real-PyPI step omits this so a prod collision fails loud.
          skip-existing: true

      - name: Publish to PyPI
        # Real PyPI only via deliberate dispatch with destination=pypi,
        # behind the protected `pypi` environment.
        if: github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        # default repository-url is pypi.org
