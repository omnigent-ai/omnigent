name: Android Bundle

# Builds an unsigned release AAB in CI and uploads it as a workflow artifact.
# Download the artifact and sign it locally with your upload keystore — no
# secrets on GitHub, no signing key in CI.

on:
  workflow_dispatch:
    inputs:
      version-code:
        description: "versionCode (must be higher than the last uploaded to Play; starts at 3)"
        required: true
        type: string
      version-name:
        description: "versionName shown to users (e.g. 0.2.0). Blank keeps the default in app/build.gradle.kts"
        required: false
        default: ""
      version-note:
        description: "Optional note appended to the artifact filename (e.g. rc1)"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/android-bundle.yml"
      - "web/android/**"

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/security-gate.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    name: Build unsigned AAB
    needs: gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/android

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Robolectric's Android 16/API 36 runtime requires Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          cache-read-only: false

      - name: Run unit tests and build release AAB
        run: |
          ./gradlew testDebugUnitTest bundleRelease --no-daemon --console=plain \
            "-PversionCode=${{ inputs.version-code }}" \
            "-PversionName=${{ inputs.version-name }}"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-tests-${{ github.run_id }}
          path: |
            web/android/app/build/test-results/testDebugUnitTest/
            web/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Verify artifact
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::AAB not found at $AAB"; exit 1; }
          echo "AAB size: $(du -h "$AAB" | cut -f1)"

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: omnigent-android-aab${{ inputs.version-note && format('-{0}', inputs.version-note) || '' }}
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
