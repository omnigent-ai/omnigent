name: UI Preview
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Delete UI preview PR {0}', inputs.pr_number)
      || github.event.pull_request.title
      || github.event.head_commit.message }}

# Per-PR live preview of the Omnigent web UI, deployed to Databricks Apps.
# The preview is ephemeral (SQLite + local artifacts) and ships no LLM/runner --
# Omnigent runs agent turns on a runner the reviewer connects from their own
# machine. See .github/ui-preview/README.md.
#
# Fork PRs are supported: the `ui-preview` label is the trust boundary. Applying
# a label needs Triage+ on the repo, so an outside contributor cannot self-label
# their fork PR -- only a maintainer (or a trusted bot acting after checks pass)
# can. The build/deploy jobs run on `pull_request_target` (base-repo context,
# with secrets) once labelled.
#
# TOCTOU hardening. A label vouches for the PR *as it was at label time*, but a
# later push (`synchronize`) re-fires this workflow with the label still
# attached -- so an attacker could label-bait a benign fork PR and then push
# malicious code that deploys without re-review. Two guards close this:
#   1. The build checks out the PR's *head SHA* (immutable), never the live
#      `refs/pull/<n>/merge` ref that silently re-points to whatever was last
#      pushed -- so a run only ever builds one specific, inspectable commit.
#   2. For UNTRUSTED fork PRs the secret-bearing `deploy` job runs in the
#      protected `ui-preview-fork` Environment, which requires a human reviewer
#      to approve *each* run -- so every new commit on a labelled fork PR waits
#      for a fresh approval before it can deploy. Trusted authors (repo
#      owners/members/collaborators, incl. a maintainer pushing from their own
#      personal fork) and same-repo branches (resolve-agent bot, which outside
#      contributors cannot push to) are trusted and deploy without the gate.
# Repo-settings prerequisite: create an Environment named `ui-preview-fork`
# (Settings -> Environments) with "Required reviewers" set to the maintainer
# team. Without it the gate is a no-op (the job just runs), so it must be
# configured for guard #2 to take effect. See .github/ui-preview/README.md.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR whose preview should be deleted'
        required: true
        type: string
      expected_id:
        description: 'App ID observed by the cleanup reconciler'
        required: true
        type: string
      expected_create_time:
        description: 'App creation timestamp observed by the cleanup reconciler'
        required: true
        type: string
      expected_update_time:
        description: 'App update timestamp observed by the cleanup reconciler'
        required: true
        type: string
      expected_creator:
        description: 'App creator observed by the cleanup reconciler'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/ui-preview.yml
      - .github/ui-preview/**
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - closed

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch'
        && format('cleanup-{0}', inputs.pr_number)
        || github.event.pull_request.number
        || 'main' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  COMMENT_MARKER: "<!-- ui-preview -->"

permissions: {}

jobs:
  notify:
    if: >-
      github.event_name != 'push'
      && github.event.action != 'closed'
      && contains(github.event.pull_request.labels.*.name, 'ui-preview')
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BODY="${COMMENT_MARKER}

          **UI Preview** is being deployed for this PR :hourglass_flowing_sand:

          | | |
          |---|---|
          | **Commit** | ${HEAD_SHA} |
          | **Run** | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          > Building and deploying... This comment will be updated with the preview URL."

          # Only post if no existing comment (to avoid overwriting a previous preview URL)
          COMMENT_ID=$(gh api --paginate \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" \
            | head -1)

          if [ -z "$COMMENT_ID" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi

  build:
    if: >-
      github.event_name == 'push'
      || (
        github.event.action != 'closed'
        && contains(github.event.pull_request.labels.*.name, 'ui-preview')
        && github.event.pull_request.draft == false
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          # Pin to the PR's HEAD SHA, not the live `refs/pull/<n>/merge` ref.
          # The merge ref silently re-points to whatever commit was last pushed,
          # so building it would re-trust the label against unreviewed code on
          # every `synchronize`. A fixed head SHA builds one specific,
          # inspectable commit -- the deploy Environment gate below is what
          # forces re-approval when a fork PR gets a new commit. For push events
          # (no PR) fall back to the pushed sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # checkout v7 blocks fork PR checkout on `pull_request_target` by
          # default; opt in since this job builds the preview from fork code.
          # Safe: it has no secrets (only `contents: read`), the `ui-preview`
          # label gate above restricts it to labelled PRs (an outside
          # contributor cannot self-label), and we build a pinned head SHA.
          allow-unsafe-pr-checkout: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-pnpm

      - name: Build wheels (no UI)
        # Build the wheels WITHOUT the SPA so they stay small (Databricks Apps
        # caps each source wheel at 10MB). The SPA ships separately as
        # build.tar.gz and is extracted at runtime by app.py. SKIP_WEB_UI skips
        # build.sh's own npm build; OMNIGENT_SKIP_WEB_UI makes setup.py skip the
        # in-wheel UI build.
        env:
          SKIP_WEB_UI: "1"
          OMNIGENT_SKIP_WEB_UI: "true"
        run: bash deploy/databricks/build.sh

      - name: Build UI
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build

      - name: Package UI assets
        run: |
          tar czf /tmp/build.tar.gz -C omnigent/server/static web-ui
          UI_SIZE=$(stat -c %s /tmp/build.tar.gz)
          echo "UI assets size: $(numfmt --to=iec "$UI_SIZE")"

      - name: Prepare app files
        run: |
          mkdir -p /tmp/app-deploy
          cp .github/ui-preview/app.py /tmp/app-deploy/
          cp .github/ui-preview/app.yaml /tmp/app-deploy/
          cp /tmp/build.tar.gz /tmp/app-deploy/
          cp dist/*.whl /tmp/app-deploy/
          for whl in /tmp/app-deploy/*.whl; do
            size=$(stat -c %s "$whl")
            echo "Wheel $(basename "$whl"): $(numfmt --to=iec "$size")"
            # Fail fast: an oversize wheel can't be installed from the app source
            # snapshot and would otherwise fail later in the deploy with a far
            # less obvious error. (deploy/databricks/deploy.py raises here too.)
            if [ "$size" -gt 10485760 ]; then
              echo "::error::$(basename "$whl") exceeds the 10MB Databricks Apps wheel limit"
              exit 1
            fi
          done
          # Databricks Apps must install via uv (pyproject.toml + uv.lock), NOT a
          # plain requirements.txt: the pip path uses the platform's Python 3.11,
          # but omnigent requires >=3.12 -- uv provisions 3.12. The three wheels
          # are wired as local path sources so they resolve from disk, not PyPI.
          # Mirrors deploy/databricks/deploy.py (build_uv_pyproject + run_uv_lock).
          python - <<'PY'
          import glob, os
          d = "/tmp/app-deploy"
          def whl(prefix):
              hits = [os.path.basename(p) for p in glob.glob(f"{d}/{prefix}*.whl")]
              assert len(hits) == 1, (prefix, hits)
              return hits[0]
          sources = {
              "omnigent": whl("omnigent-"),
              "omnigent-client": whl("omnigent_client-"),
              "omnigent-ui-sdk": whl("omnigent_ui_sdk-"),
          }
          lines = [
              "[project]",
              'name = "omnigent-ui-preview"',
              'version = "0.0.0"',
              'requires-python = ">=3.12,<3.13"',
              "dependencies = [",
              '  "omnigent",',
              '  "omnigent-client",',
              '  "omnigent-ui-sdk",',
              "]",
              "",
              "[tool.uv.sources]",
              *[f'{name} = {{ path = "./{fname}" }}' for name, fname in sources.items()],
          ]
          open(f"{d}/pyproject.toml", "w").write("\n".join(lines) + "\n")
          print(open(f"{d}/pyproject.toml").read())
          PY
          ( cd /tmp/app-deploy && uv lock --python 3.12 --index-url https://pypi.org/simple )
          echo "app-deploy contents:"; ls -1 /tmp/app-deploy

      - name: Upload app files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-deploy
          path: /tmp/app-deploy/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    # Gate the secret-bearing deploy behind a protected Environment for
    # UNTRUSTED fork PRs only: a labelled outside-contributor fork PR that gets a
    # new commit must wait for a human reviewer to approve this run before it can
    # deploy with Databricks OAuth-M2M creds. Trusted authors (repo
    # owners/members/collaborators -- e.g. a maintainer working from their own
    # personal fork) skip the gate, as do same-repo branches (resolve-agent bot,
    # which outside contributors can't push to) and `push` to main. `fork` alone
    # is true even for a maintainer's own fork, so we also check
    # `author_association` to keep maintainer forks from hitting the approval
    # prompt. `environment` must be a static string, so select it with a
    # conditional: `ui-preview-fork` (protected -> requires approval) for
    # untrusted forks, empty (no gate) otherwise. The Environment's "Required
    # reviewers" rule is configured in repo Settings; see the header note.
    environment: >-
      ${{ (github.event.pull_request.head.repo.fork
           && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
           && 'ui-preview-fork') || '' }}
    # Use ubuntu-latest. If the Databricks workspace IP-allowlists, register a
    # static-IP runner and switch `runs-on` to it.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 60
    steps:
      - name: Download app files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: app-deploy
          path: /tmp/app-deploy

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/2260866f83a41a2df55e1cfe7ffe038b78325bf6/install.sh | sh
          databricks --version

      - name: Create or update app
        id: app
        timeout-minutes: 40
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          APP_NAME: ${{ github.event_name == 'push' && 'omnigent-ui-preview-dev' || format('omnigent-ui-preview-pr-{0}', github.event.pull_request.number) }}
          APP_DESCRIPTION: ${{ github.event.pull_request.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          refresh_app() {
            APP_JSON=$(databricks apps get "$APP_NAME" -o json)
            if ! jq -e --arg id "$APP_ID" --arg name "$APP_NAME" \
              '.id == $id and .name == $name' <<< "$APP_JSON" > /dev/null; then
              echo "::error::App identity changed while provisioning; refusing to continue"
              exit 1
            fi
            APP_STATE=$(jq -er '.compute_status.state' <<< "$APP_JSON")
            jq -r '"Compute state: \(.compute_status.state): \(.compute_status.message // "no details")"' \
              <<< "$APP_JSON"
          }

          # A failed lookup must not turn an auth/API error into a create attempt.
          APP_JSON=$(databricks apps list -o json | jq -c --arg name "$APP_NAME" \
            '.[] | select(.name == $name)')
          if [ -n "$APP_JSON" ]; then
            APP_JSON=$(databricks apps get "$APP_NAME" -o json)
          fi

          for attempt in $(seq 1 3); do
            echo "Provisioning attempt $attempt/3"
            if [ -z "$APP_JSON" ]; then
              APP_JSON=$(databricks apps create \
                --json "$(jq -cn --arg name "$APP_NAME" --arg description "$APP_DESCRIPTION" \
                  '{name: $name, description: $description}')" --no-wait -o json)
            fi
            APP_ID=$(jq -er '.id | select(type == "string" and length > 0)' <<< "$APP_JSON")

            # Existing deployments retain their app identity, permissions, and URL.
            if jq -e '.active_deployment != null or .pending_deployment != null
              or (.default_source_code_path // "") != ""' <<< "$APP_JSON" > /dev/null; then
              echo "App already has a deployment; reusing without recreation"
              break
            fi

            for poll in $(seq 1 40); do
              refresh_app
              if [ "$APP_STATE" = "ACTIVE" ]; then
                break
              elif [ "$APP_STATE" = "ERROR" ] || [ "$APP_STATE" = "STOPPED" ]; then
                break
              fi
              sleep 15
            done

            # Provisioning may have finished during the last polling interval.
            if [ "$APP_STATE" != "ACTIVE" ]; then
              refresh_app
            fi
            if [ "$APP_STATE" = "ACTIVE" ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Compute did not become ACTIVE after 3 attempts (last state: $APP_STATE)"
              exit 1
            fi

            # Only an undeployed preview owned by this workflow is disposable.
            if ! jq -e --arg creator "$DATABRICKS_CLIENT_ID" --arg description "$APP_DESCRIPTION" \
              '.creator == $creator and .description == $description
              and .active_deployment == null and .pending_deployment == null
              and .pending_update == null
              and (.default_source_code_path // "") == ""
              and ((.resources // []) | length == 0)
              and (.compute_status.state | IN("STARTING", "ERROR", "STOPPED"))' \
              <<< "$APP_JSON" > /dev/null; then
              echo "::error::App is not an unchanged, undeployed preview; refusing to recreate"
              exit 1
            fi

            echo "::warning::Compute did not become ACTIVE (last state: $APP_STATE); recreating $APP_NAME"
            databricks apps delete "$APP_NAME" --auto-approve
            for poll in $(seq 1 20); do
              APP_JSON=$(databricks apps list -o json | jq -c --arg name "$APP_NAME" \
                '.[] | select(.name == $name)')
              if [ -z "$APP_JSON" ]; then
                break
              fi
              if ! jq -e --arg id "$APP_ID" '.id == $id' <<< "$APP_JSON" > /dev/null; then
                echo "::error::App identity changed during deletion; refusing to continue"
                exit 1
              fi
              sleep 3
            done
            if [ -n "$APP_JSON" ]; then
              echo "::error::App still exists after deletion; refusing to create another app"
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

          if ! URL=$(jq -er '.url | select(type == "string" and startswith("https://"))' <<< "$APP_JSON"); then
            echo "::error::App has no usable preview URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload files and deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          APP_NAME: ${{ github.event_name == 'push' && 'omnigent-ui-preview-dev' || format('omnigent-ui-preview-pr-{0}', github.event.pull_request.number) }}
          WORKSPACE_PATH: /Users/${{ secrets.DATABRICKS_CLIENT_ID }}/apps/${{ github.event_name == 'push' && 'omnigent-ui-preview-dev' || format('omnigent-ui-preview-pr-{0}', github.event.pull_request.number) }}
        run: |
          # Wipe the workspace source dir first. import-dir --overwrite only
          # replaces files it uploads; it does NOT prune orphans. A requirements.txt
          # left by an earlier deploy would otherwise survive and take precedence
          # over uv (pyproject.toml + uv.lock), forcing the pip/Python-3.11 install
          # path that fails omnigent's requires-python >=3.12.
          databricks workspace delete "$WORKSPACE_PATH" --recursive 2>/dev/null || true
          databricks workspace mkdirs "$WORKSPACE_PATH" 2>/dev/null || true
          databricks workspace import-dir /tmp/app-deploy "$WORKSPACE_PATH" --overwrite
          databricks apps deploy "$APP_NAME" --source-code-path "/Workspace$WORKSPACE_PATH"

      - name: Restart app to load the new code
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          APP_NAME: ${{ github.event_name == 'push' && 'omnigent-ui-preview-dev' || format('omnigent-ui-preview-pr-{0}', github.event.pull_request.number) }}
        run: |
          # `apps deploy` restarts the app process and re-extracts source, but
          # reuses the existing Python env, so a freshly built wheel is not
          # reinstalled. Stop then start so the env is rebuilt from the deployed
          # source.
          echo "Stopping app..."
          databricks apps stop "$APP_NAME"
          for i in $(seq 1 40); do
            STATE=$(databricks apps get "$APP_NAME" -o json | jq -r '.compute_status.state')
            echo "Compute state: $STATE"
            if [ "$STATE" = "STOPPED" ]; then
              break
            elif [ "$STATE" = "ERROR" ]; then
              echo "::error::Compute entered ERROR state while stopping"
              exit 1
            fi
            sleep 15
          done

          echo "Starting app..."
          databricks apps start "$APP_NAME"
          for i in $(seq 1 40); do
            STATE=$(databricks apps get "$APP_NAME" -o json | jq -r '.compute_status.state')
            echo "Compute state: $STATE"
            if [ "$STATE" = "ACTIVE" ]; then
              break
            elif [ "$STATE" = "ERROR" ]; then
              echo "::error::Compute entered ERROR state"
              exit 1
            fi
            sleep 15
          done
          if [ "$STATE" != "ACTIVE" ]; then
            echo "::error::Timed out waiting for compute to become ACTIVE (last state: $STATE)"
            exit 1
          fi

      - name: Print app URL
        if: github.event_name == 'push'
        env:
          APP_URL: ${{ steps.app.outputs.url }}
        run: echo "Deployed to $APP_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ steps.app.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY="${COMMENT_MARKER}

          **UI Preview** is ready for this PR :rocket:

          | | |
          |---|---|
          | **URL** | ${APP_URL} |
          | **Commit** | $COMMIT_SHA |
          | **Run** | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          The preview serves the UI only. To drive a real session, connect your own host from your machine or sandbox:

          \`\`\`sh
          omnigent host --server ${APP_URL}
          \`\`\`

          > [!NOTE]
          > This preview is only accessible to maintainers with workspace access.
          > The preview updates automatically when new commits are pushed."

          COMMENT_ID=$(gh api --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" \
            | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi

  cleanup:
    # No `ui-preview` label gate here on purpose: if the label is removed before
    # the PR closes, a labelled-then-unlabelled PR would otherwise leak its app
    # and workspace files forever. Run on every close; the delete step is a cheap
    # no-op (one existence check) for PRs that never had a preview.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name != 'push'
        && github.event.action == 'closed'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/2260866f83a41a2df55e1cfe7ffe038b78325bf6/install.sh | sh
          databricks --version

      - name: Delete app
        id: delete
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_ID: ${{ inputs.expected_id }}
          EXPECTED_CREATE_TIME: ${{ inputs.expected_create_time }}
          EXPECTED_UPDATE_TIME: ${{ inputs.expected_update_time }}
          EXPECTED_CREATOR: ${{ inputs.expected_creator }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/ui-preview-cleanup-result.json"
          INVENTORY="$RUNNER_TEMP/ui-preview-apps.json"
          APP_JSON="$RUNNER_TEMP/ui-preview-app.json"
          record_result() {
            jq -n --arg action "$1" --arg reason "$2" \
              '{action: $action, reason: $reason}' > "$RESULT"
            echo "action=$1" >> "$GITHUB_OUTPUT"
          }
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            record_result error 'invalid PR number'
            exit 1
          fi
          APP_NAME="omnigent-ui-preview-pr-$PR_NUMBER"

          databricks apps list -o json > "$INVENTORY"
          if ! jq -e --arg name "$APP_NAME" '.[] | select(.name == $name)' \
              "$INVENTORY" > "$APP_JSON"; then
            echo "App is already absent: $APP_NAME"
            record_result absent 'app was already absent'
            exit 0
          fi

          databricks apps get "$APP_NAME" -o json > "$APP_JSON"
          if [[ "$DISPATCHED" == true ]]; then
            EXPECTED_URL="https://github.com/$REPO/pull/$PR_NUMBER"
            jq -e \
              --arg name "$APP_NAME" \
              --arg id "$EXPECTED_ID" \
              --arg create_time "$EXPECTED_CREATE_TIME" \
              --arg update_time "$EXPECTED_UPDATE_TIME" \
              --arg creator "$EXPECTED_CREATOR" \
              --arg description "$EXPECTED_URL" \
              '
                .name == $name
                and .id == $id
                and .create_time == $create_time
                and .update_time == $update_time
                and .description == $description
                and .creator == $creator
                and .default_source_code_path == ("/Workspace/Users/" + .creator + "/apps/" + $name)
                and ((.resources // []) | length == 0)
                and (.compute_status.state | IN("ACTIVE", "STOPPED", "ERROR"))
                and (.pending_deployment == null)
                and (.pending_update == null)
              ' "$APP_JSON" > /dev/null || {
                echo 'App changed after cleanup review; refusing deletion'
                record_result error 'app changed after cleanup review'
                exit 1
              }
            if [[ "$EXPECTED_CREATOR" != "$DATABRICKS_CLIENT_ID" ]]; then
              echo 'App belongs to another deployment principal; retaining it'
              record_result retain 'app belongs to another deployment principal'
              exit 0
            fi
          fi

          SOURCE_PATH=$(jq -r '.default_source_code_path // empty' "$APP_JSON")
          databricks apps delete "$APP_NAME" --auto-approve
          for _ in $(seq 1 20); do
            databricks apps list -o json > "$INVENTORY"
            if ! jq -e --arg name "$APP_NAME" '.[] | select(.name == $name)' \
                "$INVENTORY" > /dev/null; then
              break
            fi
            sleep 3
          done
          if jq -e --arg name "$APP_NAME" '.[] | select(.name == $name)' \
              "$INVENTORY" > /dev/null; then
            echo "App still exists after deletion: $APP_NAME"
            record_result error 'app still exists after deletion'
            exit 1
          fi
          if [[ "$DISPATCHED" != true && -n "$SOURCE_PATH" ]]; then
            WS_PATH="${SOURCE_PATH#/Workspace}"
            databricks workspace delete "$WS_PATH" --recursive 2>/dev/null || true
          fi
          record_result deleted 'app deleted and absence verified'

      - name: Upload cleanup result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-preview-cleanup-result
          path: ${{ runner.temp }}/ui-preview-cleanup-result.json
          retention-days: 1
          if-no-files-found: warn

      - name: Update PR comment
        if: steps.delete.outputs.action == 'deleted' || steps.delete.outputs.action == 'absent'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
        run: |
          BODY="${COMMENT_MARKER}

          **UI Preview** for this PR has been removed."

          COMMENT_ID=$(gh api --paginate \
            "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" \
            | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          fi
