name: Merge Ready policy tests

on:
  pull_request:
    paths:
      - .github/scripts/merge-ready/**
      - .github/workflows/merge-ready.yml
      - .github/workflows/merge-ready-sweep.yml
      - .github/workflows/merge-ready-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-ready-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test expiry sweep
        run: node --test .github/scripts/merge-ready/sweep.test.js
      - name: Check gate shell syntax
        run: |
          for script in .github/scripts/merge-ready/*.sh; do
            bash -n "$script"
          done
