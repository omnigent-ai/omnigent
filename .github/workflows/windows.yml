name: Windows (native)

# Dependabot Python/Actions merges require the smoke + unit job.
# The broader unit sweep remains nonblocking while Windows support stabilizes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'designs/**'
      - 'CHANGELOG.md'
      - 'tests/browser_ui/**'
      - 'tests/e2e_ui/**'
      - 'tests/scripts/**'
      - 'tests/github/**'
      - '.github/scripts/polly-review-*.py'
      - '.github/workflows/polly-review*.yml'
      - '.github/workflows/*.js'
      - 'tests/e2e/**'
      - 'tests/integration/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'designs/**'
      - 'CHANGELOG.md'
      - 'tests/browser_ui/**'
      - 'tests/e2e_ui/**'
      - 'tests/scripts/**'
      - 'tests/github/**'
      - '.github/scripts/polly-review-*.py'
      - '.github/workflows/polly-review*.yml'
      - '.github/workflows/*.js'
      - 'tests/e2e/**'
      - 'tests/integration/**'

permissions:
  contents: read

env:
  # No web SPA build during `uv sync`; this job never serves the bundle.
  OMNIGENT_SKIP_WEB_UI: "true"
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/security-gate.yml
    permissions:
      contents: read
      pull-requests: read

  scope:
    name: Windows scope
    needs: gate
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
      dependency: ${{ steps.scope.outputs.dependency }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/dependency-ci-scope

  windows-smoke:
    name: Windows smoke + unit
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.windows == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install dependencies
        # tests/inner includes tracing tests that import the OpenTelemetry SDK.
        run: uv sync --locked --group test --extra tracing

      - name: Import + CLI smoke
        run: |
          uv run python -c "import omnigent; print('import omnigent OK')"
          uv run omnigent --help

      - name: Windows-support unit tests (hard)
        run: >-
          uv run pytest
          tests/inner/test_proc_and_platform.py
          tests/inner/test_claude_sdk_windows_api_key_helper.py
          tests/runtime/test_process_manager.py
          -p no:cacheprovider -q

      - name: Native Windows Claude SDK static-key session (mock gateway)
        env:
          OMNI_WINDOWS_HELPER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-helper-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $script = Join-Path $evidence 'session.ps1'
          @'
          Set-Location $env:GITHUB_WORKSPACE
          $Host.UI.RawUI.WindowTitle = 'Native Windows Claude SDK static-key session (mock)'
          Write-Output "PR head: $env:OMNI_WINDOWS_HELPER_HEAD_SHA"
          uv run pytest tests/inner/test_claude_sdk_windows_static_helper_session.py --reruns 0 -p no:cacheprovider -q -s 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-helper-evidence/session.txt')
          $testCode = $LASTEXITCODE
          $testCode | Set-Content (Join-Path $env:RUNNER_TEMP 'windows-helper-evidence/exit.txt')
          Start-Sleep -Seconds 15
          exit $testCode
          '@ | Set-Content $script
          $console = Start-Process (Get-Command pwsh).Source -PassThru -WindowStyle Maximized `
            -ArgumentList @('-NoProfile', '-File', "`"$script`"")
          try {
            $exitFile = Join-Path $evidence 'exit.txt'
            $deadline = (Get-Date).AddSeconds(180)
            while (!(Test-Path $exitFile) -and !$console.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path $exitFile)) { throw 'Native SDK session did not report an exit code' }
            Get-Content (Join-Path $evidence 'session.txt')
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try {
                  $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                } finally { $graphics.Dispose() }
                $colors = [System.Collections.Generic.HashSet[int]]::new()
                foreach ($x in 0..9) {
                  foreach ($y in 0..9) {
                    [void]$colors.Add($bitmap.GetPixel([int]($x * $bounds.Width / 10), [int]($y * $bounds.Height / 10)).ToArgb())
                  }
                }
                if ($colors.Count -le 1) { throw 'Windows desktop capture is blank' }
                $bitmap.Save((Join-Path $evidence 'session.png'), [System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $bitmap.Dispose() }
            } catch {
              Write-Warning "Native console capture unavailable: $($_.Exception.Message)"
            }
            if ([int](Get-Content $exitFile) -ne 0) { throw 'Native SDK session test failed' }
            [void]$console.WaitForExit(20000)
          } finally {
            if (!$console.HasExited) { Stop-Process -Id $console.Id -Force }
          }

      - name: Upload native Windows SDK session evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-helper-session-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-helper-evidence/session.txt
            ${{ runner.temp }}/windows-helper-evidence/session.png
            ${{ runner.temp }}/windows-helper-evidence/exit.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Codex skill junction regressions (hard)
        run: >-
          uv run pytest
          tests/inner/test_codex_executor.py::test_populate_codex_skills_preserves_linked_junctions_without_symlink_privilege
          tests/inner/test_codex_executor.py::test_populate_codex_skills_copy_mode_skips_nested_junctions
          tests/inner/test_codex_staging.py::test_skills_link_junction_resolves_into_the_granted_directory
          tests/inner/test_codex_staging.py::test_skills_refresh_does_not_follow_junctions
          tests/inner/test_codex_staging.py::test_skills_refresh_rejects_junction_root
          -p no:cacheprovider -q

      - name: Broader unit sweep (non-blocking)
        continue-on-error: true
        run: >-
          uv run pytest tests/inner tests/runtime/harnesses
          -m "not posix_only"
          -p no:cacheprovider -q
