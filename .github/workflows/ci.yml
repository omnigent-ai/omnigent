name: CI

# Unit-test pytest matrix on every non-draft PR and on push to main. Tests are
# split across directory-based matrix groups (runtime-*, server-*, inner-rest,
# tools, repl-sdk, spec-llms, runner-app, stores, misc) so slow files don't
# bottleneck one runner; the slowest groups use `--dist=worksteal` to fan tests
# out within a file. The `misc` group is a catch-all so new top-level
# tests/<dir>/ are picked up automatically (it ignores the dirs that have their
# own group). Draft PRs are skipped (ready_for_review re-fires the workflow).
# A `coverage-report` job combines per-shard coverage for code-coverage.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'designs/**'
      - 'CHANGELOG.md'
      - 'tests/browser_ui/**'
      - 'tests/e2e_ui/**'
  push:
    branches:
      - main
      # Release branches: release.yml's green-CI gate reads check runs off the
      # branch head, so cherry-picks and release-bump commits must run CI.
      - 'release/v[0-9]*'
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - 'designs/**'
      - 'CHANGELOG.md'
      - 'tests/browser_ui/**'
      - 'tests/e2e_ui/**'

permissions:
  contents: read

env:
  # No web SPA build during `uv sync`; this job never serves the bundle.
  OMNIGENT_SKIP_WEB_UI: "true"
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Security precondition gate (security-gate.yml): untrusted PRs wait for the
  # scan; trusted authors / non-PR events pass through.
  gate:
    uses: ./.github/workflows/security-gate.yml

  scope:
    name: CI scope
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dependency: ${{ steps.scope.outputs.dependency }}
      backend: ${{ steps.scope.outputs.backend }}
      database: ${{ steps.scope.outputs.database }}
      python_matrix: ${{ steps.scope.outputs.python_matrix }}
      omnidev: ${{ steps.scope.outputs.omnidev }}
      sidecar: ${{ steps.scope.outputs.sidecar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/dependency-ci-scope
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/dependency-ci-scope

  pytest:
    name: Pytest (${{ matrix.group }})
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.python_matrix) }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Set up Node.js for local relay tests
        if: matrix.group == 'misc'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install test system dependencies
        # ripgrep: the Grep tool prefers it. bubblewrap: the linux_bwrap sandbox
        # needs it. tmux: the integration-mock shard spawns harness terminals.
        # apparmor sysctl: Ubuntu 24.04 blocks unprivileged user namespaces
        # that bwrap needs; scope is the ephemeral runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap tmux
          if [ "${{ matrix.group }}" = "inner-rest" ]; then
            sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        # matrix.extra (e.g. "databricks") adds an extra for lanes that need it;
        # empty for the default lanes.
        run: uv sync --locked --extra all --group test ${{ matrix.extra && format('--extra {0}', matrix.extra) || '' }}

      - name: Run pytest
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          DEPENDENCY: ${{ needs.scope.outputs.dependency }}
          PYTEST_PROGRESS_LOG_DIR: artifacts/progress
          OMNIGENT_TOKEN_USAGE_JSON: artifacts/tokens-${{ matrix.group }}.json
          # Outside the repo: coverage.py's transient `.coverage.*` files
          # under the ro-bound cwd raced the sandbox's dotfile masker. Staged
          # back into artifacts/ below for the coverage-report job.
          COVERAGE_FILE: ${{ runner.temp }}/omnigent-coverage/.coverage.${{ matrix.group }}
          # sysmon: the default C-trace coverage backend pushed the heaviest
          # shard past its timeout; only line coverage is collected.
          COVERAGE_CORE: sysmon
          # Multiplies the tests' hang-guard waits (tests.budgets.budget).
          # A shared runner under -n 4+ can stall an event loop past a 1s
          # budget; local runs keep the unscaled default and fail fast.
          OMNIGENT_TEST_TIMEOUT_SCALE: "4"
        run: |
          mkdir -p artifacts artifacts/progress "$(dirname "$COVERAGE_FILE")"
          # matrix.paths is unquoted on purpose: it word-splits into pytest args.
          # shellcheck disable=SC2086
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DATABRICKS_TOKEN \
            uv run pytest ${{ matrix.paths }} \
              -m "${{ matrix.markexpr || 'not databricks' }}" \
              -n ${{ matrix.workers || '8' }} \
              --dist=${{ matrix.dist || 'loadfile' }} \
              --timeout=300 \
              --junitxml=artifacts/pytest-${{ matrix.group }}.xml \
              --cov=omnigent --cov-report= \
              -v --tb=long --showlocals --log-level=INFO -r a \
              || { rc=$?; [ "$rc" -eq 5 ] && [ "$DEPENDENCY" != "true" ] && echo "::notice::No tests collected in this shard; treating as a pass." || exit "$rc"; }

      - name: Stage coverage data for upload
        if: always()
        shell: bash
        run: |
          cov_file="${{ runner.temp }}/omnigent-coverage/.coverage.${{ matrix.group }}"
          if [[ -f "$cov_file" ]]; then
            cp "$cov_file" "artifacts/.coverage.${{ matrix.group }}"
          else
            echo "::notice::No coverage data file at $cov_file; nothing to stage."
          fi

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-${{ matrix.group }}-${{ github.run_id }}
          # A retry must replace the failed attempt's partial coverage.
          overwrite: true
          path: artifacts/
          retention-days: 14
          include-hidden-files: true  # the per-shard .coverage.<group> dotfile

  stores-postgres:
    name: Pytest (stores-postgres)
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: omnigent
          POSTGRES_DB: omnigent_root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra all --group test --extra databricks
      - name: Run store + DB tests against PostgreSQL
        env:
          OMNIGENT_TEST_DB_URI: postgresql+psycopg://postgres:omnigent@localhost:5432/omnigent_root
        run: |
          uv run pytest tests/stores tests/db \
            -m "not databricks" \
            -n 4 \
            --dist=loadfile \
            --timeout=300 \
            --junitxml=artifacts/pytest-stores-postgres.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-stores-postgres-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

  # One lane on the minimum supported CockroachDB, mirroring the single-version
  # postgres/mysql lanes. The full version matrix runs locally via `just crdb-test`.
  stores-cockroachdb:
    name: Pytest (stores-crdb-${{ matrix.crdb_version }})
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crdb_version: "23.2.28"
            crdb_service: crdb-23-2-28
            crdb_port: 26323
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Start CockroachDB
        run: |
          docker compose -f deploy/cockroachdb/docker-compose.yml up \
            --detach --wait --wait-timeout 90 "${{ matrix.crdb_service }}"
          if [[ "${{ matrix.crdb_version }}" == "23.2.28" ]]; then
            docker compose -f deploy/cockroachdb/docker-compose.yml exec -T \
              "${{ matrix.crdb_service }}" cockroach sql --insecure \
              --execute="SET CLUSTER SETTING sql.txn.read_committed_isolation.enabled = true"
          fi
      - name: Install dependencies
        run: uv sync --locked --extra all --extra cockroachdb --group test
      - name: Run store + DB tests against CockroachDB
        env:
          OMNIGENT_TEST_DB_URI: cockroachdb+psycopg://root@localhost:${{ matrix.crdb_port }}/defaultdb?sslmode=disable
        run: |
          uv run pytest tests/stores tests/db \
            -m "not databricks" \
            -n 4 \
            --dist=loadfile \
            --timeout=300 \
            --junitxml=artifacts/pytest-stores-crdb.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-stores-crdb-${{ matrix.crdb_version }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

  stores-mysql:
    name: Pytest (stores-mysql)
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: omnigent
          MYSQL_DATABASE: omnigent_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pomnigent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
      - name: Install system MySQL client library
        run: sudo apt-get update -qq && sudo apt-get install -y -q libmysqlclient-dev
      - name: Install dependencies
        run: uv sync --locked --extra all --group test --extra databricks && uv pip install mysqlclient
      - name: Run store + DB tests against MySQL
        env:
          OMNIGENT_TEST_DB_URI: mysql+mysqldb://root:omnigent@127.0.0.1:3306/omnigent_root
        run: |
          uv run pytest tests/stores tests/db \
            -m "not databricks" \
            -n 4 \
            --dist=loadfile \
            --timeout=300 \
            --junitxml=artifacts/pytest-stores-mysql.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-stores-mysql-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

  omnidev:
    name: Rust tests (omnidev)
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.omnidev == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - id: rustc
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            dev/omnidev/target
          key: omnidev-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('dev/omnidev/**', '!dev/omnidev/target/**') }}
      - name: Test omnidev
        run: cargo test --locked --manifest-path dev/omnidev/Cargo.toml

  codex-parity:
    name: Pytest (codex-parity)
    needs: scope
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.sidecar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - name: Capture Rust version
        id: rustc
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # The sidecar source is frozen and its deps are rev-pinned, so the binary is
      # a pure function of sidecar/** + the toolchain. Cache the built binary (not
      # the 1.6 GB target dir) and skip the ~3 min compile below on a hit; the key
      # self-invalidates when the source, Cargo.lock, or rustc changes.
      - name: Cache parity sidecar binary
        id: sidecar-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp-codex-parity-target/debug/codex-parity-sidecar
          key: codex-parity-bin-locked-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('tests/codex_parity/sidecar/**') }}

      - name: Set up pnpm
        # This job never runs pnpm install, so caching the (empty) pnpm store
        # makes setup-node's post-step fail on a cache miss.
        uses: ./.github/actions/setup-pnpm
        with:
          cache: ""

      - name: Install codex CLI
        uses: omnigent-ai/omnigent/.github/actions/setup-harness-cli@395b8b175c17c1d8f393f82dddd15222c6200e74
        with:
          harness: codex

      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --locked --extra all --group test

      - name: Build parity sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked \
            --manifest-path tests/codex_parity/sidecar/Cargo.toml \
            --target-dir .tmp-codex-parity-target

      - name: Run codex parity tests
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          # Reuse the binary from the "Build parity sidecar" step above so the
          # fixture doesn't re-invoke cargo build during collection.
          CODEX_PARITY_SIDECAR_BIN: ${{ github.workspace }}/.tmp-codex-parity-target/debug/codex-parity-sidecar
        run: |
          mkdir -p artifacts
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DATABRICKS_TOKEN \
            uv run pytest tests/codex_parity/ \
              --codex-parity \
              --timeout=300 \
              --junitxml=artifacts/pytest-codex-parity.xml \
              -v --tb=long --showlocals --log-level=INFO -r a

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pytest-codex-parity-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

  result:
    name: CI result
    if: always()
    needs: [scope, pytest, stores-postgres, stores-cockroachdb, stores-mysql, omnidev, codex-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful test selection
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
        run: test "$SELECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/scripts/ci
          persist-credentials: false
      - name: Require selected consumer results
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 .github/scripts/ci/require_results.py ci

  coverage-report:
    name: Coverage report
    # Combines per-shard coverage into a coverage-summary artifact. Runs in the
    # unprivileged pull_request context (read-only); code-coverage.yml consumes
    # the artifact and posts the status. Report-only.
    #
    # Only runs when every pytest shard passed: a failed shard drops its covered
    # lines from the combine, so coverage off partial data would be misleading —
    # and a red run gets re-run anyway, re-triggering this.
    needs: [pytest, scope]
    if: ${{ success() && !github.event.pull_request.draft && needs.scope.outputs.dependency != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install coverage
        run: pip install "coverage>=7"

      - name: Download shard coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: pytest-*
          path: covdata
          merge-multiple: true

      - name: Combine + report
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(covdata/**/.coverage.*)
          mkdir -p coverage-summary
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::warning::No coverage data files found; skipping coverage report."
            exit 0
          fi
          echo "Combining ${#files[@]} shard data file(s)."
          coverage combine "${files[@]}"
          # --ignore-errors: a plain checkout lacks uv-sync-generated files.
          coverage report --format=markdown --ignore-errors > "$RUNNER_TEMP/coverage-report.md"
          { echo "## Coverage"; echo; cat "$RUNNER_TEMP/coverage-report.md"; } >> "$GITHUB_STEP_SUMMARY"
          coverage xml -o coverage-summary/coverage.xml --ignore-errors
          python .github/scripts/ci/coverage-total.py "$RUNNER_TEMP/coverage-report.md" > coverage-summary/total.txt
          echo "Total coverage: $(cat coverage-summary/total.txt)%"

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-summary-${{ github.run_id }}
          # The status workflow must consume the recomputed summary on retries.
          overwrite: true
          path: coverage-summary/
          retention-days: 14
          if-no-files-found: ignore
