# Build-only Docker check for PRs. Compensates for retiring per-commit main
# publishes (oss-publish-images.yml now builds on tags + nightly only): a broken
# Dockerfile / lockfile / frontend build would otherwise not surface until the
# nightly rebuild or a release. Builds the server image single-arch (linux/amd64)
# with the GHA layer cache and runs a `omnigent --help` CLI smoke. Changes to the
# Cloudflare deployment or JavaScript lockfiles additionally run Wrangler's full
# dry-run, including its derived container build. Nothing is pushed or deployed.
#
# Scope: the server target exercises the shared builder stage (Python deps +
# web SPA build) that all five published variants inherit, so it catches the
# common breakage without paying for the host/provider variants or the emulated
# arm64 leg.
#
# Blocking merge-gate check: "Docker build" is in the REQUIRED list in
# .github/scripts/merge-ready/required.sh. Because of the paths filter below it
# can legitimately be absent (a PR touching nothing in the image), so it is also
# in ALLOW_SKIP with a workflow_for() arm, and this workflow's name is in
# merge-ready.yml's workflow_run list so the gate re-evaluates when it completes.
name: Docker build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only build when something that lands in the image changes. Mirrors the
    # publish workflow's former push paths (web/** IS included here — the image
    # bakes the SPA, so a web-only PR can still break the build).
    paths:
      - 'deploy/docker/Dockerfile'
      - 'deploy/docker/Dockerfile.ubi'
      - 'deploy/docker/Dockerfile.prebuilt'
      - 'deploy/docker/Dockerfile.dockerignore'
      - 'deploy/docker/entrypoint.py'
      - 'deploy/cloudflare/**'
      - 'deploy/hf-spaces/Dockerfile'
      - 'omnigent/**'
      - 'web/**'
      - 'sdks/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Security precondition gate (security-gate.yml): untrusted PRs wait for the
  # scan before the build runs on their code; trusted authors pass through.
  gate:
    uses: ./.github/workflows/security-gate.yml
    permissions:
      contents: read
      pull-requests: read

  scope:
    name: Docker scope
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/dependency-ci-scope

  build:
    name: Docker build
    needs: scope
    # Draft PRs skip the build (ready_for_review re-fires the workflow), matching
    # the pytest job in ci.yml.
    if: ${{ !github.event.pull_request.draft && needs.scope.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect container consumers
        id: cloudflare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=false
          hf=false
          ubi=false
          prebuilt=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/docker-build.yml)
                changed=true
                hf=true
                ubi=true
                prebuilt=true
                ;;
              deploy/cloudflare/*|pnpm-lock.yaml|pnpm-workspace.yaml)
                changed=true
                ;;
              deploy/hf-spaces/Dockerfile) hf=true ;;
              deploy/docker/Dockerfile.ubi) ubi=true ;;
              deploy/docker/Dockerfile.prebuilt) prebuilt=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "hf=$hf" >> "$GITHUB_OUTPUT"
          echo "ubi=$ubi" >> "$GITHUB_OUTPUT"
          echo "prebuilt=$prebuilt" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Single-arch (amd64) build, no push. load: true imports the result into
      # the runner's Docker so the smoke step below can run it. Shares the same
      # type=gha cache the publish workflow writes, so warm PRs reuse layers.
      - name: Build server image (amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: omnigent-server:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: CLI smoke
        run: docker run --rm omnigent-server:pr-${{ github.event.pull_request.number || github.sha }} omnigent --help

      - name: Set up pnpm
        if: steps.cloudflare.outputs.changed == 'true'
        uses: ./.github/actions/setup-pnpm

      - name: Install Cloudflare deployment dependencies
        if: steps.cloudflare.outputs.changed == 'true'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: pnpm install --frozen-lockfile --filter omnigent-cloudflare

      - name: Cloudflare Worker and container dry-run
        if: steps.cloudflare.outputs.changed == 'true'
        run: pnpm --dir deploy/cloudflare exec wrangler deploy --dry-run

      - name: Build and smoke-test the Cloudflare image
        if: steps.cloudflare.outputs.changed == 'true'
        run: |
          docker build -t omnigent-cloudflare:dependency -f deploy/cloudflare/Dockerfile deploy/cloudflare
          docker run --rm omnigent-cloudflare:dependency omnigent --help

      - name: Build and smoke-test the Hugging Face image
        if: steps.cloudflare.outputs.hf == 'true'
        run: |
          docker build -t omnigent-hf:dependency -f deploy/hf-spaces/Dockerfile deploy/hf-spaces
          docker run --rm omnigent-hf:dependency omnigent --help

      - name: Build and smoke-test the prebuilt image wrapper
        if: steps.cloudflare.outputs.prebuilt == 'true'
        run: |
          docker build -t omnigent-prebuilt:dependency -f deploy/docker/Dockerfile.prebuilt .
          docker run --rm omnigent-prebuilt:dependency omnigent --help

      - name: Build UBI server image
        if: steps.cloudflare.outputs.ubi == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.ubi
          push: false
          load: true
          tags: omnigent-ubi:dependency
          cache-from: type=gha,scope=ubi
          cache-to: type=gha,scope=ubi,mode=max
          provenance: false

      - name: UBI CLI smoke
        if: steps.cloudflare.outputs.ubi == 'true'
        run: docker run --rm omnigent-ubi:dependency omnigent --help

  result:
    name: Docker result
    if: always()
    needs: [scope, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful test selection
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
        run: test "$SELECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/scripts/ci
          persist-credentials: false
      - name: Require selected consumer results
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 .github/scripts/ci/require_results.py docker
