name: Benchmark (release)

# Benchmarks a release candidate against the previous stable release on ONE
# runner, with both suites running concurrently. Hosted VMs differ in speed by
# up to ~1.5x run to run, so baseline and candidate on separate runners report
# machine noise as regressions; sharing a VM (and its neighbours) cancels that.
#
# Called by release.yml before the cut. Also dispatchable for an ad-hoc
# comparison (e.g. an A/A noise check with baseline_ref == candidate_ref), and
# runs on PRs that edit this file so a change is exercised before a release.

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: "Ref to benchmark as the candidate."
        required: true
        type: string
      baseline_ref:
        description: "Ref to compare against (blank = latest stable release)."
        required: false
        type: string
        default: ""
      require_journeys:
        description: "Comma-separated journeys that must be measured on both sides."
        required: false
        type: string
        default: ""
    outputs:
      regression:
        description: "'true' when the candidate regressed past the threshold."
        value: ${{ jobs.benchmark.outputs.regression }}
      complete:
        description: "'false' when a required journey was not measured on both sides."
        value: ${{ jobs.benchmark.outputs.complete }}
      unmeasured:
        description: "Comma-separated required journeys that were not measured."
        value: ${{ jobs.benchmark.outputs.unmeasured }}
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Ref to benchmark as the candidate (blank = dispatch ref HEAD)."
        required: false
        default: ""
      baseline_ref:
        description: "Ref to compare against (blank = latest stable release)."
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/benchmark-release.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Baseline vs candidate (sqlite, same runner)
    if: github.repository == 'omnigent-ai/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level so a release.yml caller never shares its `release` group; keyed
    # on the calling workflow so the PR benchmark's re-check and this file's own
    # PR run never cancel each other. PR pushes cancel the previous run.
    concurrency:
      group: benchmark-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      regression: ${{ steps.compare.outputs.regression }}
      complete: ${{ steps.compare.outputs.complete }}
      unmeasured: ${{ steps.compare.outputs.unmeasured }}
    env:
      OMNIGENT_SKIP_WEB_UI: "true"
      UV_INDEX_URL: https://pypi.org/simple
      PIP_INDEX_URL: https://pypi.org/simple
    steps:
      - name: Resolve baseline and candidate refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASELINE_REF" ]; then
            BASELINE_REF=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
              --jq '[.[] | select(.prerelease == false and .draft == false)] | .[0].tag_name // empty')
          fi
          echo "candidate=${CANDIDATE_REF}" >> "$GITHUB_OUTPUT"
          echo "baseline=${BASELINE_REF}" >> "$GITHUB_OUTPUT"
          if [ -z "$BASELINE_REF" ]; then
            echo "No previous stable release found — benchmarking the candidate alone." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Baseline \`${BASELINE_REF}\` vs candidate \`${CANDIDATE_REF}\`." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.refs.outputs.candidate }}
          path: candidate
          persist-credentials: false

      - name: Check out baseline
        if: steps.refs.outputs.baseline != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.refs.outputs.baseline }}
          path: baseline
          persist-credentials: false

      # Each side keeps its own pinned interpreter. The candidate is set up
      # last so its version is the default `python` on PATH.
      - name: Set up Python (baseline)
        if: steps.refs.outputs.baseline != ''
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: "baseline/.python-version"

      - name: Set up Python (candidate)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: "candidate/.python-version"

      - name: Set up uv
        # Neither checkout is at the workspace root, so use the pinned action.
        uses: omnigent-ai/omnigent/.github/actions/setup-uv@25521b2eb074b11ebe51fe5e3eaeb494e20101eb # self-contained setup
        with:
          enable-cache: true

      - name: Install dependencies (baseline)
        if: steps.refs.outputs.baseline != ''
        working-directory: baseline
        run: uv sync

      - name: Install dependencies (candidate)
        working-directory: candidate
        run: uv sync

      # Seed at the OLDER schema head so both servers can boot: the baseline
      # reads it natively, and the candidate's copy is migrated forward below.
      # Migrations are forward-only, so a newer-head DB would strand the
      # baseline.
      - name: Seed corpus at the baseline schema
        working-directory: ${{ steps.refs.outputs.baseline != '' && 'baseline' || 'candidate' }}
        run: |
          uv run --no-sync dev/benchmarks/omnigent/seed.py \
            --database-uri "sqlite:///bench.db" \
            --sessions 5000 --items-per-session 200

      - name: Copy corpus to the candidate
        if: steps.refs.outputs.baseline != ''
        run: cp baseline/bench.db candidate/bench.db

      # The candidate auto-migrates on boot, but a slow migration can outlast
      # the harness's health-check window. Pre-migrate so it boots current.
      - name: Migrate the candidate corpus
        working-directory: candidate
        run: |
          uv run --no-sync omni debug db-upgrade "sqlite:///bench.db"
          echo "Candidate corpus migrated to its schema head." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run baseline and candidate concurrently
        env:
          BASELINE_REF: ${{ steps.refs.outputs.baseline }}
        run: |
          set -uo pipefail
          sides=(candidate)
          if [ -n "$BASELINE_REF" ]; then sides=(baseline candidate); fi
          pids=()
          for side in "${sides[@]}"; do
            # Own HOME per side: cli_startup runs `omnigent stop`, which would
            # otherwise tear down the other side's daemons via ~/.omnigent.
            mkdir -p "$RUNNER_TEMP/home-$side"
            (
              cd "$side" &&
              HOME="$RUNNER_TEMP/home-$side" uv run --no-sync dev/benchmarks/omnigent/run.py \
                --database-uri "sqlite:///bench.db" \
                --iterations 100 --runs 3 \
                --output "$GITHUB_WORKSPACE/$side.json"
            ) > "$side.log" 2>&1 &
            pids+=("$!")
          done
          rc=0
          for i in "${!sides[@]}"; do
            side="${sides[$i]}"
            wait "${pids[$i]}" || { echo "::error::The $side benchmark failed."; rc=1; }
            echo "::group::$side benchmark log"
            cat "$side.log"
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Compare results
        id: compare
        if: steps.refs.outputs.baseline != ''
        working-directory: candidate
        env:
          REQUIRE_JOURNEYS: ${{ inputs.require_journeys }}
        run: |
          require=()
          if [ -n "$REQUIRE_JOURNEYS" ]; then
            require=(--require "$REQUIRE_JOURNEYS" --output-json ../comparison.json)
          fi
          set +e
          uv run --no-sync dev/benchmarks/omnigent/compare.py \
            --baseline ../baseline.json \
            --candidate ../candidate.json \
            --threshold 1.0 \
            --output-markdown ../comparison.md "${require[@]}"
          RC=$?
          set -e
          # Exit 1 (regression) can also have unmeasured journeys, so read them from the report.
          complete=true
          unmeasured=""
          if [ -n "$REQUIRE_JOURNEYS" ]; then
            if [ ! -f ../comparison.json ]; then
              echo "::error::compare.py exited $RC without writing its JSON report."
              exit 1
            fi
            unmeasured="$(jq -r '.unmeasured | join(",")' ../comparison.json)"
            [ -z "$unmeasured" ] || complete=false
          fi
          # 3 = no regression, but a required journey was not measured on both sides.
          [ "$RC" -ne 3 ] || RC=0
          {
            echo "regression=$([ $RC -ne 0 ] && echo 'true' || echo 'false')"
            echo "complete=${complete}"
            echo "unmeasured=${unmeasured}"
          } >> "$GITHUB_OUTPUT"

      - name: Write step summary
        if: steps.compare.outcome == 'success'
        env:
          REGRESSION: ${{ steps.compare.outputs.regression }}
          BASELINE_REF: ${{ steps.refs.outputs.baseline }}
        run: |
          CPU_MODEL="$(lscpu | sed -n 's/^Model name: *//p' | head -1)"
          {
            if [ "$REGRESSION" != "true" ]; then
              echo "### Benchmark: PASS ✓"
            else
              echo "### Benchmark: REGRESSION DETECTED ✗"
              echo ""
              echo "> A regression exceeding the threshold was found."
              echo "> In a release run, **benchmark-approve** awaits maintainer sign-off before the cut proceeds."
            fi
            echo ""
            cat comparison.md 2>/dev/null || echo "_No comparison report generated._"
            echo ""
            echo "_Candidate vs ${BASELINE_REF} · 100 iterations × 3 runs · SQLite · threshold 100% on P50/P95 · both run concurrently on one runner (${CPU_MODEL:-unknown CPU}, $(nproc) vCPU)_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-release-${{ github.run_id }}
          path: |
            candidate.json
            baseline.json
            comparison.md
            candidate.log
            baseline.log
          retention-days: 90
          if-no-files-found: ignore
