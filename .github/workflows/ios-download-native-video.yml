name: Temporary iOS download native video

on:
  push:
    branches: [test/ios-download-native-video]

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Select iPhone Simulator
        id: simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            phone = devices.find { |d| d["name"].start_with?("iPhone") && d["isAvailable"] }
            abort "No available iPhone Simulator" unless phone
            puts phone.fetch("udid")
          ')"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Save fixed implementation
        run: |
          cp web/ios/Omnigent/OmnigentWebView.swift /tmp/OmnigentWebView.fixed.swift
          cp web/ios/Omnigent.xcodeproj/project.pbxproj /tmp/project.fixed.pbxproj

      - name: Record before fix
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          git show 3a845634d^:web/ios/Omnigent/OmnigentWebView.swift > web/ios/Omnigent/OmnigentWebView.swift
          git show 3a845634d^:web/ios/Omnigent.xcodeproj/project.pbxproj > web/ios/Omnigent.xcodeproj/project.pbxproj
          xcodebuild build-for-testing \
            -project web/ios/Omnigent.xcodeproj \
            -scheme Omnigent \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath /tmp/before-derived \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$DEVICE_ID" > /tmp/simulator-boot.log 2>&1 &
          sleep 30
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 /tmp/before.mp4 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild test-without-building \
            -project web/ios/Omnigent.xcodeproj \
            -scheme Omnigent \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath /tmp/before-derived \
            -only-testing:OmnigentUITests/OmnigentUITests/testNativeDownloadVideo \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
          TEST_STATUS=$?
          set -e
          sleep 2
          kill -INT "$VIDEO_PID"
          wait "$VIDEO_PID" || true
          test "$TEST_STATUS" -eq 0

      - name: Record after fix
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          cp /tmp/OmnigentWebView.fixed.swift web/ios/Omnigent/OmnigentWebView.swift
          cp /tmp/project.fixed.pbxproj web/ios/Omnigent.xcodeproj/project.pbxproj
          xcrun simctl uninstall "$DEVICE_ID" ai.omnigent.ios 2>/dev/null || true
          xcodebuild build-for-testing \
            -project web/ios/Omnigent.xcodeproj \
            -scheme Omnigent \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath /tmp/after-derived \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 /tmp/after.mp4 &
          VIDEO_PID=$!
          sleep 2
          set +e
          xcodebuild test-without-building \
            -project web/ios/Omnigent.xcodeproj \
            -scheme Omnigent \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath /tmp/after-derived \
            -only-testing:OmnigentUITests/OmnigentUITests/testNativeDownloadVideo \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
          TEST_STATUS=$?
          set -e
          sleep 2
          kill -INT "$VIDEO_PID"
          wait "$VIDEO_PID" || true
          test "$TEST_STATUS" -eq 0

      - name: Upload native recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-download-native-before-after
          path: |
            /tmp/before.mp4
            /tmp/after.mp4
          if-no-files-found: warn
