name: Backwards-Compat

# Cross-version backwards-compatibility sweep against main's e2e + integration
# suites, over the FULL pairwise (server, runner) version matrix.
#
# The version universe is `main` (the checked-out code = client + tests, always)
# plus every final (non-prerelease) release tag; we cross every server version with every runner
# version. Each cell pins the server and/or runner subprocess to that build
# (a "main" axis value leaves that component on the checked-out code) while the
# client and tests stay on main. The (main, main) cell is omitted — it pins
# nothing and is exactly the normal e2e gate. So the matrix subsumes the old
# single-pin jobs: (old, main) = Config 1; (main, old) = Config 2; (old, old) =
# both old; etc. Runner and host are colocated, so the runner axis pins both.
#
# The test runs are the SAME composite actions the normal gates use
# (.github/actions/e2e-run, integration-run); a cell differs only in which
# subprocess(es) are the old build.
#
# Triggers:
#   workflow_dispatch   manual; optional `versions` CSV overrides the set.
#   schedule            every 12h; full pairwise over main + all final tags.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated version set for BOTH axes (e.g. 'main,v0.2.0'). Empty = main + all final (non-prerelease) tags."
        required: false
        default: ""
  schedule:
    # Every 12 hours (00:00 and 12:00 UTC).
    - cron: "0 */12 * * *"
  # Fast smoke on PRs that touch the server↔runner contract surface.
  # Runs both Config 1 (new server, old runner) and Config 2 (new runner,
  # old server) against the latest stable release so protocol regressions
  # surface before merge, not in the overnight full matrix.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "omnigent/runner/**"
      - "omnigent/server/**"
      - "omnigent/host/**"
      - "web/src/**"
      - "tests/e2e/**"
      - "tests/e2e_ui/**"
      - "tests/_helpers/compat.py"
      - ".github/actions/compat-smoke-run/**"
      - ".github/actions/compat-smoke-ui-run/**"
      - ".github/workflows/server-compat.yml"

concurrency:
  group: backcompat-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Fast smoke: both compat configs against the latest stable release ──────
  # Runs on every PR that touches the server↔runner contract surface (paths
  # filter above), plus every schedule/dispatch run. Resolves the latest
  # final (non-prerelease) tag once, then fans out to Config 1 and Config 2.
  # The full pairwise matrix (backcompat-e2e / backcompat-integration) still
  # runs on schedule/dispatch and covers the broader version history.
  resolve-latest:
    name: Resolve latest stable tag
    # PRs: always. Schedule/dispatch: always.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      latest_tag: ${{ steps.tag.outputs.latest_tag }}
    steps:
      - name: Checkout (tags only)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          sparse-checkout: .github/scripts/ci
          persist-credentials: false
      - name: Resolve latest final tag
        id: tag
        shell: bash
        run: |
          # Latest final (non-prerelease) tag by version sort.
          tag=$(git tag --sort=-v:refname \
            | grep -viE '(^|[^a-z])(rc|dev|pre)[0-9]' \
            | head -1)
          if [ -z "$tag" ]; then
            echo "No stable release tag found" >&2; exit 1
          fi
          echo "latest_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved latest stable tag: $tag" >&2

  compat-smoke-config1:
    name: "Compat smoke – Config 1 (new server / old runner ${{ needs.resolve-latest.outputs.latest_tag }})"
    needs: resolve-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          fetch-depth: 0
      - name: Run compat smoke (Config 1)
        uses: ./.github/actions/compat-smoke-run
        with:
          runner_version: ${{ needs.resolve-latest.outputs.latest_tag }}
          artifact_suffix: "-config1"

  compat-smoke-config2:
    name: "Compat smoke – Config 2 (new runner / old server ${{ needs.resolve-latest.outputs.latest_tag }})"
    needs: resolve-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          fetch-depth: 0
      - name: Run compat smoke (Config 2)
        uses: ./.github/actions/compat-smoke-run
        with:
          server_version: ${{ needs.resolve-latest.outputs.latest_tag }}
          artifact_suffix: "-config2"

  compat-smoke-ui-config-a:
    name: "Compat smoke – UI Config A (new SPA / old server ${{ needs.resolve-latest.outputs.latest_tag }})"
    needs: resolve-latest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          fetch-depth: 0
      - name: Run UI compat smoke (Config A)
        uses: ./.github/actions/compat-smoke-ui-run
        with:
          server_version: ${{ needs.resolve-latest.outputs.latest_tag }}
          artifact_suffix: "-ui-config-a"

  compat-smoke-ui-config-b:
    name: "Compat smoke – UI Config B (old SPA ${{ needs.resolve-latest.outputs.latest_tag }} / new server)"
    needs: resolve-latest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          fetch-depth: 0
      - name: Run UI compat smoke (Config B)
        uses: ./.github/actions/compat-smoke-ui-run
        with:
          ui_version: ${{ needs.resolve-latest.outputs.latest_tag }}
          artifact_suffix: "-ui-config-b"

  # ── Full pairwise matrix (schedule + dispatch only) ────────────────────────
  # Compute the full pairwise (server, runner) and UI matrices.
  # Integration is the single openai-agents leg (claude-sdk/codex reject the
  # mock LLM's "mock-model"); e2e is sharded per cell.
  # UI matrix is server-only (runner is always main; the SPA is always HEAD).
  setup:
    name: setup
    # The full pairwise matrix is expensive — skip it on PR triggers (the
    # fast smoke jobs above cover the PR case).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e_matrix: ${{ steps.matrix.outputs.e2e_matrix }}
      integration_matrix: ${{ steps.matrix.outputs.integration_matrix }}
    steps:
      - name: Check out CI scripts + tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: .github/scripts/ci
          # Full history so `git tag` sees every release tag for the matrix.
          fetch-depth: 0
          persist-credentials: false
      - name: Compute pairwise matrices
        id: matrix
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
          NUM_SHARDS: "4"
        run: bash .github/scripts/ci/backcompat-pairwise-matrix.sh

  # tests/e2e for every (server, runner) cell × shard.
  backcompat-e2e:
    name: Backcompat e2e (server ${{ matrix.server }} / runner ${{ matrix.runner }}, shard ${{ matrix.shard_id }}/${{ matrix.num_shards }})
    needs: setup
    runs-on: ubuntu-latest
    # Job-level cap (composite run steps can't set timeout-minutes); mirrors
    # e2e.yml's ~30-min test budget + setup + up to two old-build installs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Bound concurrency: the full matrix is large (versions² × shards). Tune
      # here if the org's runner pool is over/under-subscribed.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.setup.outputs.e2e_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # fetch-depth 0 so the action can `git worktree add` the old tags.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Run e2e suite for this cell
        uses: ./.github/actions/e2e-run
        with:
          # "main" axis -> empty input (use checked-out code); else the tag.
          # GHA ternary: `!= 'main' && x || ''` (the naive `== 'main' && '' || x`
          # breaks because '' is falsy and falls through to x).
          server_version: ${{ matrix.server != 'main' && matrix.server || '' }}
          runner_version: ${{ matrix.runner != 'main' && matrix.runner || '' }}
          # Unique per cell so upload-artifact@v4 doesn't collide across the
          # matrix (every integration cell shares the harness; e2e cells share
          # a shard_id).
          artifact_suffix: "-s${{ matrix.server }}-r${{ matrix.runner }}"
          shard_id: ${{ matrix.shard_id }}
          num_shards: ${{ matrix.num_shards }}
          parallelism: "2"
          nightly_full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  # tests/integration for every (server, runner) cell (openai-agents leg).
  backcompat-integration:
    name: Backcompat integration (server ${{ matrix.server }} / runner ${{ matrix.runner }}, ${{ matrix.harness }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.setup.outputs.integration_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Run integration suite for this cell
        uses: ./.github/actions/integration-run
        with:
          server_version: ${{ matrix.server != 'main' && matrix.server || '' }}
          runner_version: ${{ matrix.runner != 'main' && matrix.runner || '' }}
          # Unique per cell so upload-artifact@v4 doesn't collide across the
          # matrix (every integration cell shares the harness; e2e cells share
          # a shard_id).
          artifact_suffix: "-s${{ matrix.server }}-r${{ matrix.runner }}"
          harness: ${{ matrix.harness }}
          model: ${{ matrix.model }}
          workers: ${{ matrix.workers }}

  # tests/e2e_ui for every old server tag × shard (server axis only).
  setup-ui:
    name: setup-ui
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui_matrix: ${{ steps.matrix.outputs.ui_matrix }}
    steps:
      - name: Check out CI scripts + tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: .github/scripts/ci
          fetch-depth: 0
          persist-credentials: false
      - name: Compute UI matrix
        id: matrix
        env:
          VERSIONS: ${{ github.event.inputs.versions }}
          NUM_SHARDS: "3"
        run: bash .github/scripts/ci/backcompat-ui-matrix.sh

  backcompat-e2e-ui:
    name: "Backcompat e2e-ui (Config ${{ matrix.config }}: ${{ matrix.config == 'A' && matrix.server || matrix.ui }}, shard ${{ matrix.shard_id }}/${{ matrix.num_shards }})"
    needs: setup-ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.setup-ui.outputs.ui_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Run e2e-ui suite for this cell
        uses: ./.github/actions/compat-smoke-ui-run
        with:
          server_version: ${{ matrix.server }}
          ui_version: ${{ matrix.ui }}
          full_suite: "true"
          shard_id: ${{ matrix.shard_id }}
          num_shards: ${{ matrix.num_shards }}
          artifact_suffix: "-config${{ matrix.config }}-${{ matrix.config == 'A' && matrix.server || matrix.ui }}-shard${{ matrix.shard_id }}"
