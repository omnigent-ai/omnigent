name: PR Hygiene

# Hourly sweep over recently-opened PRs. Two independent checks share the run:
#
#   1. Demo check -- comment on PRs that check "Bug fix" / "Feature" /
#      "UI / frontend change" but provide no demo (screenshot / video).
#      See demo-check.js.
#   2. Issue-link check -- comment on PRs that reference no issue and label them
#      `needs-issue`, then close one still unlinked 7 days later. Forward-only:
#      nothing opened before its effective date is considered, so the backlog is
#      untouched. Enforcing, capped at LIMIT comments and LIMIT closures per run.
#      See pr-issue-link.js.
#
# Both skip drafts and PRs they've already flagged, each deduping on its own label
# (`needs-demo`, `needs-issue`). The demo check never closes anything; the
# issue-link check closes only over its own label, only past the deadline the nudge
# announced, and reversibly via `/reopen`. Never checks out or runs PR code -- they
# read PR metadata via the API using only the default-branch script.
#
# Two dispatch inputs exist for one-off runs: `scan_hours` widens the issue-link
# window so PRs older than a day can be brought into the rule (hand-labeling them
# instead would skip the nudge and start a clock nobody was warned about), and
# `enforce: false` dry-runs the whole sweep into the step summary. Both are empty
# on the schedule, so cron behaviour is unchanged.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      scan_hours:
        description: >
          Issue-link check only: widen the scan window, in hours, for a one-off
          backfill over PRs older than a day. The effective date still floors it.
          Leave blank for the usual 24 hours.
        required: false
      enforce:
        description: >
          Set to "false" to dry-run the whole sweep: every verdict lands in the
          step summary and nothing is commented, labeled, or closed. Use this to
          review a backfill before it touches anyone.
        required: false
        default: "true"

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  demo-check:
    if: github.repository == 'omnigent-ai/omnigent'
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions REPLACE the workflow-level block (they don't
      # merge), so contents:read must be restated here for actions/checkout.
      contents: read
      issues: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      # Trusted default branch only (.github sparse). Pin the ref explicitly so
      # manual workflow_dispatch runs can't execute a script from another branch.
      # Never the PR head, so no PR-authored code runs.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      # demo-check.js has no dry-run mode, so a dry run skips it rather than pass a
      # flag it ignores. Nothing in the sweep writes when enforce is "false".
      - name: Demo check
        if: inputs.enforce != 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          retries: 3
          script: |
            const script = require(".github/workflows/demo-check.js");
            await script({ context, github, core });
      # LIMIT bounds how many contributors a single run may comment on or close, so
      # a mistake in the wording or the predicate cannot reach the whole queue in
      # one sweep. Setting ENFORCE back to "false" returns to a dry run, which
      # enumerates every verdict into the step summary and writes nothing.
      #
      # CLOSE_ENFORCE gates only the close half, so the nudge stays live while the
      # closes are a dry run: the step summary lists every WOULD CLOSE verdict for
      # review first. Flip it to "true" to start closing. Nothing can be closed
      # before it has carried `needs-issue` for the full window, and every PR
      # already nudged under the old wording (which promised no action would be
      # taken) is re-nudged with the deadline before its clock starts.
      - name: Issue-link check
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          # Inputs are empty on the cron schedule, so both fall back to the
          # scheduled behaviour: enforcing, over the usual 24-hour window.
          ENFORCE: ${{ inputs.enforce || 'true' }}
          SCAN_HOURS: ${{ inputs.scan_hours }}
          CLOSE_ENFORCE: "false"
          LIMIT: "25"
        with:
          retries: 3
          script: |
            const script = require(".github/workflows/pr-issue-link.js");
            await script({ context, github, core });
      # Applies `waiting-for-review` to PRs that clear the bar, giving maintainers
      # a queue of reviewable PRs instead of the whole open list. No LIMIT: a label
      # notifies nobody and is trivially reversible, unlike the nudge above.
      # ENFORCE="false" returns to a dry run that reports verdicts and writes nothing.
      - name: Ready-for-review gate
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          ENFORCE: ${{ inputs.enforce || 'true' }}
        with:
          retries: 3
          script: |
            const script = require(".github/workflows/ready-for-review.js");
            await script({ context, github, core });
