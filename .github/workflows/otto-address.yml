name: Address PR feedback

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: otto-address-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'omnigent-ai/omnigent' &&
      github.event.issue.pull_request && startsWith(github.event.comment.body, '/address')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts/otto-address.js
          sparse-checkout-cone-mode: false
      - name: Authorize command
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OTTO_ADDRESS_REVIEWERS: ${{ vars.OTTO_ADDRESS_REVIEWERS }}
        with:
          script: |
            await require('./.github/scripts/otto-address.js')({
              github, context, core, reviewers: process.env.OTTO_ADDRESS_REVIEWERS,
            });
      - name: Mint private workflow dispatch token
        if: steps.authorize.outputs.authorized == 'true'
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.OMNIGENT_BOT_APP_ID }}
          private-key: ${{ secrets.OMNIGENT_BOT_APP_KEY }}
          owner: omnigent-ai
          repositories: omnigent-internal
          permission-actions: write
      - name: Explain rejected command
        if: steps.authorize.outputs.reason != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REASON: ${{ steps.authorize.outputs.reason }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.payload.issue.number,
              body: `/address (#issuecomment-${context.payload.comment.id}): ${process.env.REASON}`,
            });
      - name: Dispatch Otto review
        if: steps.authorize.outputs.authorized == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.dispatch-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'omnigent-ai', repo: 'omnigent-internal',
              workflow_id: 'otto-address.yml', ref: 'main',
              inputs: {
                pr_number: String(context.payload.issue.number),
                comment_id: String(context.payload.comment.id),
              },
            });
      - name: Report dispatch failure to authorized requester
        if: failure() && steps.authorize.outputs.authorized == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.payload.issue.number,
              body: `/address (#issuecomment-${context.payload.comment.id}): Otto could not dispatch this request. A maintainer can inspect the [relay run](${runUrl}) and retry.`,
            });
