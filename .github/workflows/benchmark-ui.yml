name: Benchmark (UI)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "19 8 * * *"
  workflow_dispatch:
    inputs:
      compare_same_build:
        description: "Compare the same production build twice to check measurement noise"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: benchmark-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OMNIGENT_SKIP_WEB_UI: "true"
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  gate:
    uses: ./.github/workflows/security-gate.yml

  # Job-level filtering keeps this usable as a required check for all PRs.
  detect:
    name: Detect UI benchmark inputs
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          REPO: ${{ github.repository }}
        run: |
          # The files API truncates successful responses at 3,000 entries.
          if [ -z "${PR:-}" ] || [ "${PR_CHANGED_FILES:-0}" -ge 3000 ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(web/|omnigent/|dev/benchmarks/|tests/(benchmarks|browser_ui|_helpers)/|\.github/actions/setup-(pnpm|uv)/|(\.github/workflows/benchmark-ui\.yml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|pyproject\.toml|uv\.lock|\.python-version)$)'
          if grep -qE "$pattern" <<< "$files"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: UI performance regression check
    needs: [gate, detect]
    if: needs.detect.outputs.ui == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check out base of test merge
        id: baseline
        if: github.event_name == 'pull_request'
        run: |
          # First parent of the test merge is the exact base it was built on.
          git rev-parse --verify 'HEAD^2' > /dev/null
          git worktree add --detach ui-baseline 'HEAD^1'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install benchmark dependencies
        run: |
          uv sync --locked --group test
          uv run --no-sync playwright install --with-deps chromium

      - name: Build candidate UI
        run: |
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build --outDir "$RUNNER_TEMP/ui-candidate"

      - name: Build baseline UI
        if: github.event_name == 'pull_request'
        working-directory: ui-baseline
        run: |
          pnpm install --frozen-lockfile --filter web
          pnpm --filter web run build --outDir "$RUNNER_TEMP/ui-baseline"

      # One browser, one active page at a time, alternating base/candidate order.
      # Both bundles use the candidate's OSS server and the same fixture/driver.
      - name: Benchmark production UI
        id: benchmark
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMPARE_SAME_BUILD: ${{ inputs.compare_same_build }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--baseline-dist "$RUNNER_TEMP/ui-baseline"
                   --baseline-revision "$(git -C ui-baseline rev-parse HEAD)")
          elif [ "$COMPARE_SAME_BUILD" = "true" ]; then
            args+=(--baseline-dist "$RUNNER_TEMP/ui-candidate"
                   --baseline-revision "$(git rev-parse HEAD)")
          fi
          uv run --no-sync dev/benchmarks/ui/run.py \
            --web-dist "$RUNNER_TEMP/ui-candidate" \
            --revision "$(git rev-parse HEAD)" \
            --output-dir artifacts/ui-benchmark \
            "${args[@]}"

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f artifacts/ui-benchmark/summary.md ]; then
            cat artifacts/ui-benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f artifacts/ui-benchmark/error.txt ]; then
            cat artifacts/ui-benchmark/error.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UI benchmark produced no results. See the failed job steps for details." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload UI benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-ui-${{ github.run_id }}
          path: artifacts/ui-benchmark/
          retention-days: 30
          if-no-files-found: warn
