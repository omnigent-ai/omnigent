name: Waiting on Author Hygiene

# Keeps the review-state labels actionable. `waiting-on-author` means the ball is
# in the author's court; author activity clears it and hands off to
# `waiting-for-review` (re-requesting the reviewer, since GitHub drops the request
# once a review is submitted). The two labels are mutually exclusive. PRs left
# waiting on the author for 7 days are closed. The workflow runs from trusted
# default-branch code and never checks out PR-authored files.
# Review events use the read-only -> workflow_run relay in
# waiting-on-author-review.yml and waiting-on-author-review-run.yml.

on:
  pull_request_target:
    types: [synchronize, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waiting-on-author-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  hygiene:
    if: github.repository == 'omnigent-ai/omnigent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out .github
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - name: Update waiting-on-author state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/waiting_on_author.py
