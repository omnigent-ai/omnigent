name: E2E Tests

# Runs the `tests/e2e/` suite against the in-process mock LLM server.
# All tests use mock LLM by default; real-credential tests skip cleanly
# when no DATABRICKS_TOKEN is present.
#
# Triggers:
#   schedule            09:00 UTC daily (alongside nightly.yml).
#   workflow_dispatch   manual run on the selected workflow ref. Input:
#                       `parallelism` (pytest `-n` worker count).
#   pull_request        PR gate for ALL PRs -- same-repo AND fork. This suite
#                       runs entirely against the in-process mock LLM (no
#                       secrets), so fork PRs run it directly here just like
#                       ci.yml, with no fork-e2e/** mirror (#802 removed the
#                       credential setup). The eight shard checks are required by
#                       merge-ready.yml.
#
# Workers per shard: the dispatch input, else the E2E_PARALLELISM repository
# variable, else 3. Set the variable to retune runs without a code change;
# fork PRs never see repository variables and always use the default.

on:
  schedule:
    - cron: "0 9 * * *"
  pull_request:
    # labeled/unlabeled: kept for the skip-security-scan recovery path
    # (rerun-security-gate-run.yml falls back to this trigger). The concurrency
    # group key isolates label events so they never cancel a code-push run.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - '**'
      - '!web/**'
      - 'web/package.json'
      - 'web/electron/package.json'
      - '!docs/**'
      - '!designs/**'
      - '!CHANGELOG.md'
      - '!tests/browser_ui/**'
      - '!tests/e2e_ui/**'
      - '!tests/scripts/**'
      - '!tests/github/**'
      - '!.github/scripts/polly-review-*.py'
      - '!.github/workflows/polly-review*.yml'
      - '!.github/workflows/*.js'
  workflow_dispatch:
    inputs:
      parallelism:
        description: "Number of pytest workers per shard (-n flag). Empty uses the E2E_PARALLELISM repository variable, else 3."
        required: false
        default: ""

concurrency:
  # PRs key by number, dispatch by branch (so re-runs cancel); schedule keys
  # by SHA so each merge to `main` gets its own run. Label events append the
  # label name so they get an isolated slot and never cancel a code-push run.
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.ref) || github.sha }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No web SPA build during `uv sync`: this job never serves the
  # bundle and the build hits public npm with no registry mirror.
  OMNIGENT_SKIP_WEB_UI: "true"
  # Never let the test server pick up the runner's own credentials.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  CODEX: ""
  CLAUDE_CODE: ""

jobs:
  # Security gate: untrusted PRs wait on the deterministic scan
  # (security-gate.yml); trusted authors and non-PR events pass instantly.
  # Short-circuit for label events that aren't skip-security-scan (e.g.
  # automerge): those run in their own isolated concurrency slot (above) and
  # don't need the full suite — just exit fast.
  gate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'skip-security-scan'
    uses: ./.github/workflows/security-gate.yml
    permissions:
      contents: read
      pull-requests: read

  # Shard matrix (e2e-shard-matrix.sh, shared with e2e-ui.yml). Fork PRs run by
  # default; draft PRs resolve to an empty matrix.
  setup:
    name: E2E coverage scope
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      e2e: ${{ steps.scope.outputs.e2e }}
      dependency: ${{ steps.scope.outputs.dependency }}
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Triggering ref (not main): the script must exist on it, and it
          # only shards tests -- no secrets exposure, so the PR's copy is fine.
          fetch-depth: 2
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/dependency-ci-scope
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/dependency-ci-scope
      - name: Compute shard matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          RUN_TESTS: ${{ steps.scope.outputs.e2e }}
          NUM_SHARDS: "8"
        run: bash .github/scripts/ci/e2e-shard-matrix.sh

  e2e:
    # Sharded matrix: each shard runs ~1/N of the set, under the wallclock
    # budget where CrowdStrike kills long jobs (#426). max-parallel:8 runs
    # all shards concurrently so one wedged shard can't block the others.
    # Three pytest workers per shard allow up to 24 concurrent test workers.
    name: E2E Tests (shard ${{ matrix.shard_id }}/${{ matrix.num_shards }})
    # Skip before matrix expansion: GitHub rejects an empty include list.
    needs: setup
    if: needs.setup.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-24.04
    # Job-level cap (composite-action run steps can't set timeout-minutes):
    # ~30 min of tests + setup, replacing the old per-step 30-min backstop.
    timeout-minutes: 35
    strategy:
      # One red shard shouldn't cancel siblings -- we want every shard's signal.
      fail-fast: false
      max-parallel: 8
      # Shards from `setup` (deterministic node-ID split); [] when skipped.
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        # The default is the PR merge commit for pull_request and the workflow
        # ref for schedule/dispatch, keeping checked-out code in its cache scope.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Steps below are shared verbatim with server-compat.yml's backcompat-e2e
      # job via the composite action, so the two never drift. server_version
      # is omitted here -> normal gate (tests the checked-out server, mock LLM).
      - name: Run e2e suite
        uses: ./.github/actions/e2e-run
        with:
          shard_id: ${{ matrix.shard_id }}
          num_shards: ${{ matrix.num_shards }}
          parallelism: ${{ github.event.inputs.parallelism || vars.E2E_PARALLELISM || '3' }}
          nightly_full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  harness-e2e:
    # Journeys for native harnesses whose CLI the sharded lane does not install.
    # Each matrix entry installs one pinned CLI and runs its e2e files against
    # the in-process mock model; they skip in the shards above, which lack it.
    name: E2E Harness (${{ matrix.harness }})
    needs: setup
    if: needs.setup.outputs.e2e == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: opencode
            tests: >-
              tests/e2e/test_host_opencode_native_mock_e2e.py
              tests/e2e/test_opencode_native_wire_contract_e2e.py
              tests/e2e/test_opencode_native_startup_cancel_leak_e2e.py
              tests/e2e/test_chat_import_e2e.py::test_cli_imports_opencode_store_end_to_end

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      # Same key and extras as e2e-run, so the shards' venv cache is reused.
      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}

      - name: Install project and test dependencies
        run: uv sync --locked --extra all --extra openshell --extra kubernetes --group test

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install OpenCode CLI
        if: matrix.harness == 'opencode'
        uses: ./.github/actions/setup-opencode-e2e

      - name: Run harness e2e tests
        env:
          TESTS: ${{ matrix.tests }}
          E2E_TMP_BASE: /tmp/omnigent-e2e-${{ github.run_id }}-${{ matrix.harness }}
          # Fail rather than skip when the installed CLI is missing or unsupported.
          OMNIGENT_E2E_OPENCODE_REQUIRED: "1"
          # Enables the credential-free wire-contract test.
          OMNIGENT_E2E_OPENCODE_NATIVE: "1"
        run: |
          mkdir -p "$E2E_TMP_BASE"
          read -r -a test_args <<<"$TESTS"
          uv run pytest "${test_args[@]}" \
            --timeout=300 \
            --timeout-method=thread \
            --basetemp="$E2E_TMP_BASE" \
            --junitxml="$E2E_TMP_BASE/junit.xml" \
            -v --tb=long --log-level=INFO -r a

      - name: Upload logs on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-harness-logs-${{ github.run_id }}-${{ matrix.harness }}
          path: |
            /tmp/omnigent-e2e-${{ github.run_id }}-${{ matrix.harness }}/**/*.log
            /tmp/omnigent-e2e-${{ github.run_id }}-${{ matrix.harness }}/junit.xml
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
