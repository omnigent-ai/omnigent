name: Setup harness CLI action tests

on:
  pull_request:
    paths:
      - ".github/actions/setup-harness-cli/**"
      - ".github/ci-deps/package.json"
      - ".github/workflows/setup-harness-cli-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Manifest and retry policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node --test .github/actions/setup-harness-cli/setup-harness-cli.test.mjs

  install:
    name: Install ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, pi, agy]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install without cache
        uses: ./.github/actions/setup-harness-cli
        with:
          harness: ${{ matrix.harness }}
          enable-cache: false
      - name: Seed isolated test cache
        id: seed
        uses: ./.github/actions/setup-harness-cli
        with:
          harness: ${{ matrix.harness }}
          cache-namespace: test-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove local downloads before restore
        shell: bash
        env:
          CACHE_PATH: ${{ steps.seed.outputs.cache-path }}
        run: |
          case "$CACHE_PATH" in
            "$RUNNER_TEMP"/omnigent-harness-cache/*) rm -rf -- "$CACHE_PATH" ;;
            *) echo "Refusing to remove unexpected cache path: $CACHE_PATH" >&2; exit 1 ;;
          esac
      - name: Restore isolated test cache
        id: restore
        uses: ./.github/actions/setup-harness-cli
        with:
          harness: ${{ matrix.harness }}
          cache-namespace: test-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify CLI remains available to caller steps
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          HARNESS: ${{ matrix.harness }}
        run: |
          test "$CACHE_HIT" = true
          case "$HARNESS" in
            claude) claude --version ;;
            codex) codex --version ;;
            pi) pi --version ;;
            agy) agy --version ;;
          esac
