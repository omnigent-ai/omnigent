name: Setup harness CLI action tests

on:
  pull_request:
    paths:
      - ".github/actions/setup-harness-cli/**"
      - ".github/ci-deps/package.json"
      - ".github/workflows/setup-harness-cli-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Manifest and retry policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node --test .github/actions/setup-harness-cli/setup-harness-cli.test.mjs
      - name: Verify pinned callers match the tested action
        shell: bash
        run: |
          set -euo pipefail
          pins="$(git grep -h -o -E \
            'omnigent-ai/omnigent/\.github/actions/setup-harness-cli@[0-9a-f]{40}' \
            -- .github/actions .github/workflows \
            | cut -d@ -f2 | sort -u)"
          test "$(printf '%s\n' "$pins" | grep -c .)" -eq 1
          git fetch --no-tags --depth=1 origin "$pins"
          git diff --exit-code "$pins" HEAD -- .github/actions/setup-harness-cli

  install:
    name: Install ${{ matrix.harness }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, pi, agy]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install without cache
        uses: ./.github/actions/setup-harness-cli
        with:
          harness: ${{ matrix.harness }}
          enable-cache: false
      - name: Seed harness download cache
        id: seed
        uses: ./.github/actions/setup-harness-cli
        with:
          harness: ${{ matrix.harness }}
      - name: Remove local downloads before restore
        shell: bash
        env:
          CACHE_PATH: ${{ steps.seed.outputs.cache-path }}
        run: |
          case "$CACHE_PATH" in
            "$RUNNER_TEMP"/omnigent-harness-cache/*) rm -rf -- "$CACHE_PATH" ;;
            *) echo "Refusing to remove unexpected cache path: $CACHE_PATH" >&2; exit 1 ;;
          esac
      - name: Restore harness download cache
        id: restore
        uses: ./.github/actions/setup-harness-cli
        with:
          harness: ${{ matrix.harness }}
      - name: Verify CLI remains available to caller steps
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          HARNESS: ${{ matrix.harness }}
        run: |
          test "$CACHE_HIT" = true
          case "$HARNESS" in
            claude) claude --version ;;
            codex) codex --version ;;
            pi) pi --version ;;
            agy) agy --version ;;
          esac
