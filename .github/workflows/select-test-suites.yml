name: Select test suites

on:
  workflow_call:
    outputs:
      product:
        description: Whether product suites are needed (false only for known automation changes)
        value: ${{ jobs.select.outputs.product }}

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.select.outputs.product }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts/ci
          persist-credentials: false
      - name: Select suites from the PR diff
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci/select-test-suites.py
