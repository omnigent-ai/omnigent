name: "setup-pnpm"
description: "Set up Node + pnpm for the web workspace"

inputs:
  node-version:
    description: "Node version to use."
    default: "22"
    required: false
  cache:
    description: >-
      Pass "pnpm" to cache the pnpm store; leave empty for jobs that never run
      pnpm install (setup-node's post-step errors when the store path is absent
      on a cache miss).
    default: "pnpm"
    required: false

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        standalone: true

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: pnpm-lock.yaml
