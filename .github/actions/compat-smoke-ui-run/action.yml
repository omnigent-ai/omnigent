name: "Run UI compat smoke test"
description: >
  Run tests/e2e_ui/test_server_compat_smoke.py with the server subprocess
  pinned to an older released build (server_version) while the SPA and
  runner stay on the checked-out code.

  This guards the one meaningful cross-version ordering for the UI: the
  SPA (HEAD) running against an older server. The inverse direction (old
  SPA, new server) is not a separate compat concern because the SPA is
  always served by the server binary itself in production.

  The action mirrors the setup from e2e-ui.yml's e2e-ui job (Python, uv,
  pnpm, Playwright, bubblewrap, tmux, SPA build) but skips the Codex
  parity sidecar (Rust), which is not needed for the openai-agents smoke.

inputs:
  server_version:
    description: >
      Release tag for the OLD server build (e.g. v0.9.0). The server
      subprocess is pinned to this build via OMNIGENT_COMPAT_SERVER_PYTHON.
      Required.
    required: true
  artifact_suffix:
    description: >
      Appended to uploaded-artifact names (e.g. "-ui-config"). Default empty.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure environment
      shell: bash
      run: |
        {
          echo "OMNIGENT_SKIP_WEB_UI=true"
          echo "ANTHROPIC_API_KEY="
          echo "OPENAI_API_KEY="
          echo "CODEX="
          echo "CLAUDE_CODE="
        } >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version-file: ".python-version"

    - name: Set up pnpm + Node
      uses: ./.github/actions/setup-pnpm

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
      with:
        enable-cache: true

    - name: Cache virtualenv
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}

    - name: Install project and dev dependencies
      shell: bash
      run: uv sync --locked --extra all --extra dev

    - name: Install bubblewrap and tmux
      shell: bash
      run: |
        sudo apt-get install -y bubblewrap tmux
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Cache Playwright browsers
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Chromium
      shell: bash
      run: uv run playwright install --with-deps chromium

    - name: Build web SPA
      shell: bash
      env:
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      run: |
        pnpm install --frozen-lockfile --filter web
        pnpm --filter web run build

    - name: "Build pinned old server"
      shell: bash
      env:
        SERVER_VERSION_INPUT: ${{ inputs.server_version }}
      run: |
        tag="$SERVER_VERSION_INPUT"
        if ! [[ "$tag" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?([a-z0-9.]*)?$ ]]; then
          echo "Invalid server_version: '$tag'" >&2; exit 1
        fi
        src="$RUNNER_TEMP/ui-server-src"
        venv="$RUNNER_TEMP/ui-server-env"
        git worktree add --detach "$src" "$tag"
        uv venv --python 3.12 "$venv"
        uv pip install --python "$venv/bin/python" \
          -e "$src" -e "$src/sdks/python-client" -e "$src/sdks/ui"
        "$venv/bin/omnigent" --version
        echo "OMNIGENT_COMPAT_SERVER_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
        echo "OMNIGENT_COMPAT_SERVER_VERSION=${tag#v}" >> "$GITHUB_ENV"

    - name: Run UI compat smoke test
      shell: bash
      env:
        E2E_TMP_BASE: /tmp/omnigent-compat-ui-${{ github.run_id }}
      run: |
        mkdir -p "$E2E_TMP_BASE"
        uv run pytest tests/e2e_ui/test_server_compat_smoke.py \
          --ui-skip-build \
          -v --tb=long --showlocals --log-level=INFO \
          --timeout=120 \
          --timeout-method=thread \
          --basetemp="$E2E_TMP_BASE" \
          --junitxml="$E2E_TMP_BASE/junit.xml"

    - name: Upload logs on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: compat-ui-smoke-logs-${{ github.run_id }}${{ inputs.artifact_suffix }}
        path: |
          /tmp/omnigent-compat-ui-${{ github.run_id }}/**/server.log
          /tmp/omnigent-compat-ui-${{ github.run_id }}/**/runner.log
          /tmp/omnigent-compat-ui-${{ github.run_id }}/**/.omnigent/logs/**/*.log
          /tmp/omnigent-compat-ui-${{ github.run_id }}/junit.xml
        retention-days: 7
        if-no-files-found: warn
        include-hidden-files: true
