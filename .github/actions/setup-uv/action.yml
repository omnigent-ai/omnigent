name: "Set up cached uv"
description: "Restore or populate a cache of the pinned uv binary"

inputs:
  enable-cache:
    description: "Cache uv's downloaded packages between jobs."
    default: "true"
    required: false
  version:
    description: "Exact uv version to install and use in the binary cache key."
    default: "0.12.15"
    required: false

runs:
  using: composite
  steps:
    # setup-uv stores installed binaries in RUNNER_TOOL_CACHE, but hosted
    # runners do not share that directory. Persist it across jobs so most jobs
    # avoid both the manifest request and binary download.
    - name: Restore uv binary
      id: restore-uv
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.tool_cache }}/uv
        key: uv-tool-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install uv (attempt 1/3)
      id: install-uv-1
      continue-on-error: true
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: ${{ inputs.version }}
        enable-cache: ${{ inputs.enable-cache }}

    - name: Back off after first uv install failure
      if: steps.install-uv-1.outcome == 'failure'
      shell: bash
      run: sleep 2

    - name: Install uv (attempt 2/3)
      id: install-uv-2
      if: steps.install-uv-1.outcome == 'failure'
      continue-on-error: true
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: ${{ inputs.version }}
        enable-cache: ${{ inputs.enable-cache }}

    - name: Back off after second uv install failure
      if: steps.install-uv-2.outcome == 'failure'
      shell: bash
      run: sleep 5

    - name: Install uv (attempt 3/3)
      if: steps.install-uv-2.outcome == 'failure'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: ${{ inputs.version }}
        enable-cache: ${{ inputs.enable-cache }}

    - name: Verify uv
      shell: bash
      env:
        EXPECTED_UV_VERSION: ${{ inputs.version }}
      run: |
        actual_version=$(uv --version)
        installed_version=${actual_version#uv }
        installed_version=${installed_version%% *}
        test "$installed_version" = "$EXPECTED_UV_VERSION"
        echo "$actual_version"

    # Save before the caller runs workload code, so later steps cannot alter
    # the files that populate this shared cache.
    - name: Save uv binary
      if: steps.restore-uv.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.tool_cache }}/uv
        key: uv-tool-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
