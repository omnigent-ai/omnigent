name: Set up Antigravity CLI
description: Install checksum-pinned, download-cached agy 1.2.4 on Linux x64

runs:
  using: composite
  steps:
    - name: Disable Antigravity auto-updates
      shell: bash
      run: echo "AGY_CLI_DISABLE_AUTO_UPDATE=true" >> "$GITHUB_ENV"
    - uses: omnigent-ai/omnigent/.github/actions/setup-harness-cli@dc71b943a0ef69ab6231675587cd6c886065dfb3
      with:
        harness: agy
