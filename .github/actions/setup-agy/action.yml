name: Set up Antigravity CLI
description: Install checksum-pinned, download-cached agy 1.5.2 on Linux x64

runs:
  using: composite
  steps:
    - name: Disable Antigravity auto-updates
      shell: bash
      run: echo "AGY_CLI_DISABLE_AUTO_UPDATE=true" >> "$GITHUB_ENV"
    - uses: omnigent-ai/omnigent/.github/actions/setup-harness-cli@75d817057138bd2cf5cd5af1cd954fdaca12e03d
      with:
        harness: agy
