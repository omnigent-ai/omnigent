name: Set up Antigravity CLI
description: Install checksum-pinned agy 1.2.4 on Linux x64

runs:
  using: composite
  steps:
    - name: Install agy 1.2.4
      shell: bash
      env:
        AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.2.4-6085322963025920/linux-x64/cli_linux_x64.tar.gz
        AGY_SHA512: 5811d39ec1bf96a82ed06de6b8ee2bb7f5be8d74423b8c52b6b975e8f0e2c84c6cc2fa0baf902aad942c7566509c3ba6ddb5ef076260c6a635c4616e6ae17897
      run: |
        set -euo pipefail
        AGY_INSTALL_DIR="${RUNNER_TEMP}/omnigent-agy-cli"
        mkdir -p "$AGY_INSTALL_DIR/bin"
        curl --fail --location --retry 3 "$AGY_URL" --output "$AGY_INSTALL_DIR/agy.tar.gz"
        echo "$AGY_SHA512  $AGY_INSTALL_DIR/agy.tar.gz" | sha512sum --check --status
        tar -xzf "$AGY_INSTALL_DIR/agy.tar.gz" -C "$AGY_INSTALL_DIR" antigravity
        install -m 755 "$AGY_INSTALL_DIR/antigravity" "$AGY_INSTALL_DIR/bin/agy"
        "$AGY_INSTALL_DIR/bin/agy" --version
        echo "$AGY_INSTALL_DIR/bin" >> "$GITHUB_PATH"
