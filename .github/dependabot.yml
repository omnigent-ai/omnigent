# Dependabot opens individual version and security update PRs by default.
# Keep only cross-pinned MLflow packages together so they can resolve in lockstep.
# Weekly version updates retain the seven-day cooldown and existing PR limits.
#
# Layout invariants (tests/scripts/test_dependabot_config.py checks them):
#   - Declare each lockfile once, at its workspace root, so manifests and locks
#     update together: the pnpm workspace is one root pnpm-lock.yaml, the uv
#     workspace one root uv.lock.
#   - uv.lock is handled by the `uv` ecosystem, not `pip`, security PRs included.
#   - Composite actions under .github/actions/* carry their own `uses:` pins,
#     so github-actions lists that directory as well as the root.
#   - Review routing comes from .github/CODEOWNERS (the `reviewers` key is
#     deprecated); labels named here must already exist in the repo.
version: 2

updates:
  # ── Python: server + runner + tooling (uv workspace root; one uv.lock) ───
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    groups:
      mlflow:
        applies-to: version-updates
        patterns: ["mlflow", "mlflow-skinny", "mlflow-tracing"]
      mlflow-security:
        applies-to: security-updates
        patterns: ["mlflow", "mlflow-skinny", "mlflow-tracing"]

  # ── JavaScript: the pnpm workspace (web, electron, vscode, cloudflare,
  #    web-extension SDK, CI deps, example extension) ────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Framework majors (react, react-router, vite, electron, ...) are
      # migrations the team schedules; a bot PR for them is only churn.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # web's pdfjs-dist must equal react-pdf's own pdfjs-dist: PdfViewer loads
      # the worker from it, and pdf.js rejects a mismatched worker. Bump it only
      # together with react-pdf.
      - dependency-name: "pdfjs-dist"

  # ── Pinned harness CLIs installed by CI: intentional exact pins, never bump.
  #    Declared so the security toggle does not file ungrouped PRs for them.
  - package-ecosystem: npm
    directories:
      - "/.github/actions/setup-harness-cli/locks/*"
      - "/.github/actions/e2e-run/claude-billing-notice"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  # ── GitHub Actions: workflow `uses:` pins AND the composite actions' own pins
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "chore(deps)"

  # ── Rust: the omnidev tool and the codex-parity test sidecar ─────────────
  - package-ecosystem: cargo
    directories:
      - "/dev/omnidev"
      - "/tests/codex_parity/sidecar"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"

  # ── Android app (Gradle, version catalog) ────────────────────────────────
  - package-ecosystem: gradle
    directory: "/web/android"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # ── iOS app tooling (Bundler) ────────────────────────────────────────────
  - package-ecosystem: bundler
    directory: "/web/ios"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # ── Container base images (deploy/*/Dockerfile*) ─────────────────────────
  - package-ecosystem: docker
    directories:
      - "/deploy/docker"
      - "/deploy/cloudflare"
      - "/deploy/hf-spaces"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # ── pre-commit hook revisions ────────────────────────────────────────────
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
