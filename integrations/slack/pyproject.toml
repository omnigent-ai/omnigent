[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigent-slack"
version = "0.13.0.dev0"
description = "Slack Socket Mode bot that drives Omnigent sessions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The Omnigent client both bots share (SSE parsing, the turn loop,
    # the login flows). Version-locked with the release cycle.
    "omnigent-bot-core==0.12.0.dev0",
    "aiosqlite>=0.21.0",
    "aiohttp>=3.12.0",
    "cryptography>=42.0.0",
    "pydantic-settings>=2.10.0",
    "slack-bolt>=1.29.0",
    "slack-sdk>=3.43.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent_slack"]

# Resolve the shared client from the tree rather than an index, so an editable
# checkout builds without publishing it first. Mirrors how the root package
# resolves this one.
[tool.uv.sources]
omnigent-bot-core = { path = "../bot-core", editable = true }
