[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigent-company-brain"
version = "0.13.0.dev0"
description = "Company-owned Git knowledge ingestion for Omnigent agents."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50,<51",
    "filelock>=3,<4",
    "httpx>=0.27,<1",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.7,<0.2",
    "pydantic>=2.0,<3",
    "PyJWT[crypto]>=2.8,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent_company_brain"]
