org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The unit-test task uses a Java 21 toolchain (see app/build.gradle.kts). The CI
# build runs under JDK 17, so let Gradle discover the runner's JDK 21 from the
# JAVA_HOME_21_<arch> variables that GitHub-hosted runners set for each
# pre-installed JDK. Locally the running JVM (JDK 21, see README) already
# satisfies the toolchain; these variables are ignored when unset.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_21_ARM64
