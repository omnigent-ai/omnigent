<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Use your security key</title>
    <style>
      /* Same design tokens as return-banner/index.html. */
      :root {
        color-scheme: light dark;
        --background: #fff;
        --foreground: #11171c;
        --muted-foreground: #6f6f6f;
        --border: #e8ecf0;
        --accent: #2557d6;
        --radius-lg: 0.5rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1e1927;
          --foreground: oklch(0.965 0.003 240);
          --muted-foreground: #92a4b3;
          --border: oklch(0.28 0.005 240);
          --accent: #7aa2ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        /* 8px gutter for the card's radius and shadow; src/security_key_prompt.js
           sets the window size. */
        padding: 8px;
        background: transparent;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
      }
      #card {
        /* Fills the window, so no transparent area catches clicks meant for the page. */
        height: 100%;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 12px 14px 16px;
        background: color-mix(in srgb, var(--accent) 6%, var(--background));
        color: var(--foreground);
        border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      #icon {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        color: var(--accent);
      }
      #text {
        flex: 1;
        min-width: 0;
        line-height: 1.35;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 0;
      }
      #note {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      #dismiss {
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        cursor: pointer;
        padding: 3px 8px;
        border-radius: 6px;
      }
      #dismiss:hover {
        background: color-mix(in srgb, var(--foreground) 8%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="card" role="status">
      <svg
        id="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="7.5" cy="15.5" r="4.5" />
        <path d="M10.7 12.3 20 3M16 7l3 3M14 9l2 2" />
      </svg>
      <div id="text">
        <h1>Use your security key</h1>
        <p>Insert your security key and touch it to continue.</p>
        <p id="note">
          Touch ID and saved passkeys aren't supported in Omnigent. No security key? Choose another
          verification method.
        </p>
      </div>
      <button id="dismiss" title="Dismiss" aria-label="Dismiss">&#10005;</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
