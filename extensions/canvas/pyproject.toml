[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-canvas"
version = "0.1.0"
description = "Freeform canvas extension for Omnigent sessions"
requires-python = ">=3.12"
dependencies = ["omnigent>=0.13.0.dev0,<1"]

[project.entry-points."omnigent.extensions"]
canvas = "omnigent_canvas.plugin:get_manifest"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnigent_canvas = ["dist/extension.js", "dist/extension.css"]
