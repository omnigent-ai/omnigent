# Real questions about Omnigent, with answer keys derived from the code.
#
# Positives were mined from GitHub issues and discussions and from one user's
# Omnigent session history (paraphrased and scrubbed), embedded, clustered
# with k-means, and drawn at random within clusters. A drawn question was
# replaced by the next draw from its cluster only when it had no answer the
# code or docs establish (bug-only, private, outside, duplicate); see
# README.md. Near misses are real questions about other tools.
#
# The test split is frozen by questions.lock and scored once per arm.

cases:
- id: delete-worktree-session-runner-offline
  split: test
  origin: github issue#6110
  cluster: workspaces-and-worktrees
  should_trigger: true
  prompt: How do I delete a worktree-backed session in the Omnigent web UI when its runner is offline
    and the delete keeps failing with a 404?
  criteria:
  - id: c1
    text: Tells the user to delete the session without worktree cleanup by leaving "Delete local branch"
      unticked in the delete dialog (API `delete_branch=false`), which succeeds while the runner is offline.
    source: omnigent/server/routes/_sessions/helpers.py:9673 (offline message says to delete the session
      only with delete_branch=false or wait for the runner to reconnect); web/src/shell/Sidebar.tsx:5406
  - id: c2
    text: Explains that removing the worktree and branch needs the session's host to be reachable, so
      a delete that includes branch cleanup is refused while the runner is offline (the alternative is
      to wait for the runner to reconnect and retry).
    source: omnigent/server/routes/sessions/routes_events.py:3185-3203; CHANGELOG.md:1255 (#6190)
  - id: c3
    text: Says the leftover worktree and branch can be removed by hand on the host with `git worktree
      remove` and `git branch -D`.
    check:
      any_of:
      - git worktree (remove|prune)
    source: omnigent/host/git_worktree.py:615-621 (Omnigent's own cleanup runs git worktree remove --force,
      then git branch -D)
- id: default-session-start-folder
  split: test
  origin: github issue#9478
  cluster: workspaces-and-worktrees
  should_trigger: true
  prompt: Is there a host or server setting that makes every new Omnigent session start in a fixed folder
    such as `/workspaces`, without each user creating a project or typing the path?
  criteria:
  - id: c1
    text: States that no host or server setting sets a default starting folder for new sessions; this
      is not supported.
    source: omnigent/server/routes/_session_create_validation.py:326 (workspace required when host_id
      is set); web/src/shell/NewChatDialog.tsx:2914
  - id: c2
    text: Says the new-session dialog pre-fills the most recently used folder on the chosen host, or the
      host's home directory when there is none.
    source: web/src/shell/NewChatDialog.tsx:2964-2985 (seed logic) and :2914 (recent[0] ?? derivedHome)
  - id: c3
    text: Names a project's default working directory (set in the project's settings) as the closest option,
      and notes that projects are private to their owner, so each user has to set one up.
    source: web/src/lib/projectsApi.ts:21-27 (ProjectConfig.workspace); omnigent/server/routes/projects.py:3-12
      (projects are owner-private)
- id: upload-file-into-workspace
  split: dev
  origin: github issue#9859
  cluster: workspaces-and-worktrees
  should_trigger: true
  prompt: How do I upload a file from my machine, such as an image, archive, or dataset, into the workspace
    of an Omnigent session that runs on a remote host or a managed sandbox?
  criteria:
  - id: c1
    text: States that Omnigent has no feature for uploading a file from the user's machine straight into
      a session's workspace; this is not supported.
    source: CHANGELOG.md:745 (#6339, attachments add nothing to the working checkout); omnigent/server/routes/sessions/routes_resources.py:2779-2800
      (workspace file writes take a JSON text body)
  - id: c2
    text: Explains that attaching the file to a chat message does not put it in the workspace; native
      coding agents such as Claude Code and Codex get a local copy outside the working directory, under
      `~/.omnigent/attachments/` on the machine that runs the agent.
    source: omnigent/inner/native_attachments.py:151-165 (attachment_cache_dir, materialize_attachment)
- id: local-sandboxed-omnigent
  split: test
  origin: session history
  cluster: servers-and-hosts
  should_trigger: true
  prompt: Can I run a sandboxed Omnigent on my own machine, for example in a Podman pod, when I run the
    server locally instead of using a hosted version, and would that help?
  criteria:
  - id: c1
    text: Says agents can be sandboxed on the user's own machine with a local server and no container,
      using Omnigent's OS-level sandbox (OmniBox, set with `os_env.sandbox` in the agent config), which
      uses bubblewrap on Linux and Seatbelt on macOS to limit file and network access.
    check:
      any_of:
      - omnibox
      - os_env
      - bwrap
      - bubblewrap
      - seatbelt
    source: docs/AGENT_YAML_SPEC.md:317 (Local OS access) and :462-476 (platform default sandbox); omnigent.ai/docs/omnibox
  - id: c2
    text: Names a documented way to run whole hosts isolated on the same machine as a local server, such
      as the microsandbox or BoxLite (local mode) micro-VM providers, or OpenShell with a local Docker
      or Podman compute driver, configured in the server's `sandbox:` section.
    check:
      any_of:
      - microsandbox
      - boxlite
      - openshell
    source: deploy/microsandbox/README.md:6-7; deploy/boxlite/README.md:17; omnigent/onboarding/sandboxes/openshell.py:11-14
  - id: c3
    text: Explains that the cloud sandbox host changes where the runner runs (remote compute that keeps
      working after the laptop closes), while isolation comes from the sandbox, so running the server
      locally does not give up sandboxing.
    source: omnigent.ai/docs/omnibox (Related section, the Cloud Sandbox Host controls where the runner
      executes); deploy/README.md:270-272
- id: egress-proxy-corporate-upstream
  split: test
  origin: github issue#8913
  cluster: servers-and-hosts
  should_trigger: true
  prompt: Does the Omnigent sandbox egress proxy honor `HTTP_PROXY`/`HTTPS_PROXY`, so that a sandboxed
    agent with `os_env.sandbox.egress_rules` can reach allowed hosts on a network where all traffic must
    go through a corporate proxy?
  criteria:
  - id: c1
    text: 'States that sending the egress proxy''s traffic through an upstream corporate proxy is not
      supported: the proxy connects to allowed destinations directly, ignores `HTTP_PROXY`/`HTTPS_PROXY`
      for its own connections, and has no upstream-proxy setting.'
    source: omnigent/inner/egress/proxy.py:217-226 (constructor options) and :834-841 (asyncio.open_connection
      straight to the destination)
  - id: c2
    text: Explains that with `egress_rules` set, the sandbox's `HTTP_PROXY`/`HTTPS_PROXY` point at Omnigent's
      local egress proxy, so the sandboxed agent cannot route through the corporate proxy either.
    source: omnigent/inner/egress/controller.py:259-266 (apply_egress_env); omnigent/inner/os_env.py:813-822
- id: host-tunnel-handshake-timeout-macos
  split: dev
  origin: github issue#1514
  cluster: servers-and-hosts
  should_trigger: true
  prompt: 'Why does `omnigent host` on macOS never connect, looping on `Host tunnel disconnected: timed
    out during opening handshake`, so that no host ever comes online?'
  criteria:
  - id: c1
    text: Attributes the loop to websockets 15 or later in the Python environment Omnigent runs from;
      that client hangs on macOS before it sends the opening handshake, which is why Omnigent pins `websockets<15`.
    check:
      any_of:
      - websockets[^\n]{0,80}15
      - 15[^\n]{0,40}websockets
    source: pyproject.toml:44-46
  - id: c2
    text: Tells the user to check the installed websockets version and bring it below 15, for example
      by reinstalling or upgrading Omnigent so its `websockets>=10.4,<15` requirement applies, or by installing
      `websockets<15` into that environment.
    source: pyproject.toml:46
- id: upgrade-restart-host-service
  split: test
  origin: github issue#8868
  cluster: servers-and-hosts
  should_trigger: true
  prompt: When I run `omnigent upgrade`, does the host service I installed with `omnigent host enable`
    start running the new version too?
  criteria:
  - id: c1
    text: States that `omnigent upgrade` does not restart the host service onto the new version; it only
      drains and stops the local background server and the local host daemon, so the service keeps running
      the old code until it is restarted.
    source: omnigent/cli.py:5768-5770 (upgrade docstring), :5438-5452 (_drain_and_stop_local_server),
      :4788-4813 (_stop_local_server_and_daemon)
  - id: c2
    text: Tells the user to restart the service after upgrading, for example `omnigent host disable` then
      `omnigent host enable`, or a direct restart with `launchctl kickstart -k gui/$(id -u)/ai.omnigent.host`
      on macOS or `systemctl --user restart omnigent-host.service` on Linux.
    source: omnigent/host/service.py:20-21 (service labels) and :218-246 (enable re-bootstraps the launchd
      job or starts the systemd unit); omnigent/cli.py:10313-10380 (host enable and host disable)
- id: remove-offline-external-host
  split: test
  origin: github issue#2038
  cluster: servers-and-hosts
  should_trigger: true
  prompt: How do I remove a decommissioned external host from my self-hosted Omnigent server so it no
    longer shows up as offline in the session host picker?
  criteria:
  - id: c1
    text: 'States that deleting or deregistering a host is not supported: there is no web UI action, API
      route, or CLI command for it, and the host list shows every registered host, online or offline.'
    source: omnigent/server/routes/hosts.py:673-731 (host routes are GET and POST only; list_hosts returns
      online and offline hosts); web/src/shell/NewChatDialog.tsx:2678-2680
  - id: c2
    text: Says the remaining workaround is to delete that host's row from the server database's `hosts`
      table by hand, because the host list is read from that table.
    source: omnigent/db/db_models.py:1328 (hosts table); omnigent/server/routes/hosts.py:700-705
- id: cli-401-after-token-expiry
  split: dev
  origin: github issue#9549
  cluster: servers-and-hosts
  should_trigger: true
  prompt: Why do `omnigent host status`, `omnigent host stop` and other CLI commands fail with `401 Authentication
    required` about an hour after I run `omnigent login`?
  criteria:
  - id: c1
    text: Explains that the stored login token has expired and these CLI commands do not renew it from
      the stored refresh grant (only the host/runner process refreshes it), so their requests carry no
      valid credentials.
    source: omnigent/chat.py:688-736 (_remote_headers uses load_token, which drops an expired token);
      omnigent/runner/_entry.py:733 (the only refresh_stored_token caller)
  - id: c2
    text: Gives the workaround of running `omnigent login` again to get a fresh token.
    check:
      cli:
      - login
    source: omnigent/cli_auth.py:373-378 (expiry warning tells the user to run omnigent login)
- id: pause-is-interrupt
  split: test
  origin: github issue#8374
  cluster: sessions-and-desktop-app
  should_trigger: true
  prompt: What does Pause actually do to a running Omnigent session, and can I resume the interrupted
    work afterwards on the Codex, Claude SDK, Pi, and Antigravity harnesses?
  criteria:
  - id: c1
    text: States that Omnigent has no pause that freezes work; the action is an interrupt that cancels
      the turn in progress, and running tool calls are recorded as cancelled.
    source: omnigent/server/routes/sessions/routes_events.py:892-893; omnigent/runner/session_history.py:368
  - id: c2
    text: Says the interrupted request is not resumed automatically; Omnigent marks it as abandoned, so
      the agent continues that work only if the user asks for it again in a new message.
    source: omnigent/runner/session_history.py:369-375 (interrupted-marker text)
  - id: c3
    text: Says that on the Codex, Claude SDK, Pi, and Antigravity harnesses the harness session is closed
      or rebuilt after the interrupt, and the next message starts a fresh harness session that replays
      the full conversation history, so earlier context is kept.
    source: omnigent/inner/codex_executor.py:4803-4829; omnigent/inner/claude_sdk_executor.py:2046-2066;
      omnigent/inner/pi_executor.py:2081-2096; omnigent/inner/antigravity_executor.py:422-445
- id: desktop-app-intel-mac
  split: test
  origin: github issue#842
  cluster: sessions-and-desktop-app
  should_trigger: true
  prompt: Is there an Omnigent desktop app build for Intel Macs, or does the macOS desktop app only run
    on Apple Silicon?
  criteria:
  - id: c1
    text: States that the macOS desktop app is built for Intel (x64) as well as Apple Silicon (arm64).
    source: web/electron/package.json:91-120 (mac dmg and zip targets for x64 and arm64); CHANGELOG.md:1835
      (#4772)
  - id: c2
    text: Points to the separate Intel download, the "Download for Intel" link (`/download/mac-x64`) on
      the desktop install page, rather than the Apple Silicon download.
    source: omnigent.ai/docs/interact/desktop (macOS install links); web/electron/RELEASING.md:108
- id: codex-terminal-scrollback
  split: dev
  origin: github issue#6113
  cluster: sessions-and-desktop-app
  should_trigger: true
  prompt: How do I scroll back through earlier formatted output in a native `omnigent codex` terminal
    session when the mouse wheel and Page Up do nothing?
  criteria:
  - id: c1
    text: Says Page Up in Omnigent's managed terminal enters tmux copy mode scrolled up one page, where
      earlier output can be read, and that copy mode ends when the view is scrolled back to the bottom.
    check:
      any_of:
      - copy[- ]mode
    source: omnigent/inner/terminal.py:222-249 (_tmux_scrollback_key_commands binds PPage to copy-mode
      -eu)
  - id: c2
    text: Says the mouse wheel also scrolls back through the terminal history, because Omnigent turns
      on tmux mouse mode for its managed terminals.
    source: omnigent/inner/terminal.py:183-216 (mouse on); CHANGELOG.md:1294 (#6354)
  - id: c3
    text: Does not tell the user to enter copy mode with the tmux prefix (Ctrl-b then [), which Omnigent
      disables in its managed terminals.
    source: omnigent/inner/terminal.py:225-229 and :252-268 (prefix set to None, prefix table unbound)
- id: databricks-deploy-e2e-test
  split: test
  origin: session history
  cluster: databricks-and-login
  should_trigger: true
  prompt: What steps should I follow to test an Omnigent deployment on Databricks end to end?
  criteria:
  - id: c1
    text: 'For a self-managed Databricks Apps deployment, checks the app''s `/health` endpoint: `deploy/databricks/deploy.py`
      polls it until it returns 200, and it can be checked by hand with `curl` and a bearer token from
      `databricks auth token`.'
    check:
      any_of:
      - /health
    source: deploy/databricks/README.md:137-141 (Deploy) and :187-198 (Smoke check)
  - id: c2
    text: Signs the CLI in to the deployed server with `omnigent login <server-url>`, which runs the Databricks
      browser login for a Databricks-fronted server.
    check:
      cli:
      - login
    source: omnigent/cli.py:13091-13122 (login docstring, Databricks-fronted flow)
  - id: c3
    text: Registers a machine with the server using `omnigent host <server-url>` (or `--server`).
    check:
      cli:
      - host
    source: omnigent/cli.py:9164-9253 (host command; help examples use a databricksapps.com URL)
  - id: c4
    text: Starts a real session against the deployed server (in the web UI, or a CLI command with `--server`)
      and confirms that an agent turn completes.
    source: omnigent/cli.py:13110-13114 (later `omnigent run --server <url>` uses the stored login); feature-map/login-and-host-auth.md:3-6
- id: azure-custom-url-login
  split: test
  origin: github issue#2781
  cluster: databricks-and-login
  should_trigger: true
  prompt: Why does `omni login` not work with my Azure Databricks workspace's custom URL, and which URL
    should I use for `omni login` and `omni host`?
  criteria:
  - id: c1
    text: Explains that the custom (vanity) Azure URL redirects an unauthenticated request to its login
      page instead of answering Omnigent's probe, so login cannot detect that the server is Databricks-fronted.
    source: omnigent/cli.py:12482-12490 (_canonical_azure_databricks_url docstring)
  - id: c2
    text: Recommends the workspace's canonical URL, `https://adb-<workspace-id>.<n>.azuredatabricks.net`
      (for example with `/omnigent`), or the custom URL with the `?o=<workspace-id>` selector so Omnigent
      can derive that canonical host.
    check:
      any_of:
      - adb-
      - \?o=
    source: omnigent/cli.py:12565-12652 (_resolve_server_url falls back to the canonical adb- host for
      a vanity URL carrying ?o=); omnigent/cli.py:12520
  - id: c3
    text: Says to give `omnigent host` the same server URL (positionally or with `--server`); without
      one, host uses the default server that `omnigent login` saved.
    check:
      cli:
      - host
    source: omnigent/cli.py:9248-9253 (host falls back to config `server` and resolves it with _resolve_server_url);
      omnigent/cli.py:13065 (_remember_default_server)
- id: copilot-extra-with-databricks
  split: dev
  origin: github issue#8646
  cluster: databricks-and-login
  should_trigger: true
  prompt: Why does `omni copilot` fail with `CopilotExecutor requires the 'github-copilot-sdk' package`
    after I installed `omnigent[databricks]`, and how do I add Copilot support without dropping the Databricks
    extra?
  criteria:
  - id: c1
    text: Explains that the Copilot harness needs the optional `copilot` extra (the `github-copilot-sdk`
      package), which neither the default install nor the `databricks` extra includes.
    source: pyproject.toml:237-241 (copilot extra); omnigent/onboarding/copilot_auth.py:100-106
  - id: c2
    text: Recommends one install command that keeps both extras, for example `uv tool install --force
      "omnigent[databricks,copilot]"` (or the pipx/pip equivalent), or adding the Copilot SDK with `--with`
      while `omnigent[databricks]` stays the main package.
    check:
      any_of:
      - omnigent\\?\[[^\]]*databricks[^\]]*copilot
      - omnigent\\?\[[^\]]*copilot[^\]]*databricks
      - omnigent\\?\[databricks\\?\][\s\S]{0,80}--with[\s\S]{0,20}copilot
      - --with[\s\S]{0,20}omnigent\\?\[copilot\\?\][\s\S]{0,80}omnigent\\?\[databricks
      - --with[ =]+\S*github-copilot-sdk[\s\S]{0,80}omnigent\\?\[databricks
    source: omnigent/onboarding/extra_install.py:62-86 (the error's suggested `uv tool install --with
      "omnigent[copilot]" omnigent --force` reinstalls the base package); pyproject.toml:241, 295
- id: claude-native-model-dropdown-slash
  split: test
  origin: github issue#4754
  cluster: native-session-ui
  should_trigger: true
  prompt: Why does picking a model from the chat-mode model dropdown in a claude-native session put a
    `/model opus` command into my prompt instead of switching the model?
  criteria:
  - id: c1
    text: 'Explains that the `/model <name>` line is how Omnigent performs the switch: it types Claude
      Code''s `/model` command into the session''s Claude Code terminal, and the model changes when Claude
      Code runs it, so this is expected rather than a failed switch.'
    source: omnigent/runner/native_controls.py:1163-1176; web/src/lib/renderItems.ts:1356-1362
  - id: c2
    text: 'Gives the reason: a claude-native session is the real Claude Code TUI running in a terminal,
      and its `/model` command is the way to change a running session''s model, so Omnigent drives that
      command instead of a separate API.'
    source: omnigent/harnesses/claude_native/bridge.py:4566-4571 and :4606-4615 (inject_slash_command);
      omnigent/inner/claude_native_executor.py:231-245
- id: opencode-native-terminal-prompt
  split: test
  origin: github issue#8107
  cluster: native-session-ui
  should_trigger: true
  prompt: Why does my `opencode-native` session look stalled in the Omnigent Chat view with a pending
    tool and no approval card, and where do I answer the permission or question prompt?
  criteria:
  - id: c1
    text: Tells the user to open the session's Terminal view (the Chat/Terminal switcher in the session
      header) and answer OpenCode's prompt in its own terminal UI, after which the turn continues.
    check:
      any_of:
      - terminal\s+(view|tab|pane)
      - chat/terminal
    source: feature-map/terminals.md:12-14, 35 (Chat/Terminal switcher); omnigent/harnesses/opencode_native/forwarder.py:1227-1233
      (an answer given in the TUI is accepted)
  - id: c2
    text: Explains that OpenCode is blocked on its own permission or question prompt in its terminal UI,
      which the Chat view did not mirror as an approval card, so the tool stays pending until the prompt
      is answered.
    source: omnigent/harnesses/opencode_native/forwarder.py:1041-1048 (the question tool blocks the turn
      until answered) and :1088-1100 (only well-formed questions become a card)
- id: cursor-native-first-turn-model
  split: dev
  origin: github issue#8379
  cluster: native-session-ui
  should_trigger: true
  prompt: Why doesn't the Omnigent web UI offer a model picker for a Cursor (`cursor-native`) session
    in New Chat before the first message, and how do I make the first turn use the model I want?
  criteria:
  - id: c1
    text: Explains that New Chat offers no model setting for Cursor before the session exists (Cursor's
      entry has only its mode setting; model settings are offered for harnesses such as Claude Code, Codex,
      Pi, and Devin), so the first turn runs on Cursor's default model.
    source: 'web/src/shell/NewChatDialog.tsx:1316-1323 (agentHasModelSettings) and :4025-4037; web/src/lib/nativeCodingAgents.ts:188-196
      (cursor capabilities: cursorMode only)'
  - id: c2
    text: Recommends starting the session from the CLI with `omnigent cursor --model <model-id>` so the
      first turn uses that model.
    check:
      cli:
      - cursor
      options:
      - --model
    source: omnigent cursor --help (--model "Cursor model id to use for the native TUI"); .eval/mining/cli_reference.txt
- id: claude-native-running-permission-mode
  split: test
  origin: github issue#1454
  cluster: native-session-ui
  should_trigger: true
  prompt: Can I change the permission mode (for example to `plan` or `acceptEdits`) of a claude-native
    session that is already running, from the Omnigent web UI or the mobile app?
  criteria:
  - id: c1
    text: States that yes, a running claude-native session has a "Permission mode" picker in the web chat
      composer, and the mobile app has the same control because it loads the same web UI.
    source: web/src/pages/ChatPage.tsx:3835-3847 and :4412-4417 (shouldShowPermissionModeControl); web/ios/README.md:3-5
  - id: c2
    text: Confirms that Plan and Accept edits are among the modes a running session can switch to (the
      picker offers Manual, Accept edits, Plan, and Auto, the modes Claude Code reaches with shift+tab).
    source: web/src/lib/claudePermissionMode.ts:52-56 (CLAUDE_NATIVE_SWITCHABLE_PERMISSION_MODES)
- id: codex-web-approval-mode
  split: test
  origin: github issue#272
  cluster: claude-auth-and-setup
  should_trigger: true
  prompt: Can I choose an approval mode such as full-auto when I start a Codex session from the Omnigent
    web UI, the way Claude Code sessions get a Permission mode selector?
  criteria:
  - id: c1
    text: States that yes, when Codex is selected in the web UI's New Chat, a permission (approval) mode
      picker is offered before the session starts.
    source: web/src/lib/nativeCodingAgents.ts:125-134 (codex capability approvalMode); web/src/shell/NewChatDialog.tsx:3280
      and :4025-4031
  - id: c2
    text: 'Names a no-prompt choice in that picker: Full access (Codex runs with `--sandbox danger-full-access
      --ask-for-approval never`) or Bypass approvals & sandbox; the other choices are Default and Read
      only.'
    check:
      any_of:
      - full[ -]?access
      - bypass approvals
    source: web/src/lib/nativeHarnessModes.ts:171-219; web/src/lib/codexApprovalOptions.ts:1-33
- id: claude-subscription-auth
  split: test
  origin: github discussion#1133
  cluster: claude-auth-and-setup
  should_trigger: true
  prompt: How does Omnigent authenticate to Claude when I use a corporate Anthropic subscription instead
    of an API key?
  criteria:
  - id: c1
    text: 'Explains that Omnigent does not handle the subscription credential itself: it runs Claude Code
      (the `claude` CLI for claude-native, or the Claude Agent SDK, which drives Claude Code, for claude-sdk),
      and Claude Code signs in with its own subscription login, so no API key is needed.'
    source: omnigent/onboarding/provider_config.py:115-116 (subscription = a logged-in CLI that carries
      its own auth); omnigent/onboarding/harness_readiness.py:597-603
  - id: c2
    text: Says to sign Claude Code in with the subscription account, for example `claude auth login --claudeai`
      or `/login` inside Claude Code; Omnigent then uses that login as the Claude subscription credential.
    check:
      any_of:
      - claude\s+auth\s+login
      - /login
