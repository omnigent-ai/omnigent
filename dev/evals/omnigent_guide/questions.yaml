- id: pi-self-installed-version
  split: test
  origin: session history
  cluster: install-upgrade-uninstall
  should_trigger: true
  prompt: If I install a newer version of Pi myself, will Omnigent use it, and will that change which
    Pi tools I can use?
  criteria:
  - id: c1
    text: 'Says Omnigent does not ship its own Pi: it runs the `pi` CLI found on `PATH` (or the one named
      by `OMNIGENT_PI_PATH` or `harness.pi-native.command`), so a newer Pi you install is the one it uses.'
    source: omnigent/harnesses/pi_native/main.py:150-176 (resolve_pi_executable); omnigent/harness_startup_config.py:14-20
      (command precedence); omnigent/onboarding/harness_install.py:211-218 (setup installs @earendil-works/pi-coding-agent
      from npm)
  - id: c2
    text: States that Omnigent checks only a minimum Pi version and sets no upper limit, so a newer Pi
      release is accepted.
    source: omnigent/onboarding/harness_install.py:122 (_PI_MIN_VERSION = 0.84.2) and :211-218 (no max_version_exclusive
      for Pi, unlike OpenCode at :226-232); omnigent/harnesses/pi_native/main.py:75-100
  - id: c3
    text: 'Explains the effect on tools: in `omnigent pi` (pi-native) Pi keeps its own built-in tools,
      so a newer Pi''s built-ins come with it, plus Omnigent''s tools through its extension; the headless
      `pi` harness used by agent specs starts Pi with `--no-tools` and re-enables only the agent''s tools,
      so upgrading Pi does not change that set.'
    source: omnigent/runner/native/orchestration.py:2276-2307 (_build_pi_native_args adds only --extension,
      --approve and session flags); omnigent/inner/pi_executor.py:1915-1943 (--no-tools) and :2358-2381
      (--tools allowlist)
- id: windows-update-long-paths
  split: dev
  origin: github issue#8673
  cluster: install-upgrade-uninstall
  should_trigger: true
  prompt: Why does `omni update` on native Windows fail with `Filename too long` errors for my Git-based
    install, then leave my uv tool install broken with `No pyvenv.cfg file`? How do I recover?
  criteria:
  - id: c1
    text: Explains that a Git-based install is updated by reinstalling Omnigent from the GitHub repository
      (`uv tool install --reinstall` with the git URL), so the failure happens in the git checkout, which
      hits Windows path-length limits unless long-path support is enabled in git, and the interrupted
      reinstall leaves the uv tool environment broken.
    source: omnigent/cli.py:5862-5870 (VCS installs re-pull their git ref via _upgrade_vcs_install); omnigent/update_check.py:1546-1552
      (uv tool install --reinstall <git URL>)
  - id: c2
    text: 'Gives the recovery: remove the broken tool environment (`uv tool uninstall omnigent`) and reinstall
      with uv, for example `uv tool install --python 3.12 omnigent` as documented for native Windows (or
      reinstall from git after enabling long paths).'
    check:
      any_of:
      - uv tool install
    source: 'README.md:174-197 (Windows (native): uv tool install --python 3.12 omnigent)'
- id: db-upgrade-unknown-revision
  split: test
  origin: github issue#6719
  cluster: install-upgrade-uninstall
  should_trigger: true
  prompt: 'Why does `omnigent debug db-upgrade` on Omnigent 0.9.0 fail with `CommandError: Can''t locate
    revision identified by ''za2b3c4d5e6f''`, and how do I upgrade my local database?'
  criteria:
  - id: c1
    text: Explains that a newer Omnigent version already migrated the database, so its schema revision
      is unknown to the installed 0.9.0 build, and `db-upgrade` (which only migrates forward to that build's
      own latest revision) cannot handle it.
    source: 'omnigent/db/utils.py:745-764 (_verify_db_revision_is_supported: an unknown revision means
      the schema is newer; "Upgrade Omnigent before using this database"); omnigent/cli.py:11936-11963
      (debug db-upgrade runs migrations to head)'
  - id: c2
    text: Recommends upgrading Omnigent to the newer version that last used the database (or the latest
      release, for example with `omnigent upgrade`) instead of migrating with the old build; the newer
      build migrates the database itself on startup.
    source: omnigent/db/utils.py:768-832 (_initialize_or_verify_schema migrates a behind-head database
      automatically); README.md:202-216 (Updating to a new release)
- id: windows-uninstall-winerror-193
  split: test
  origin: github issue#8001
  cluster: install-upgrade-uninstall
  should_trigger: true
  prompt: 'How do I uninstall Omnigent on Windows 11 when `omnigent uninstall` crashes with `OSError:
    [WinError 193] %1 is not a valid Win32 application`?'
  criteria:
  - id: c1
    text: Explains that `omnigent uninstall` runs the POSIX shell script `uninstall_oss.sh`, which native
      Windows cannot execute, so the built-in uninstaller does not work there.
    source: omnigent/cli.py:5345-5366 (uninstall runs the .sh script with subprocess.run); docs/UNINSTALL_DESIGN.md:17-24
      (pure POSIX sh)
  - id: c2
    text: Says to stop Omnigent's background processes first (`omnigent stop`).
    check:
      cli:
      - stop
      - server stop
    source: 'omnigent/cli.py:4985-4991 (stop: every host daemon and the background server)'
  - id: c3
    text: Says to remove the CLI with the tool that installed it, which for the documented native-Windows
      install is `uv tool uninstall omnigent` (or `pip uninstall omnigent` for a pip install).
    check:
      any_of:
      - uv tool uninstall
      - pip uninstall
    source: README.md:174-197 (native Windows installs with uv tool install --python 3.12 omnigent); scripts/uninstall_oss.sh:643-667
- id: public-roadmap
  split: dev
  origin: github discussion#780
  cluster: install-upgrade-uninstall
  should_trigger: true
  prompt: Is there a public roadmap for Omnigent, and where can I find it?
  criteria:
  - id: c1
    text: States that Omnigent's docs and website have no roadmap page, so there is no official published
      roadmap document to point to.
    source: 'CONTRIBUTING.md:9-12 (Issue prioritization: "not a delivery promise or roadmap commitment");
      .eval/site-routes.txt (no roadmap route on omnigent.ai)'
  - id: c2
    text: 'Points to where planned and shipped work is visible: the release notes (omnigent.ai/releases
      or CHANGELOG.md) and the project''s GitHub issues and discussions.'
    source: CHANGELOG.md:1-6 (curated highlights under /releases); .eval/site-routes.txt (/releases);
      CONTRIBUTING.md:1-4 (issues on GitHub)
- id: homebrew-old-version-setup-crash
  split: test
  origin: github issue#1881
  cluster: install-upgrade-uninstall
  should_trigger: true
  prompt: 'Why does `omni setup` on Omnigent 0.2.0 from Homebrew crash with `ValueError: select() requires
    at least one option`, and how do I get a newer version when `brew upgrade` stays on 0.2.0?'
  criteria:
  - id: c1
    text: Says the crash is a defect in that old 0.2.0 build (setup tried to show a menu with no options),
      so the fix is to move to a current release, not to change a setting.
    source: omnigent/onboarding/interactive.py:463 (select() raises on an empty option list); omnigent/cli_config.py:4207-4232
      (current setup menus always add a Quit row); CHANGELOG.md:8 and :2531 (v0.18.0 vs v0.2.0)
  - id: c2
    text: Says that when the Homebrew tap offers no newer version, install from PyPI instead, for example
      `uv tool install omnigent` (after `brew uninstall omnigent`, so only one copy is on PATH), then
      run `omnigent setup` again.
    check:
      any_of:
      - uv tool install
      - pip install
    source: 'README.md:94-112 (manual install: uv tool install omnigent or pip install; the Homebrew tap
      is a separate channel); omnigent/cli.py:5756-5797 (omni upgrade handles uv tool and pipx installs,
      not Homebrew)'
