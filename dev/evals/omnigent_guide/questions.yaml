      then ~/.config/gh)
  - id: c2
    text: Recommends forwarding gh's credentials into the session by listing the variable in `OMNIGENT_RUNNER_ENV_PASSTHROUGH`
      before the host starts, because `opencode serve` otherwise gets only a small environment allowlist.
    check:
      any_of:
