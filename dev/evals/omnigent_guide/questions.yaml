      setup`, which writes a `kind: gateway` entry under `providers:` in `~/.omnigent/config.yaml` with
      the base URL, key, and default model), so the picker lists the models that entry declares.'
    check:
      any_of:
      - omni(gent)? setup
      - 'providers:'
      - kind:\s*gateway
    source: 'README.md "3. Choose & switch models" (Gateway credential: LiteLLM base_url and key via omnigent
      setup); omnigent/onboarding/configure_models.py:943 (build_gateway_provider_entry); omnigent/harnesses/claude_native/main.py:3018
      (_provider_config_for_native_claude sets routable_models from the entry''s models)'
- id: resume-after-container-replacement
  split: test
  origin: github issue#9281
  cluster: native-harness-failures
  should_trigger: true
  prompt: After I replaced my Omnigent server container but kept its PostgreSQL database, resuming an
    older Claude native session fails with a 500 error; why, and how do I keep sessions resumable across
    container replacements?
  criteria:
  - id: c1
    text: Explains that PostgreSQL keeps the session rows, but the agent bundles the sessions resume from
      are kept in the server's artifact store, which by default is a local directory inside the container
      (`/data/artifacts` in the Docker image), so replacing the container deletes them.
    source: 'deploy/docker/entrypoint.py:62 (_DEFAULT_ARTIFACT_DIR = "/data/artifacts"), :248-266 (_select_artifact_store:
      local filesystem store unless an s3:// URI is set); omnigent/stores/artifact_store/__init__.py:1
      (blob storage for agent bundles)'
  - id: c2
    text: 'Recommends artifact storage that outlives the container: an S3-compatible bucket through `OMNIGENT_ARTIFACT_URI=s3://<bucket>[/prefix]`
      (or `artifact_store_uri:` in the server config), or a persistent volume mounted at the artifact
      directory.'
    source: deploy/docker/entrypoint.py:148-167 (ARTIFACT_DIR / artifact_location, and artifact_store_uri
      / OMNIGENT_ARTIFACT_URI must be s3://bucket[/prefix]); deploy/cloudflare/README.md:50
- id: goose-prompt-timeout
  split: dev
  origin: github issue#6201
  cluster: native-harness-failures
  should_trigger: true
  prompt: Can I raise the Goose harness's 300-second idle prompt timeout (and its 30-second init timeout)
    in Omnigent without patching `goose_executor.py`, so slow thinking models stop failing with 'Timeout
    waiting for goose response'?
  criteria:
  - id: c1
    text: States that the 300-second idle prompt timeout of the `goose` harness cannot be raised by any
      environment variable or config setting; it is a constant in `omnigent/inner/goose_executor.py`,
      so changing it needs a code change.
    source: omnigent/inner/goose_executor.py:135-136 (_PROMPT_TIMEOUT_SECONDS = 300.0, no env read) and
      :1188-1194 (the "Timeout waiting for goose response" error)
  - id: c2
    text: States that the 30-second init timeout is also a fixed constant with no override.
    source: omnigent/inner/goose_executor.py:137 (_INIT_TIMEOUT_SECONDS = 30.0)
- id: windows-claude-native-not-configured
  split: test
  origin: github issue#9672
  cluster: native-harness-failures
  should_trigger: true
  prompt: On native Windows 11, why does my host report `claude-native` as "not configured" even though
    `claude.exe` is installed in `~/.local/bin` and runs from my shell?
  criteria:
  - id: c1
    text: States that native terminal harnesses such as `claude-native` are not supported on native Windows
      (they need tmux and a POSIX PTY), so the host reports them as unavailable whether or not `claude.exe`
      is installed.
    source: README.md "Windows (native)" (native omnigent claude/codex/cursor wrappers are not available
      on Windows); omnigent/onboarding/harness_readiness.py:235-237; omnigent/runner/native/orchestration.py:7820-7826
  - id: c2
    text: Recommends an SDK harness such as `claude-sdk` on native Windows, or running the host under
      WSL (or on Linux or macOS) to use `claude-native`.
    check:
      any_of:
      - claude-sdk
      - SDK(-based)? harness
      - \bWSL\b
    source: omnigent/runner/native/orchestration.py:7823-7825 ("Use an SDK-based harness (e.g. claude-sdk
      ...) or run it on Linux/macOS"); omnigent/cli_common.py:28-43; README.md "Windows (native)" ("use
      Linux/macOS, or WSL")
- id: claude-native-default-model-unset
  split: test
  origin: session history
  cluster: native-harness-failures
  should_trigger: true
  prompt: Which model does the Claude Code harness use by default when my agent spec does not set a model?
  criteria:
  - id: c1
    text: States that for the Claude Code (`claude-native`) harness, when nothing selects a model, Omnigent
      starts Claude Code without a `--model` flag, so Claude Code's own default model applies (its own
      settings or `/model` choice, or the account's default).
    source: 'omnigent/harnesses/claude_native/main.py:6494-6513 (_merge_default_model_arg adds --model
      only when a model is configured); omnigent/inner/claude_sdk_executor.py:2581-2584 (no model: "lets
      the SDK pick its own default")'
