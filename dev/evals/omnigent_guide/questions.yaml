    source: omnigent/harnesses/opencode_native/app_server.py:62-84 and :346-361 (passthrough keys plus
      names in OMNIGENT_RUNNER_ENV_PASSTHROUGH); omnigent/host/connect.py:784-790 and :880-916 (host forwards
      the listed names to runners); CHANGELOG.md:1143 (#5041)
  - id: c3
    text: Names a variable gh reads for this, such as `GH_TOKEN` (or `GITHUB_TOKEN`), or `GH_CONFIG_DIR`
      pointing at the real gh config directory.
    check:
      any_of:
      - GH_TOKEN
      - GITHUB_TOKEN
      - GH_CONFIG_DIR
    source: omnigent/git_providers/github.py:45-56 (GH_CONFIG_DIR override); omnigent/runner/github_resource.py:21
      (gh ranks GH_TOKEN/GITHUB_TOKEN above hosts.yml)
- id: codex-native-bwrap-home-workspace
  split: test
  origin: github issue#8027
  cluster: sandboxes-and-shell-env
  should_trigger: true
  prompt: Why does a `codex-native` session in the `linux_bwrap` sandbox exit within seconds with `CODEX_HOME
    points to ... but that path does not exist` and then fail with `Codex app-server never started a thread
    (startup timed out)` when my workspace is my home directory?
  criteria:
  - id: c1
    text: Explains that `linux_bwrap` hides the top-level hidden (dot) directories of the working directory
      behind an empty tmpfs, so with the home directory as the workspace `~/.omnigent` is masked inside
      the sandbox.
    source: omnigent/inner/bwrap_sandbox.py:24-30 (cwd dotdirs tmpfs-masked unless allowed) and :559-581
      (masks are emitted after the binds, so they win)
  - id: c2
    text: States that codex-native keeps the session's `CODEX_HOME` under `~/.omnigent/codex-native/`,
      so the mask makes Codex report that `CODEX_HOME` does not exist and the app-server never starts.
    source: omnigent/harnesses/codex_native/bridge.py:92 (_BRIDGE_ROOT = ~/.omnigent/codex-native) and
      :490-498 (codex_home_for_bridge_dir)
  - id: c3
    text: 'Recommends using a project directory instead of the home directory as the session''s workspace,
      or running without the sandbox (`os_env.sandbox.type: none`).'
    source: omnigent/inner/bwrap_sandbox.py:24-30 (masking applies to the working directory's dotdirs);
      omnigent/inner/sandbox.py:1355-1356 (`os_env.sandbox.type='none'` is the opt-out)
- id: ssh-agent-socket-in-sessions
  split: dev
