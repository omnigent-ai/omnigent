    text: Explains that with only the exported `ANTHROPIC_BASE_URL` (no Omnigent provider entry), Omnigent
      treats any host other than anthropic.com as a gateway that serves only its own model ids, so it
      drops the canonical `claude-*` models that Claude Code reported and nothing is left in the picker.
