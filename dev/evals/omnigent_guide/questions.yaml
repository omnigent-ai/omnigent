      error); omnigent/onboarding/secrets.py:1-26 (backends) and :179-204 (load_secret)
  - id: c2
    text: Recommends running `omnigent setup` again and re-entering the API key for that provider, which
      stores it under the name the config references.
    check:
      cli:
      - setup
    source: omnigent/cli_config.py:751-759 (a pasted key is stored with secret_store.store_secret and
      referenced as keychain:<name>) and :849-853 (gateway key)
