- id: pi-gateway-env-key-ref
  split: test
  origin: github issue#3788
  cluster: providers-and-gateways
  should_trigger: true
  prompt: 'Why does `omnigent run --harness pi` fail with `pi harness: provider ''my-gateway'' configures
    no family whose credentials resolve` when my `kind: gateway` provider in `~/.omnigent/config.yaml`
    uses `api_key_ref: env:MY_TOKEN` and I have exported MY_TOKEN in my shell?'
  criteria:
  - id: c1
    text: 'Explains that the session does not run in the shell where MY_TOKEN was exported: Omnigent''s
      background host daemon, which spawns the session runner, starts with an allowlisted environment
      (known provider variables and `OMNIGENT_`-prefixed names), so a custom variable such as MY_TOKEN
      is dropped and `env:MY_TOKEN` cannot resolve.'
    source: 'omnigent/cli.py:3560-3622 (_build_host_daemon_env: local mode keeps only allowlisted names
      and prefixes); omnigent/cli.py:728-736 (_LOCAL_DAEMON_ENV_PREFIXES includes OMNIGENT_); tests/cli/test_backend.py:304-330
      (an unrelated GITHUB_TOKEN is stripped)'
  - id: c2
    text: 'Gives a fix that gets the key past that filtering: export it as `OMNIGENT_MY_TOKEN` (which
      `env:MY_TOKEN` also resolves and the daemon keeps), or store the key in Omnigent''s secret store
      with `omnigent setup` so the provider uses `api_key_ref: keychain:<name>`.'
    source: 'omnigent/onboarding/provider_config.py:563-576 (env: refs fall back to OMNIGENT_<VAR>; the
      error names both); omnigent/util/env_credentials.py:39-58; omnigent/cli_config.py:849-853 and :914
      (setup stores a gateway key as keychain:<name>)'
  - id: c3
    text: If it recommends an environment-variable fix, says to restart Omnigent's background processes
      (for example `omnigent stop`, then run again), because a daemon that is already running keeps the
      environment it started with.
    source: omnigent/cli.py:3505-3512 (an existing daemon is reused); omnigent/cli.py:4985-4991 (stop)
- id: codex-subagent-openrouter-gateway
  split: test
  origin: github issue#59
  cluster: providers-and-gateways
  should_trigger: true
  prompt: Why does my Polly `codex` sub-agent on the codex-native harness fail with `Codex native bridge
    state is missing` when an OpenRouter gateway is the default openai-family provider in `~/.omnigent/config.yaml`,
    even though `codex login status` says I'm logged in with ChatGPT? How do I get it working?
  criteria:
  - id: c1
    text: Explains that Omnigent routes a Codex harness through the default provider for the `openai`
      family in `~/.omnigent/config.yaml` (unless the agent names a provider), so the sub-agent goes through
      the OpenRouter gateway instead of the ChatGPT login.
    source: omnigent/onboarding/provider_config.py:164-175 (codex-native consumes the openai family) and
      :1397-1424 (default_provider_for_harness); omnigent/harnesses/codex_native/app_server.py:4034
  - id: c2
    text: 'States that Codex can use only an OpenAI Responses API endpoint, so a gateway set up for Chat
      Completions (`wire_api: chat`, as Omnigent configures OpenRouter) cannot serve it.'
    source: omnigent/inner/codex_executor.py:2236-2256 (codex >= 0.137 rejects wire_api chat); omnigent/runtime/workflow.py:843-850;
      omnigent/onboarding/configure_models.py:202-203 (OpenRouter preset uses the chat wire); omnigent/cli_config.py:884-887
  - id: c3
    text: 'Recommends making the ChatGPT (Codex) subscription the default for Codex/`openai` (for example
      `omnigent setup` → Codex → the subscription → "Make default for Codex") and keeping the gateway
      as the default only for Pi (`default: pi`).'
    source: omnigent/cli_config.py:3068-3110 (Make default for <harness>) and :3237-3258; omnigent/onboarding/provider_config.py:1670-1720
      (set_default_provider clears only that scope) and :829-891 (a provider may claim the pi scope alone)
- id: missing-stored-provider-secret
  split: dev
  origin: github issue#1637
  cluster: providers-and-gateways
  should_trigger: true
  prompt: 'How do I fix `OmnigentError: no stored secret named ''my-gateway''; run omnigent setup --no-internal-beta
    to set it`, which appears when I switch to Polly in the web UI and ask a question?'
  criteria:
  - id: c1
