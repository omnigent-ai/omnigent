- id: copilot-token-auth-failure
  split: test
  origin: session history
  cluster: providers-and-gateways
  should_trigger: true
  prompt: Why does the Copilot harness in Omnigent keep failing to authenticate when GitHub shows that
    my token is not expired?
  criteria:
  - id: c1
    text: States that Copilot accepts only a fine-grained personal access token with the "Copilot Requests"
      permission or an OAuth token (from the GitHub CLI or the Copilot CLI login), and rejects a classic
      `ghp_` token even when it has not expired.
    source: docs/AGENT_YAML_SPEC.md:189-205 (GitHub Copilot); omnigent/onboarding/copilot_auth.py:24-28
      and :57-61
  - id: c2
    text: 'Explains which token Omnigent sends: the agent spec''s `auth.api_key`, else the token saved
      with `omnigent setup` (the `copilot:` block in `~/.omnigent/config.yaml`), else `COPILOT_GITHUB_TOKEN`
      / `GH_TOKEN` / `GITHUB_TOKEN`, else the GitHub CLI login, so a different token from the one checked
      can be in use.'
    source: omnigent/runtime/workflow.py:2486-2560 (_build_copilot_spawn_env precedence); docs/AGENT_YAML_SPEC.md:199-201
  - id: c3
    text: Recommends setting or replacing the token through `omnigent setup` → Copilot ("Set GitHub token"
      / "Replace GitHub token"), which keeps it in Omnigent's secret store where the background host can
      read it.
    check:
      cli:
      - setup
    source: omnigent/cli_config.py:2892-2960 (_manage_copilot_harness); omnigent/onboarding/copilot_auth.py:1-19;
      shell GH_TOKEN/GITHUB_TOKEN are not in the daemon or runner allowlists (omnigent/cli.py:690-736,
      omnigent/host/connect.py:762-783, tests/cli/test_backend.py:318-329)
- id: uninstall-script-missing
