- id: claude-native-picker-ambient-gateway
  split: test
  origin: github issue#8559
  cluster: native-harness-failures
  should_trigger: true
  prompt: Why is the claude-native model picker empty ("Models unavailable") when I export `ANTHROPIC_BASE_URL`
    to point Claude Code at a LiteLLM gateway, even though Claude Code's own `/model` lists the models?
  criteria:
