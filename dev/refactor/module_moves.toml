[packages."omnigent.core"]
doc = "Agent definition types and the executor contract; the library API re-exported by :mod:`omnigent`."

[packages."omnigent.observability"]
doc = "Process logging, debug event sinks, OpenTelemetry tracing, and startup milestones."

[packages."omnigent.models.signer"]
doc = "Trusted model-request signer: credentials stay outside the agent sandbox."

[packages."omnigent.harnesses.native"]
doc = "Infrastructure shared by native (terminal UI) harnesses."

[packages."omnigent.harnesses.acp"]
doc = "Generic Agent Client Protocol (ACP) harness and the ACP CLI catalog."

[packages."omnigent.harnesses.antigravity"]
doc = "Google Antigravity SDK harness."

[packages."omnigent.harnesses.claude_sdk"]
doc = "Claude Agent SDK harness."

[packages."omnigent.harnesses.codex"]
doc = "Codex App Server (headless) harness."

[packages."omnigent.harnesses.copilot"]
doc = "GitHub Copilot SDK harness."

[packages."omnigent.harnesses.cursor"]
doc = "Cursor SDK harness."

[packages."omnigent.harnesses.databricks"]
doc = "Databricks Foundation Model API executor."

[packages."omnigent.harnesses.goose"]
doc = "Goose (ACP mode) headless harness."

[packages."omnigent.harnesses.hermes"]
doc = "Hermes Agent CLI headless harness."

[packages."omnigent.harnesses.kimi"]
doc = "Kimi Code CLI headless harness."

[packages."omnigent.harnesses.open_responses"]
doc = "OpenAI Responses API executor."

[packages."omnigent.harnesses.openai_agents"]
doc = "OpenAI Agents SDK harness."

[packages."omnigent.harnesses.pi"]
doc = "Pi coding agent (RPC mode) harness."

[packages."omnigent.harnesses.qwen"]
doc = "Qwen Code (ACP mode) headless harness."

[cleanup]
delete_empty = ["omnigent.native", "omnigent.server.routes._sessions"]
exclude = ["CHANGELOG.md", "uv.lock", "pnpm-lock.yaml", "**/package-lock.json", "dev/refactor/*", "tests/dev/test_relocate_modules.py"]
