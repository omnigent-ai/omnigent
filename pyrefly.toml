project-includes = [
    "omnigent/**/*.py",
    "omnigent/**/*.pyi",
    "sdks/python-client/**/*.py",
]

project-excludes = []

# Editable workspace packages are project sources, not third-party site packages.
disable-project-excludes-heuristics = true

python-version = "3.12"

search-path = ["."]

disable-search-path-heuristics = true

# Optional/proprietary integrations are intentionally absent from the
# standard development environment.
ignore-missing-imports = [
    "boxlite",
    "boxlite.*",
    "blaxel",
    "blaxel.*",
    "copilot",
    "copilot.*",
    "cursor_sdk",
    "cursor_sdk.*",
    "cwsandbox",
    "cwsandbox.*",
    "databricks",
    "databricks.*",
    "daytona",
    "daytona.*",
    "e2b",
    "e2b.*",
    "google.auth",
    "google.auth.*",
    "hvac",
    "hvac.*",
    "islo",
    "islo.*",
    "kubernetes",
    "kubernetes.*",
    "modal",
    "modal.*",
    "numpy",
    "numpy.*",
    "omnigent.onboarding.internal_beta",
    "openshell",
    "openshell.*",
]

ignore-errors-in-generated-code = true
