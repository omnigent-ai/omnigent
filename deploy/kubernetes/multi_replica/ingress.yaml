# Local prototype: one F5 OSS NGINX controller, no custom resources or TLS.
apiVersion: v1
kind: Namespace
metadata:
  name: omnigent-prototype
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx
  namespace: omnigent-prototype
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omnigent-prototype-nginx
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omnigent-prototype-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omnigent-prototype-nginx
subjects:
  - kind: ServiceAccount
    name: nginx
    namespace: omnigent-prototype
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx
  namespace: omnigent-prototype
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods, secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx
  namespace: omnigent-prototype
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nginx
subjects:
  - kind: ServiceAccount
    name: nginx
    namespace: omnigent-prototype
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: omnigent-prototype
spec:
  controller: nginx.org/ingress-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: omnigent-prototype
data:
  worker-processes: "1"
  worker-shutdown-timeout: "2s"
  http-snippets: |
    # Let Kubernetes change membership; individual requests must not fail over.
    proxy_next_upstream off;
    map $http_x_databricks_omnigent_slice_key $omnigent_host_key {
        ""      $arg_omnigent_slice_key;
        default $http_x_databricks_omnigent_slice_key;
    }
  server-snippets: |
    add_header X-Omnigent-Upstream $upstream_addr always;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: omnigent-prototype
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: nginx
      containers:
        - name: nginx
          image: nginx/nginx-ingress:5.2.1
          args:
            - -nginx-configmaps=$(POD_NAMESPACE)/nginx-config
            - -ingress-class=omnigent-prototype
            - -watch-namespace=omnigent-prototype
            - -enable-custom-resources=false
            - -enable-leader-election=false
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /nginx-ready
              port: 8081
            periodSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: omnigent-prototype
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnigent
  namespace: omnigent-prototype
  annotations:
    nginx.org/lb-method: "hash $omnigent_host_key consistent"
    nginx.org/websocket-services: omnigent
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/max-fails: "0"
spec:
  ingressClassName: omnigent-prototype
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omnigent
                port:
                  number: 8000
