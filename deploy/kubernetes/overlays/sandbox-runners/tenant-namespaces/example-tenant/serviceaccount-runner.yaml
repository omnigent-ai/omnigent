---
# Powerless runner SA (see ../../serviceaccount-runner.yaml), one per tenant
# namespace; `sandbox.kubernetes.service_account` names it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnigent-runner
  namespace: omnigent-u-alice
  labels:
    app.kubernetes.io/name: omnigent
    app.kubernetes.io/component: runner
    omnigent.ai/tenant: alice
automountServiceAccountToken: false
