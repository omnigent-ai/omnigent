apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnigent-to-openshell-gateway
  labels:
    app: omnigent
spec:
  podSelector:
    matchLabels:
      app: omnigent
  policyTypes:
    - Egress
  egress:
    # DNS — required for any name resolution (kube-dns / CoreDNS).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Database — the base config connects via DATABASE_URL on port 5432.
    # Tighten the CIDR to your database host or use a namespaceSelector
    # if the database runs in-cluster.
    - ports:
        - protocol: TCP
          port: 5432
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
    # OpenShell gateway — the in-cluster gateway listens on 8080
    # (http://openshell.openshell.svc.cluster.local:8080).
    - ports:
        - protocol: TCP
          port: 8080
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshell
    # General HTTPS egress (LLM providers, package mirrors, etc.).
    - ports:
        - protocol: TCP
          port: 443
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
