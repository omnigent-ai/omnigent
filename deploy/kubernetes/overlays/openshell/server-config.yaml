apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-server-config
  labels:
    app: omnigent
data:
  config.yaml: |
    # Server config consumed by load_server_config() via OMNIGENT_CONFIG.
    # Only the sandbox section is required here — secrets (DATABASE_URL,
    # cookie secret, LLM keys) stay in the environment per 12-factor.
    sandbox:
      provider: openshell
      # Public URL that sandboxes dial back to (must be reachable from the
      # sandbox network namespace).
      server_url: https://omnigent.example.com
      openshell:
        # Derived host image carrying your policy (deploy/openshell/README.md).
        # image: registry.example.com/omnigent-host-openshell:latest

        # SERVER env var NAMES whose values are injected into sandboxes at
        # provision time: LLM keys, plus the proxy names hosts pass to runners.
        env:
          - ANTHROPIC_API_KEY
          - OPENAI_API_KEY
          - GEMINI_API_KEY
          - OMNIGENT_RUNNER_ENV_PASSTHROUGH
        # Gateway directory under ~/.config/openshell/gateways/ that the
        # deployment patch mounts from the openshell-gateway-config Secret.
        cluster: openshell
