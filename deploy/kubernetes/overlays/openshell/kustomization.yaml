apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omnigent

resources:
  - ../../base
  - server-config.yaml
  - gateway-networkpolicy.yaml
  - sandbox-rbac.yaml
  - sandbox-clusterrole.yaml
  - sandbox-clusterrolebinding.yaml

# Use the server image variant that includes the openshell SDK extra
# (built by CI with OMNIGENT_EXTRAS=openshell).
images:
  - name: ghcr.io/omnigent-ai/omnigent-server
    newName: ghcr.io/omnigent-ai/omnigent-server-openshell

patches:
  - path: configmap-patch.yaml
  - path: secret-patch.yaml
  - path: deployment-patch.yaml

secretGenerator:
  - name: openshell-gateway-config
    literals:
      - active_gateway=openshell
      - 'metadata.json={"name":"openshell","gateway_endpoint":"http://openshell.openshell.svc.cluster.local:8080","is_remote":false,"gateway_port":8080,"auth_mode":"plaintext"}'
    options:
      disableNameSuffixHash: true