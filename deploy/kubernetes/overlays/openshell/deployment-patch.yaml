apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent
spec:
  template:
    spec:
      serviceAccountName: omnigent
      containers:
        - name: omnigent
          volumeMounts:
            # The server runs as root, so the SDK reads its gateway config
            # from /root/.config/openshell/gateways/<cluster>/.
            - name: openshell-gateway
              mountPath: /root/.config/openshell
              readOnly: true
            - name: server-config
              mountPath: /data/server-config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: openshell-gateway
          secret:
            secretName: openshell-gateway-config
            optional: true
            # Secret keys cannot contain "/", so map them onto the SDK's
            # layout. The directory name must match sandbox.openshell.cluster.
            items:
              - key: metadata.json
                path: gateways/openshell/metadata.json
              - key: ca.crt
                path: gateways/openshell/mtls/ca.crt
              - key: tls.crt
                path: gateways/openshell/mtls/tls.crt
              - key: tls.key
                path: gateways/openshell/mtls/tls.key
        - name: server-config
          configMap:
            name: omnigent-server-config
