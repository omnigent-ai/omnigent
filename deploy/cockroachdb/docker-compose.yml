    ports:
      - "26325:26257"
      - "27325:8080"
    volumes:
      - crdb-25-2-10-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute=SELECT 1"]
