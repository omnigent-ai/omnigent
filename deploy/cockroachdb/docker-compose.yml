      start_period: 3s

volumes:
  crdb-23-2-28-data:
    name: omnigent-crdb-23-2-28-data
  crdb-24-3-20-data:
    name: omnigent-crdb-24-3-20-data
  crdb-25-2-10-data:
    name: omnigent-crdb-25-2-10-data
  crdb-25-4-5-data:
    name: omnigent-crdb-25-4-5-data
