      retries: 30
      start_period: 3s

  crdb-25-4-5:
    image: cockroachdb/cockroach:v25.4.5
    command: start-single-node --insecure --store=/cockroach/cockroach-data
    ports:
      - "26326:26257"
      - "27326:8080"
