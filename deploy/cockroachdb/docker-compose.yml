services:
  crdb-23-2-28:
    image: cockroachdb/cockroach:v23.2.28
    command: start-single-node --insecure --store=/cockroach/cockroach-data
    ports:
      - "26323:26257"
      - "27323:8080"
    volumes:
      - crdb-23-2-28-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "--execute=SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  crdb-24-3-20:
    image: cockroachdb/cockroach:v24.3.20
    command: start-single-node --insecure --store=/cockroach/cockroach-data
    ports:
