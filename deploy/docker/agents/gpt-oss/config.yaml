spec_version: 1
name: gpt-oss
description: General-purpose gpt-oss-120b agent (via Bedrock) with filesystem + shell tools.

spawn: true

executor:
  type: omnigent
  config:
    harness: openai-agents
    model: openai.gpt-oss-120b-1:0
    auth:
      type: provider
      name: bedrock-oss

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

prompt: |
  You are a helpful, capable assistant running on gpt-oss-120b. You have
  filesystem and shell access via your sys_os_* tools — use them to read,
  write, and run things when the task calls for it. Be concise.
